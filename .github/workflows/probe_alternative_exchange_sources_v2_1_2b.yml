name: Probe Alternative Exchange Sources V2.1.2b

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alternative-exchange-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-alternative-exchanges.txt

      - name: Run offline self-test
        run: python alternative_exchange_sources_selftest.py

      - name: Probe Kraken, Bitget, OKX, Coinbase and KuCoin control
        env:
          ALT_EXCHANGE_HTTP_TIMEOUT: "12"
        run: python alternative_exchange_sources.py

      - name: Print readable report
        if: always()
        run: |
          test -f reports/alternative_exchange_source_diagnostics.md && cat reports/alternative_exchange_source_diagnostics.md || true

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alternative-exchange-source-diagnostics-v2-1-2
          if-no-files-found: warn
          retention-days: 30
          path: |
            reports/alternative_exchange_source_diagnostics.md
            reports/alternative_exchange_source_diagnostics.json
            reports/alternative_exchange_source_capabilities.csv
            reports/alternative_exchange_source_samples.json

      - name: Commit readable diagnostics
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reports/alternative_exchange_source_diagnostics.md \
            reports/alternative_exchange_source_diagnostics.json \
            reports/alternative_exchange_source_capabilities.csv \
            reports/alternative_exchange_source_samples.json
          if git diff --cached --quiet; then
            echo "No diagnostic changes to commit."
          else
            git commit -m "Add alternative exchange source diagnostics v2.1.2"
            git push
          fi
