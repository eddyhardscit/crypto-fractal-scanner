name: SOL Live Auto Guarded

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "status = nessun ordine; execute = consente ordini reali protetti"
        required: true
        default: status
        type: choice
        options:
          - status
          - execute
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sol-live-auto-guarded
  cancel-in-progress: false

jobs:
  run-sol-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      KUCOIN_LIVE_API_KEY: ${{ secrets.KUCOIN_LIVE_API_KEY }}
      KUCOIN_LIVE_API_SECRET: ${{ secrets.KUCOIN_LIVE_API_SECRET }}
      KUCOIN_LIVE_API_PASSPHRASE: ${{ secrets.KUCOIN_LIVE_API_PASSPHRASE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SOL_LIVE_RELEASE_TAG: sol-live-state-v1
      SOL_LIVE_STATE_ARCHIVE: sol-live-state.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pandas numpy requests urllib3

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            sol_spot_live_guarded.py \
            sol_spot_live_config.json \
            sol_spot_adaptive_bot.py \
            kucoin_spot_private.py \
            sol_spot_live_telegram.py
          do
            test -f "$f" || { echo "File mancante: $f"; exit 1; }
          done

      - name: Verify KuCoin secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KUCOIN_LIVE_API_KEY" || { echo "Secret KUCOIN_LIVE_API_KEY mancante"; exit 1; }
          test -n "$KUCOIN_LIVE_API_SECRET" || { echo "Secret KUCOIN_LIVE_API_SECRET mancante"; exit 1; }
          test -n "$KUCOIN_LIVE_API_PASSPHRASE" || { echo "Secret KUCOIN_LIVE_API_PASSPHRASE mancante"; exit 1; }

      - name: Restore persistent live state from GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports
          if gh release view "$SOL_LIVE_RELEASE_TAG" >/dev/null 2>&1; then
            rm -f "$SOL_LIVE_STATE_ARCHIVE"
            gh release download "$SOL_LIVE_RELEASE_TAG" \
              --pattern "$SOL_LIVE_STATE_ARCHIVE" \
              --clobber || true
            if [ -s "$SOL_LIVE_STATE_ARCHIVE" ]; then
              tar -xzf "$SOL_LIVE_STATE_ARCHIVE"
              echo "Stato live ripristinato."
            else
              echo "Release presente ma archivio stato assente: il runner applicherà i blocchi di sicurezza."
            fi
          else
            echo "Prima esecuzione: nessuna release stato presente."
          fi

      - name: Read-only status before any execution
        shell: bash
        run: |
          set -euo pipefail
          python sol_spot_live_guarded.py status

      - name: Decide requested mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=status" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute guarded live cycle
        if: steps.mode.outputs.mode == 'execute'
        shell: bash
        run: |
          set -euo pipefail
          python sol_spot_live_guarded.py execute \
            --confirm I_UNDERSTAND_THIS_PLACES_REAL_ORDERS

      - name: Write final status
        if: always()
        shell: bash
        run: |
          python sol_spot_live_guarded.py status || true

      - name: Persist state and logs to GitHub Release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports
          files=()
          for f in \
            reports/sol_spot_live_state.json \
            reports/sol_spot_live_status.json \
            reports/sol_spot_live_orders.csv \
            reports/sol_spot_live_telegram_state.json \
            reports/sol_range_observation_events.jsonl
          do
            [ -f "$f" ] && files+=("$f")
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nessun file di stato da salvare."
            exit 0
          fi

          tar -czf "$SOL_LIVE_STATE_ARCHIVE" "${files[@]}"

          if ! gh release view "$SOL_LIVE_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$SOL_LIVE_RELEASE_TAG" \
              --title "SOL Live Bot Persistent State" \
              --notes "Stato persistente del bot SOL live. Non contiene chiavi API."
          fi

          gh release upload "$SOL_LIVE_RELEASE_TAG" \
            "$SOL_LIVE_STATE_ARCHIVE" \
            --clobber

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-live-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            reports/sol_spot_live_status.json
            reports/sol_spot_live_orders.csv
            reports/sol_range_observation_events.jsonl
