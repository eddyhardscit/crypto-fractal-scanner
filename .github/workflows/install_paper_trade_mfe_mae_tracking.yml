name: Manual install paper trade MFE MAE tracking

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-install-paper-trade-mfe-mae
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MFE MAE tracking
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import base64
          from pathlib import Path

          patch_sets = {'engine': [('ICAgICJ0YXJnZXRfcHJpY2UiLCAiZ3Jvc3NfcG5sX2V1ciIsICJlbnRyeV9mZWVfZXVyIiwgImV4aXRfZmVlX2V1ciIsICJmdW5kaW5nX3BubF9ldXIiLAogICAgIm5ldF9wbmxfZXVyIiwgInJldHVybl9vbl9tYXJnaW5fcGN0IiwgInJfbXVsdGlwbGUiLCAiY2xvc2VfcmVhc29uIiwgInNpZ25hbF9zY29yZSIsICJjb25maWRlbmNlIiwKICAgICJzb3VyY2UiLCAiZXVyX3VzZHRfcmF0ZSIK', ''), ('ICAgICAgICAiZW50cnlfZmVlX2V1ciI6IGVudHJ5X2ZlZV9ldXIsCiAgICAgICAgImZ1bmRpbmdfcG5sX2V1ciI6IDAuMCwKICAgICAgICAibGFzdF9mdW5kaW5nX3RpbWUiOiBpc29fdXRjKHdoZW4pLAo=', ''), ('ZGVmIG1heWJlX3RyYWlsKHBvc2l0aW9uOiBkaWN0W3N0ciwgQW55XSwgY2FuZGxlOiBwZC5TZXJpZXMsIG1hcms6IGZsb2F0KSAtPiBOb25lOgo=', ''), ('ICAgICAgICBwb3NpdGlvblsibGFzdF9wcm9jZXNzZWRfY2FuZGxlIl0gPSBjYW5kbGVfdGltZQogICAgICAgIG1heWJlX3RyYWlsKHBvc2l0aW9uLCBjYW5kbGUsIG1hcmspCg==', 'ICAgICAgICBwb3NpdGlvblsibGFzdF9wcm9jZXNzZWRfY2FuZGxlIl0gPSBjYW5kbGVfdGltZQogICAgICAgIHVwZGF0ZV9wb3NpdGlvbl9leGN1cnNpb25zKHBvc2l0aW9uLCBjYW5kbGUsIGNvbmZpZykKICAgICAgICBtYXliZV90cmFpbChwb3NpdGlvbiwgY2FuZGxlLCBtYXJrKQo='), ('ICAgIG9wZW5lZCA9IHBhcnNlX3RpbWUocG9zaXRpb25bIm9wZW5lZF9hdCJdKQogICAgaW5pdGlhbF9yaXNrID0gbWF4KGZsb2F0KHBvc2l0aW9uLmdldCgiaW5pdGlhbF9yaXNrX2V1ciIsIDAuMCkpLCAxZS05KQogICAgcmVjb3JkID0gewo=', ''), ('ICAgICAgICAicl9tdWx0aXBsZSI6IG5ldF90b3RhbCAvIGluaXRpYWxfcmlzaywKICAgICAgICAiY2xvc2VfcmVhc29uIjogcmVhc29uLAo=', ''), ('ICAgICAgICAibm90aW9uYWxfZXVyIiwgIm1hcmdpbl9ldXIiLCAibGV2ZXJhZ2UiLCAiaW5pdGlhbF9yaXNrX2V1ciIsICJlbnRyeV9mZWVfZXVyIiwgImZ1bmRpbmdfcG5sX2V1ciIsCiAgICAgICAgInNpZ25hbF9zY29yZSIsICJjb25maWRlbmNlIgo=', '')], 'report': [('ICAgICAgICBleHBvc3VyZSA9IGFnZ3JlZ2F0ZV9wb3NpdGlvbnMocG9zaXRpb25zKQogICAgICAgIHJvd3MuYXBwZW5kKAo=', ''), ('ICAgICAgICAgICAgICAgICJleHBlY3RhbmN5X2V1ciI6IGV4cGVjdGFuY3ksCiAgICAgICAgICAgICAgICAibmV0X3BubF9jbG9zZWRfZXVyIjogbmV0LAogICAgICAgICAgICAgICAgIm1heF9kcmF3ZG93bl9wY3QiOiBmbG9hdCgK', ''), ('ICAgICAgICAicHJvZml0X2ZhY3RvciIsICJleHBlY3RhbmN5X2V1ciIsICJuZXRfcG5sX2Nsb3NlZF9ldXIiLAogICAgICAgICJtYXhfZHJhd2Rvd25fcGN0Igo=', 'ICAgICAgICAicHJvZml0X2ZhY3RvciIsICJleHBlY3RhbmN5X2V1ciIsICJuZXRfcG5sX2Nsb3NlZF9ldXIiLAogICAgICAgICJhdmVyYWdlX21mZV9uZXRfZXVyIiwgImF2ZXJhZ2VfbWFlX25ldF9ldXIiLAogICAgICAgICJhdmVyYWdlX3Byb2ZpdF9yZXRhaW5lZF9wY3QiLCAicHJvZml0X3JldGVudGlvbl9zYW1wbGUiLAogICAgICAgICJtYXhfZHJhd2Rvd25fcGN0Igo=')], 'notify': [('ICAgICAgICAgICAgICAgICgKICAgICAgICAgICAgICAgICAgICBmIkV4aXQge2Zsb2F0KHRyYWRlLmdldCgnZXhpdF9wcmljZScsIDAuMCkpOi42Z30gwrcgIgogICAgICAgICAgICAgICAgICAgIGYiRHVyYXRhIHtfZm10X251bSh0cmFkZS5nZXQoJ2hvbGRpbmdfaG91cnMnKSl9IGgiCiAgICAgICAgICAgICAgICApLAo=', '')]}

          for filename, replacements in (
              ("paper_trading_engine.py", patch_sets["engine"]),
              ("paper_trading_report.py", patch_sets["report"]),
              ("paper_trading_notify.py", patch_sets["notify"]),
          ):
              path = Path(filename)
              source = path.read_text(encoding="utf-8")

              for old_encoded, new_encoded in replacements:
                  old = base64.b64decode(old_encoded).decode("utf-8")
                  new = base64.b64decode(new_encoded).decode("utf-8")

                  if new in source:
                      continue
                  if old not in source:
                      raise SystemExit(
                          f"{filename}: expected patch block not found"
                      )
                  source = source.replace(old, new, 1)

              ast.parse(source, filename=filename)
              path.write_text(source, encoding="utf-8")
          PY

      - name: Validate installation
        shell: bash
        run: |
          python -m pip install pandas requests
          python -m py_compile             paper_trading_engine.py             paper_trading_report.py             paper_trading_notify.py             paper_trading_trade_log_repair.py

          python - <<'PY'
          from paper_trading_engine import TRADE_FIELDS

          required = {
              "max_favorable_price",
              "max_adverse_price",
              "mfe_gross_eur",
              "mae_gross_eur",
              "mfe_net_eur",
              "mae_net_eur",
              "profit_retained_pct",
              "peak_profit_giveback_eur",
          }
          missing = sorted(required - set(TRADE_FIELDS))
          assert not missing, missing
          print("PASS: MFE/MAE and profit-retention fields installed")
          PY

          git diff --check

      - name: Commit MFE MAE tracking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             paper_trading_engine.py             paper_trading_report.py             paper_trading_notify.py

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "MFE/MAE tracking already installed."
          else
            git commit -m "Track MFE MAE and profit retention"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
