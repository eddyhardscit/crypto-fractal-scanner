name: Apply Paper Trading Diagnostics Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-paper-trading.txt

      - name: Add market freshness and near-miss diagnostics
        run: |
          cat > paper_trading_diagnostics.py <<'PY'
          # -*- coding: utf-8 -*-
          # Explain why paper-trading signals did or did not enter.

          from __future__ import annotations

          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from typing import Any

          import pandas as pd

          from kucoin_public_data import bundle_frames
          from paper_signal_engine import (
              Signal,
              _read_latest_by_asset,
              compute_features,
              exchange_overlay_for_asset,
              global_overlay_for_asset,
              score_features,
              strategy_accepts,
              EXCHANGE_METRICS_PATH,
              GLOBAL_METRICS_PATH,
          )
          from paper_trading_engine import (
              can_open,
              current_prices,
              portfolio_equity,
          )

          DIAGNOSTICS_PATH = Path(
              "reports/paper_trading_signal_diagnostics.json"
          )


          def _now(value: datetime | None = None) -> datetime:
              current = value or datetime.now(timezone.utc)
              if current.tzinfo is None:
                  current = current.replace(tzinfo=timezone.utc)
              return current.astimezone(timezone.utc)


          def _parse_time(value: Any) -> datetime | None:
              if value in (None, "", "n/a"):
                  return None
              try:
                  parsed = pd.Timestamp(value)
                  if parsed.tzinfo is None:
                      parsed = parsed.tz_localize("UTC")
                  return parsed.to_pydatetime().astimezone(
                      timezone.utc
                  )
              except Exception:
                  return None


          def _age_minutes(
              value: Any,
              current: datetime,
          ) -> float | None:
              parsed = _parse_time(value)
              if parsed is None:
                  return None
              return max(
                  0.0,
                  (current - parsed).total_seconds() / 60.0,
              )


          def annotate_market_freshness(
              bundle: dict[str, Any],
              config: dict[str, Any],
              current: datetime | None = None,
          ) -> dict[str, Any]:
              checked = _now(current)
              limit = float(
                  config.get("execution", {}).get(
                      "stale_data_minutes",
                      25,
                  )
              )
              generated = bundle.get("generated_utc")
              age = _age_minutes(generated, checked)
              source = str(bundle.get("source", "UNKNOWN"))
              fallback = "STALE_FALLBACK" in source.upper()
              stale = (
                  fallback
                  or age is None
                  or age > limit
              )
              if fallback:
                  status = "STALE_FALLBACK"
              elif age is None:
                  status = "UNKNOWN"
              elif age > limit:
                  status = "STALE"
              else:
                  status = "FRESH"

              bundle["_paper_freshness"] = {
                  "status": status,
                  "source": source,
                  "snapshot_generated_utc": str(
                      generated or "n/a"
                  ),
                  "checked_utc": checked.isoformat(
                      timespec="seconds"
                  ),
                  "snapshot_age_minutes": age,
                  "stale_limit_minutes": limit,
                  "fallback_used": fallback,
                  "new_entries_allowed": not stale,
              }
              return bundle


          def _strategy_reason(
              strategy: str,
              side: str,
              features: dict[str, Any],
          ) -> str:
              if strategy == "momentum_breakout":
                  expected = "UP" if side == "LONG" else "DOWN"
                  return (
                      "Filtro momentum: serve breakout "
                      f"{expected} oppure movimento breve ≥1,5%; "
                      f"breakout={features.get('breakout_state', 'NONE')}, "
                      f"movimento={features.get('ret_short_pct', 0.0):+.2f}%."
                  )
              if strategy == "relative_strength":
                  relative = (
                      0.65
                      * float(
                          features.get(
                              "relative_medium_pct",
                              0.0,
                          )
                      )
                      + 0.35
                      * float(
                          features.get(
                              "relative_long_pct",
                              0.0,
                          )
                      )
                  )
                  return (
                      "Filtro forza relativa: serve almeno ±2,0% "
                      f"contro BTC; valore={relative:+.2f}%."
                  )
              return "Filtro specifico della strategia non superato."


          def _timeframe_summary(
              frames: dict[str, dict[int, pd.DataFrame]],
              current: datetime,
              config: dict[str, Any],
          ) -> dict[str, Any]:
              grace = float(
                  config.get("execution", {}).get(
                      "stale_data_minutes",
                      25,
                  )
              )
              requested = sorted(
                  {
                      int(value)
                      for value in config.get(
                          "universe",
                          {},
                      ).get(
                          "timeframes_minutes",
                          [15, 60, 240],
                      )
                  }
              )
              output: dict[str, Any] = {}
              for timeframe in requested:
                  latest_values: list[datetime] = []
                  for asset_frames in frames.values():
                      frame = asset_frames.get(timeframe)
                      if frame is None or frame.empty:
                          continue
                      parsed = _parse_time(frame.index[-1])
                      if parsed is not None:
                          latest_values.append(parsed)
                  if not latest_values:
                      output[str(timeframe)] = {
                          "timeframe_minutes": timeframe,
                          "assets_with_data": 0,
                          "latest_closed_candle_utc": "n/a",
                          "oldest_closed_candle_utc": "n/a",
                          "max_candle_age_minutes": None,
                          "allowed_age_minutes": timeframe + grace,
                          "status": "NO_DATA",
                      }
                      continue
                  newest = max(latest_values)
                  oldest = min(latest_values)
                  max_age = max(
                      0.0,
                      (current - oldest).total_seconds()
                      / 60.0,
                  )
                  allowed_age = timeframe + grace
                  output[str(timeframe)] = {
                      "timeframe_minutes": timeframe,
                      "assets_with_data": len(latest_values),
                      "latest_closed_candle_utc": newest.isoformat(
                          timespec="seconds"
                      ),
                      "oldest_closed_candle_utc": oldest.isoformat(
                          timespec="seconds"
                      ),
                      "max_candle_age_minutes": max_age,
                      "allowed_age_minutes": allowed_age,
                      "status": (
                          "OK"
                          if max_age <= allowed_age
                          else "STALE_CANDLE"
                      ),
                  }
              return output


          def build_signal_diagnostics(
              bundle: dict[str, Any],
              config: dict[str, Any],
              signals: list[Signal],
              state: dict[str, Any],
              current: datetime | None = None,
          ) -> dict[str, Any]:
              checked = _now(current)
              if "_paper_freshness" not in bundle:
                  annotate_market_freshness(
                      bundle,
                      config,
                      checked,
                  )
              freshness = dict(bundle["_paper_freshness"])
              frames = bundle_frames(bundle)
              freshness["timeframes"] = _timeframe_summary(
                  frames,
                  checked,
                  config,
              )

              global_rows = _read_latest_by_asset(
                  GLOBAL_METRICS_PATH
              )
              exchange_rows = _read_latest_by_asset(
                  EXCHANGE_METRICS_PATH
              )
              btc_frames = frames.get("BTC", {})
              prices = current_prices(bundle)
              eur_rate = float(
                  bundle.get(
                      "eur_usdt_rate",
                      config.get("eur_usdt_fallback_rate", 1.0),
                  )
              )
              raw_by_key = {
                  (signal.portfolio, signal.asset): signal
                  for signal in signals
              }
              allowed_ids: list[str] = []
              rows: list[dict[str, Any]] = []
              near_gap = float(
                  config.get("notifications", {}).get(
                      "near_miss_score_gap",
                      1.5,
                  )
              )

              for definition in config.get("portfolios", []):
                  if not definition.get("enabled", True):
                      continue
                  portfolio_name = str(definition["name"])
                  portfolio = state.get("portfolios", {}).get(
                      portfolio_name,
                      {},
                  )
                  timeframe = int(
                      definition["timeframe_minutes"]
                  )
                  threshold = float(
                      definition["minimum_abs_score"]
                  )
                  strategy = str(
                      definition.get(
                          "strategy",
                          "confluence_trend",
                      )
                  )
                  for asset in sorted(bundle.get("assets", {})):
                      frame = frames.get(asset, {}).get(timeframe)
                      base = {
                          "portfolio": portfolio_name,
                          "is_main": bool(
                              definition.get("is_main")
                          ),
                          "strategy": strategy,
                          "asset": asset,
                          "timeframe_minutes": timeframe,
                          "minimum_abs_score": threshold,
                      }
                      if frame is None or len(frame) < 60:
                          rows.append(
                              {
                                  **base,
                                  "side": "n/a",
                                  "score": None,
                                  "score_gap": None,
                                  "confidence": "n/a",
                                  "candle_time": "n/a",
                                  "candle_age_minutes": None,
                                  "breakout_state": "n/a",
                                  "relative_strength_score": None,
                                  "status": "NO_FEATURES",
                                  "near_miss": False,
                                  "reason": (
                                      "Dati insufficienti: servono "
                                      "almeno 60 candele utilizzabili."
                                  ),
                                  "signal_id": "",
                              }
                          )
                          continue

                      btc_frame = btc_frames.get(timeframe)
                      features = compute_features(
                          frame,
                          (
                              btc_frame
                              if asset != "BTC"
                              else frame
                          ),
                      )
                      if not features:
                          rows.append(
                              {
                                  **base,
                                  "side": "n/a",
                                  "score": None,
                                  "score_gap": None,
                                  "confidence": "n/a",
                                  "candle_time": "n/a",
                                  "candle_age_minutes": None,
                                  "breakout_state": "n/a",
                                  "relative_strength_score": None,
                                  "status": "NO_FEATURES",
                                  "near_miss": False,
                                  "reason": (
                                      "Indicatori non calcolabili "
                                      "dalle candele disponibili."
                                  ),
                                  "signal_id": "",
                              }
                          )
                          continue

                      global_overlay, global_reason = (
                          global_overlay_for_asset(
                              asset,
                              global_rows,
                          )
                      )
                      exchange_overlay, exchange_reason = (
                          exchange_overlay_for_asset(
                              asset,
                              exchange_rows,
                          )
                      )
                      score, score_reasons = score_features(
                          features,
                          global_overlay,
                          exchange_overlay,
                      )
                      side = "LONG" if score > 0 else "SHORT"
                      candle_time = str(
                          features.get("candle_time", "n/a")
                      )
                      candle_age = _age_minutes(
                          candle_time,
                          checked,
                      )
                      allowed_candle_age = (
                          timeframe
                          + float(
                              config.get("execution", {}).get(
                                  "stale_data_minutes",
                                  25,
                              )
                          )
                      )
                      relative = (
                          0.65
                          * float(
                              features.get(
                                  "relative_medium_pct",
                                  0.0,
                              )
                          )
                          + 0.35
                          * float(
                              features.get(
                                  "relative_long_pct",
                                  0.0,
                              )
                          )
                      )
                      gap = max(
                          0.0,
                          threshold - abs(score),
                      )
                      signal = raw_by_key.get(
                          (portfolio_name, asset)
                      )
                      signal_id = (
                          signal.signal_id
                          if signal is not None
                          else ""
                      )
                      status = "READY"
                      reason = (
                          "Tutti i filtri del generatore "
                          "sono stati superati."
                      )

                      if not freshness.get(
                          "new_entries_allowed",
                          False,
                      ):
                          status = "STALE_MARKET_DATA"
                          reason = (
                              "Nuove entrate bloccate: snapshot "
                              "mercato vecchio o cache di fallback."
                          )
                      elif (
                          candle_age is None
                          or candle_age > allowed_candle_age
                      ):
                          status = "STALE_CANDLE"
                          age_text = (
                              f"{candle_age:.1f}"
                              if candle_age is not None
                              else "n/a"
                          )
                          reason = (
                              "Ultima candela chiusa troppo vecchia: "
                              f"{age_text} minuti; limite "
                              f"{allowed_candle_age:.0f}."
                          )
                      elif abs(score) < threshold:
                          status = "BELOW_SCORE"
                          reason = (
                              f"Punteggio {score:+.2f}; soglia "
                              f"±{threshold:.2f}; mancano "
                              f"{gap:.2f} punti."
                          )
                      elif (
                          side == "LONG"
                          and not definition.get(
                              "allow_long",
                              True,
                          )
                      ):
                          status = "SIDE_DISABLED"
                          reason = (
                              "Long disabilitati nel portafoglio."
                          )
                      elif (
                          side == "SHORT"
                          and not definition.get(
                              "allow_short",
                              True,
                          )
                      ):
                          status = "SIDE_DISABLED"
                          reason = (
                              "Short disabilitati nel portafoglio."
                          )
                      elif not strategy_accepts(
                          strategy,
                          side,
                          features,
                          score,
                      ):
                          status = "STRATEGY_FILTER"
                          reason = _strategy_reason(
                              strategy,
                              side,
                              features,
                          )
                      elif signal is None:
                          status = "NO_SIGNAL_OBJECT"
                          reason = (
                              "Il punteggio sembra valido, ma il "
                              "generatore non ha prodotto il segnale."
                          )
                      elif signal_id in set(
                          portfolio.get(
                              "seen_signal_ids",
                              [],
                          )
                      ):
                          status = "ALREADY_PROCESSED"
                          reason = (
                              "Questa stessa candela/segnale era "
                              "già stata elaborata."
                          )
                      else:
                          equity, _ = portfolio_equity(
                              portfolio,
                              prices,
                              eur_rate,
                          )
                          permitted, gate_reason = can_open(
                              portfolio,
                              signal,
                              equity,
                              config,
                          )
                          if not permitted:
                              status = "RISK_GATE"
                              reason = (
                                  "Filtro rischio/esecuzione: "
                                  f"{gate_reason}."
                              )
                          else:
                              allowed_ids.append(signal_id)

                      near_miss = (
                          (
                              status == "BELOW_SCORE"
                              and gap <= near_gap
                          )
                          or status
                          in {
                              "STRATEGY_FILTER",
                              "RISK_GATE",
                              "READY",
                          }
                      )
                      rows.append(
                          {
                              **base,
                              "side": side,
                              "score": round(score, 4),
                              "score_gap": round(gap, 4),
                              "confidence": (
                                  signal.confidence
                                  if signal is not None
                                  else "BASSA"
                              ),
                              "candle_time": candle_time,
                              "candle_age_minutes": (
                                  round(candle_age, 2)
                                  if candle_age is not None
                                  else None
                              ),
                              "allowed_candle_age_minutes": (
                                  allowed_candle_age
                              ),
                              "breakout_state": str(
                                  features.get(
                                      "breakout_state",
                                      "NONE",
                                  )
                              ),
                              "relative_strength_score": round(
                                  relative,
                                  4,
                              ),
                              "global_overlay": round(
                                  global_overlay,
                                  4,
                              ),
                              "exchange_overlay": round(
                                  exchange_overlay,
                                  4,
                              ),
                              "status": status,
                              "near_miss": near_miss,
                              "reason": reason,
                              "score_reasons": score_reasons,
                              "global_reason": global_reason,
                              "exchange_reason": exchange_reason,
                              "signal_id": signal_id,
                          }
                      )

              def sort_key(
                  row: dict[str, Any],
              ) -> tuple[Any, ...]:
                  status = str(row.get("status", ""))
                  priority = {
                      "READY": 0,
                      "STRATEGY_FILTER": 1,
                      "RISK_GATE": 2,
                      "BELOW_SCORE": 3,
                      "STALE_MARKET_DATA": 4,
                      "STALE_CANDLE": 5,
                      "ALREADY_PROCESSED": 6,
                      "NO_SIGNAL_OBJECT": 7,
                      "NO_FEATURES": 8,
                  }.get(status, 9)
                  gap_value = row.get("score_gap")
                  gap_sort = (
                      float(gap_value)
                      if gap_value is not None
                      else 999.0
                  )
                  return (
                      0 if row.get("is_main") else 1,
                      priority,
                      gap_sort,
                      -abs(float(row.get("score") or 0.0)),
                      str(row.get("asset", "")),
                  )

              maximum_rows = int(
                  config.get("notifications", {}).get(
                      "near_miss_max_rows",
                      20,
                  )
              )
              interesting = [
                  row
                  for row in rows
                  if row.get("near_miss")
                  or row.get("status")
                  in {
                      "STALE_MARKET_DATA",
                      "STALE_CANDLE",
                  }
              ]
              if not interesting:
                  interesting = rows
              display_rows = sorted(
                  interesting,
                  key=sort_key,
              )[:maximum_rows]

              return {
                  "schema_version": 1,
                  "generated_utc": checked.isoformat(
                      timespec="seconds"
                  ),
                  "market": freshness,
                  "raw_signal_count": len(signals),
                  "executable_signal_ids": sorted(
                      set(allowed_ids)
                  ),
                  "executable_signal_count": len(
                      set(allowed_ids)
                  ),
                  "rows": rows,
                  "display_rows": display_rows,
                  "summary": {
                      "ready": sum(
                          row["status"] == "READY"
                          for row in rows
                      ),
                      "near_miss": sum(
                          bool(row.get("near_miss"))
                          for row in rows
                      ),
                      "below_score": sum(
                          row["status"] == "BELOW_SCORE"
                          for row in rows
                      ),
                      "strategy_filter": sum(
                          row["status"]
                          == "STRATEGY_FILTER"
                          for row in rows
                      ),
                      "stale": sum(
                          row["status"]
                          in {
                              "STALE_MARKET_DATA",
                              "STALE_CANDLE",
                          }
                          for row in rows
                      ),
                  },
              }


          def finalize_signal_diagnostics(
              payload: dict[str, Any],
              execution_summary: dict[str, Any],
          ) -> dict[str, Any]:
              opened_ids = {
                  str(row.get("trade_id", ""))
                  for row in execution_summary.get(
                      "opened",
                      [],
                  )
              }
              for row in payload.get("rows", []):
                  signal_id = str(row.get("signal_id", ""))
                  if signal_id and signal_id in opened_ids:
                      row["status"] = "OPENED"
                      row["reason"] = (
                          "Posizione virtuale aperta "
                          "in questa esecuzione."
                      )
                      row["near_miss"] = True

              display_keys = {
                  (
                      row.get("portfolio"),
                      row.get("asset"),
                      row.get("signal_id"),
                  )
                  for row in payload.get("display_rows", [])
              }
              for row in payload.get("rows", []):
                  key = (
                      row.get("portfolio"),
                      row.get("asset"),
                      row.get("signal_id"),
                  )
                  if (
                      row.get("status") == "OPENED"
                      and key not in display_keys
                  ):
                      payload.setdefault(
                          "display_rows",
                          [],
                      ).insert(0, row)

              payload["execution"] = {
                  "opened": len(
                      execution_summary.get("opened", [])
                  ),
                  "closed": len(
                      execution_summary.get("closed", [])
                  ),
              }
              payload.setdefault("summary", {})["opened"] = len(
                  execution_summary.get("opened", [])
              )
              return payload


          def write_signal_diagnostics(
              payload: dict[str, Any],
          ) -> None:
              DIAGNOSTICS_PATH.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )
              temp = DIAGNOSTICS_PATH.with_suffix(
                  ".json.tmp"
              )
              temp.write_text(
                  json.dumps(
                      payload,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )
              temp.replace(DIAGNOSTICS_PATH)
          PY

      - name: Integrate diagnostics into paper trading runner and report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path


          def replace_once(
              text: str,
              old: str,
              new: str,
              label: str,
          ) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"Patch non applicabile: {label}")
              return text.replace(old, new, 1)


          runner_path = Path("paper_trading_runner.py")
          runner = runner_path.read_text(encoding="utf-8")

          runner = replace_once(
              runner,
              "from paper_signal_engine import generate_signals\n",
              (
                  "from paper_signal_engine import generate_signals\n"
                  "from paper_trading_diagnostics import (\n"
                  "    annotate_market_freshness,\n"
                  "    build_signal_diagnostics,\n"
                  "    finalize_signal_diagnostics,\n"
                  "    write_signal_diagnostics,\n"
                  ")\n"
              ),
              "import diagnostica runner",
          )

          old_main = '''    config = load_config()
              bundle = collect_with_fallback(config)
              signals = generate_signals(bundle, config)
              state = load_state(config)

              before = _position_snapshot(state, bundle)
              summary = run_execution_cycle(state, signals, bundle, config)
          '''
          new_main = '''    config = load_config()
              bundle = annotate_market_freshness(
                  collect_with_fallback(config),
                  config,
              )
              raw_signals = generate_signals(bundle, config)
              state = load_state(config)
              signal_diagnostics = build_signal_diagnostics(
                  bundle,
                  config,
                  raw_signals,
                  state,
              )
              executable_ids = set(
                  signal_diagnostics.get(
                      "executable_signal_ids",
                      [],
                  )
              )
              signals = [
                  signal
                  for signal in raw_signals
                  if signal.signal_id in executable_ids
              ]

              before = _position_snapshot(state, bundle)
              summary = run_execution_cycle(
                  state,
                  signals,
                  bundle,
                  config,
              )
          '''
          runner = replace_once(
              runner,
              old_main,
              new_main,
              "flusso diagnostica runner",
          )

          risk_marker = '''    summary["risk_alerts"] = risk_alerts
              summary["risk_recoveries"] = risk_recoveries

              current = datetime.now(timezone.utc)
          '''
          risk_new = '''    summary["risk_alerts"] = risk_alerts
              summary["risk_recoveries"] = risk_recoveries
              signal_diagnostics = finalize_signal_diagnostics(
                  signal_diagnostics,
                  summary,
              )
              write_signal_diagnostics(signal_diagnostics)
              summary["signal_diagnostics"] = (
                  signal_diagnostics.get("summary", {})
              )

              current = datetime.now(timezone.utc)
          '''
          runner = replace_once(
              runner,
              risk_marker,
              risk_new,
              "salvataggio diagnostica runner",
          )

          payload_marker = '''        "assets": len(bundle.get("assets", {})),
                  "signals": len(signals),
                  "opened": summary.get("opened", []),
          '''
          payload_new = '''        "assets": len(bundle.get("assets", {})),
                  "signals": len(signals),
                  "signals_generated": len(raw_signals),
                  "signals_executable": len(signals),
                  "market_freshness": bundle.get(
                      "_paper_freshness",
                      {},
                  ),
                  "signal_diagnostics": signal_diagnostics.get(
                      "summary",
                      {},
                  ),
                  "opened": summary.get("opened", []),
          '''
          runner = replace_once(
              runner,
              payload_marker,
              payload_new,
              "payload diagnostica runner",
          )

          print_marker = '''                "assets": len(bundle.get("assets", {})),
                          "signals": len(signals),
                          "opened": len(summary.get("opened", [])),
          '''
          print_new = '''                "assets": len(bundle.get("assets", {})),
                          "signals": len(signals),
                          "signals_generated": len(raw_signals),
                          "signals_executable": len(signals),
                          "market_data_status": bundle.get(
                              "_paper_freshness",
                              {},
                          ).get("status"),
                          "opened": len(summary.get("opened", [])),
          '''
          runner = replace_once(
              runner,
              print_marker,
              print_new,
              "output runner",
          )
          runner_path.write_text(runner, encoding="utf-8")

          report_path = Path("paper_trading_report.py")
          report = report_path.read_text(encoding="utf-8")

          report = replace_once(
              report,
              "from paper_trading_sample_watch import sample_snapshot\n",
              (
                  "from paper_trading_sample_watch import sample_snapshot\n"
                  "from paper_trading_diagnostics import DIAGNOSTICS_PATH\n"
              ),
              "import diagnostica report",
          )

          fmt_marker = '''def fmt_num(value: Any, digits: int = 2) -> str:
              try:
                  number = float(value)
                  if math.isinf(number):
                      return "∞"
                  return f"{number:.{digits}f}".replace(".", ",")
              except Exception:
                  return "n/a"


          '''
          fmt_new = fmt_marker + '''def fmt_minutes(value: Any) -> str:
              try:
                  minutes = float(value)
                  if minutes < 60:
                      return f"{minutes:.1f} min".replace(".", ",")
                  return f"{minutes / 60.0:.2f} h".replace(".", ",")
              except Exception:
                  return "n/a"


          '''
          report = replace_once(
              report,
              fmt_marker,
              fmt_new,
              "formatter minuti",
          )

          diagnostics_marker = '''    sample = sample_snapshot(state, config)

              lines = [
          '''
          diagnostics_new = '''    sample = sample_snapshot(state, config)
              diagnostics = read_json(DIAGNOSTICS_PATH, {})
              freshness = diagnostics.get("market", {})
              freshness_status = str(
                  freshness.get("status", "UNKNOWN")
              )
              freshness_age = freshness.get(
                  "snapshot_age_minutes"
              )

              lines = [
          '''
          report = replace_once(
              report,
              diagnostics_marker,
              diagnostics_new,
              "lettura diagnostica report",
          )

          old_price_line = (
              '        f"- Ultimi prezzi: **{market_generated}**; '
              'conversione EUR/USDT: **{rate_source}**",\n'
          )
          new_price_line = (
              '        f"- Snapshot prezzi usato: **{market_generated}**; '
              'stato dati: **{freshness_status}**; età: '
              '**{fmt_minutes(freshness_age)}**; conversione '
              'EUR/USDT: **{rate_source}**",\n'
          )
          report = replace_once(
              report,
              old_price_line,
              new_price_line,
              "riga freschezza prezzi",
          )

          insertion_marker = "    if main:\n"
          diagnostics_section = '''    lines.extend(
                  [
                      "## Freschezza dati di mercato",
                      "",
                      md_table(
                          [
                              "Stato",
                              "Fonte",
                              "Snapshot mercato",
                              "Controllato",
                              "Età",
                              "Limite",
                              "Nuove entrate",
                          ],
                          [[
                              freshness_status,
                              freshness.get("source", "n/a"),
                              freshness.get(
                                  "snapshot_generated_utc",
                                  market_generated,
                              ),
                              freshness.get(
                                  "checked_utc",
                                  "n/a",
                              ),
                              fmt_minutes(freshness_age),
                              fmt_minutes(
                                  freshness.get(
                                      "stale_limit_minutes"
                                  )
                              ),
                              (
                                  "ABILITATE"
                                  if freshness.get(
                                      "new_entries_allowed"
                                  )
                                  else "BLOCCATE"
                              ),
                          ]],
                      ),
                      "",
                  ]
              )
              if freshness_status != "FRESH":
                  lines.extend(
                      [
                          (
                              "> ⚠️ I prezzi non vengono marcati come "
                              "aggiornati artificialmente. Se KuCoin non "
                              "risponde e viene usata la cache, il report "
                              "mostra l'età reale e blocca le nuove entrate."
                          ),
                          "",
                      ]
                  )

              timeframe_rows = []
              for item in freshness.get(
                  "timeframes",
                  {},
              ).values():
                  timeframe_rows.append(
                      [
                          f"{item.get('timeframe_minutes', 'n/a')}m",
                          item.get("assets_with_data", 0),
                          item.get(
                              "latest_closed_candle_utc",
                              "n/a",
                          ),
                          item.get(
                              "oldest_closed_candle_utc",
                              "n/a",
                          ),
                          fmt_minutes(
                              item.get(
                                  "max_candle_age_minutes"
                              )
                          ),
                          fmt_minutes(
                              item.get(
                                  "allowed_age_minutes"
                              )
                          ),
                          item.get("status", "UNKNOWN"),
                      ]
                  )
              if timeframe_rows:
                  lines.extend(
                      [
                          md_table(
                              [
                                  "TF",
                                  "Asset con dati",
                                  "Candela più recente",
                                  "Candela più vecchia",
                                  "Età massima",
                                  "Limite",
                                  "Stato",
                              ],
                              timeframe_rows,
                          ),
                          "",
                      ]
                  )

              lines.extend(
                  [
                      "## Segnali quasi entrati / motivi di esclusione",
                      "",
                  ]
              )
              diagnostic_rows = []
              for row in diagnostics.get(
                  "display_rows",
                  [],
              ):
                  score = row.get("score")
                  gap = row.get("score_gap")
                  diagnostic_rows.append(
                      [
                          row.get("portfolio", ""),
                          row.get("asset", ""),
                          f"{row.get('timeframe_minutes', '')}m",
                          row.get("side", ""),
                          (
                              fmt_num(score)
                              if score is not None
                              else "n/a"
                          ),
                          fmt_num(
                              row.get("minimum_abs_score")
                          ),
                          (
                              fmt_num(gap)
                              if gap is not None
                              else "n/a"
                          ),
                          row.get("status", ""),
                          fmt_minutes(
                              row.get(
                                  "candle_age_minutes"
                              )
                          ),
                          row.get("reason", ""),
                      ]
                  )
              if diagnostic_rows:
                  lines.extend(
                      [
                          md_table(
                              [
                                  "Portafoglio",
                                  "Asset",
                                  "TF",
                                  "Lato",
                                  "Score",
                                  "Soglia",
                                  "Manca",
                                  "Stato",
                                  "Età candela",
                                  "Motivo",
                              ],
                              diagnostic_rows,
                          ),
                          "",
                          (
                              "**Manca** indica quanti punti servivano "
                              "per raggiungere la soglia. "
                              "`STRATEGY_FILTER` significa che lo score "
                              "bastava, ma mancava breakout, momentum "
                              "o forza relativa. `ALREADY_PROCESSED` "
                              "significa che la stessa candela era già "
                              "stata esaminata."
                          ),
                          "",
                      ]
                  )
              else:
                  lines.extend(
                      [
                          (
                              "_Diagnostica non ancora disponibile: "
                              "verrà creata alla prossima esecuzione "
                              "del Paper Trading._"
                          ),
                          "",
                      ]
                  )

          '''
          if "## Freschezza dati di mercato" not in report:
              if insertion_marker not in report:
                  raise SystemExit(
                      "Patch non applicabile: sezione diagnostica"
                  )
              report = report.replace(
                  insertion_marker,
                  diagnostics_section + insertion_marker,
                  1,
              )

          report_path.write_text(report, encoding="utf-8")

          config_path = Path("paper_trading_config.json")
          config = json.loads(
              config_path.read_text(encoding="utf-8")
          )
          notifications = config.setdefault(
              "notifications",
              {},
          )
          notifications["near_miss_score_gap"] = 1.5
          notifications["near_miss_max_rows"] = 20
          config_path.write_text(
              json.dumps(
                  config,
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Compile and test diagnostics
        run: |
          python -m py_compile \
            paper_trading_diagnostics.py \
            paper_trading_runner.py \
            paper_trading_report.py

          python - <<'PY'
          from datetime import datetime, timedelta, timezone

          from paper_trading_diagnostics import (
              annotate_market_freshness,
          )

          now = datetime.now(timezone.utc)
          config = {
              "execution": {
                  "stale_data_minutes": 25,
              }
          }

          fresh = annotate_market_freshness(
              {
                  "generated_utc": now.isoformat(),
                  "source": "KUCOIN_PUBLIC_API",
                  "assets": {},
              },
              config,
              now,
          )
          assert fresh["_paper_freshness"]["status"] == "FRESH"
          assert fresh["_paper_freshness"]["new_entries_allowed"]

          stale = annotate_market_freshness(
              {
                  "generated_utc": (
                      now - timedelta(minutes=60)
                  ).isoformat(),
                  "source": "KUCOIN_PUBLIC_API:STALE_FALLBACK",
                  "assets": {},
              },
              config,
              now,
          )
          assert stale["_paper_freshness"]["status"] == "STALE_FALLBACK"
          assert not stale["_paper_freshness"]["new_entries_allowed"]

          print("Paper trading diagnostics self-test: OK")
          PY

      - name: Commit diagnostics upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            paper_trading_diagnostics.py \
            paper_trading_runner.py \
            paper_trading_report.py \
            paper_trading_config.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m \
              "Add paper trading freshness and near-miss diagnostics"
            git push
          fi
