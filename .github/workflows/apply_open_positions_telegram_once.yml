name: Install Open Positions Telegram

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install paper-trading dependencies
        run: python -m pip install -r requirements-paper-trading.txt

      - name: Add separate open-positions Telegram message
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine_path = Path("paper_trading_engine.py")
          notify_path = Path("paper_trading_notify.py")
          if not engine_path.exists() or not notify_path.exists():
              raise SystemExit("File paper trading mancanti.")

          engine = engine_path.read_text(encoding="utf-8")
          if "# TELEGRAM_OPEN_POSITIONS_MARKET_CONTEXT_V1" not in engine:
              anchor = '''    summary = {"opened": [], "closed": [], "generated_utc": iso_utc(current)}
              prices = current_prices(bundle)
              rate = float(bundle.get("eur_usdt_rate", config.get("eur_usdt_fallback_rate", 1.0)))
          '''
              replacement = '''    summary = {"opened": [], "closed": [], "generated_utc": iso_utc(current)}
              prices = current_prices(bundle)
              rate = float(bundle.get("eur_usdt_rate", config.get("eur_usdt_fallback_rate", 1.0)))
              # TELEGRAM_OPEN_POSITIONS_MARKET_CONTEXT_V1
              summary["market_prices"] = dict(prices)
              summary["eur_usdt_rate"] = rate
          '''
              if anchor not in engine:
                  raise SystemExit("Anchor run_execution_cycle non trovato.")
              engine = engine.replace(anchor, replacement, 1)
          engine_path.write_text(engine, encoding="utf-8")

          notify = notify_path.read_text(encoding="utf-8")
          if "# OPEN_POSITIONS_TELEGRAM_V1" not in notify:
              anchor = '''def _send_text(token: str, chat_id: str, text: str) -> None:
          '''
              block = r'''
          # OPEN_POSITIONS_TELEGRAM_V1
          def _position_unrealized_eur(position, mark, eur_rate):
              entry = float(position.get("entry_price", 0.0) or 0.0)
              quantity = abs(float(position.get("quantity", 0.0) or 0.0))
              funding = float(position.get("funding_pnl_eur", 0.0) or 0.0)
              side = str(position.get("side", "")).upper()
              if entry <= 0 or mark <= 0 or quantity <= 0:
                  return funding
              raw = (mark - entry) * quantity if side == "LONG" else (entry - mark) * quantity
              return raw / max(eur_rate, 1e-9) + funding


          def _level_distance_pct(mark, level, side, kind):
              if mark <= 0 or level <= 0:
                  return None
              side = side.upper()
              if kind == "stop":
                  return ((mark - level) if side == "LONG" else (level - mark)) / mark * 100.0
              return ((level - mark) if side == "LONG" else (mark - level)) / mark * 100.0


          def _duration_text(opened_at, current):
              opened = _parse_iso(opened_at)
              if opened is None:
                  return "n/a"
              seconds = max(0, int((current - opened).total_seconds()))
              days, remainder = divmod(seconds, 86400)
              hours, remainder = divmod(remainder, 3600)
              minutes = remainder // 60
              if days:
                  return f"{days}g {hours}h"
              if hours:
                  return f"{hours}h {minutes}m"
              return f"{minutes}m"


          def _position_risk_label(position, pnl_eur, stop_distance_pct):
              margin = max(float(position.get("margin_eur", 0.0) or 0.0), 1e-9)
              leverage = float(position.get("leverage", 0.0) or 0.0)
              pnl_on_margin = pnl_eur / margin * 100.0
              if ((stop_distance_pct is not None and stop_distance_pct <= 1.0)
                      or pnl_on_margin <= -8.0 or leverage >= 10.0):
                  return "🔴 ALTO"
              if ((stop_distance_pct is not None and stop_distance_pct <= 2.5)
                      or pnl_on_margin <= -3.0 or leverage >= 5.0):
                  return "🟡 MEDIO"
              return "🟢 BASSO"


          def _fmt_optional_pct(value):
              return "n/a" if value is None else _fmt_pct(value)


          def build_open_positions_messages(state, config, summary=None, now=None):
              activity = summary or {}
              prices = dict(activity.get("market_prices", {}))
              eur_rate = float(activity.get("eur_usdt_rate", config.get("eur_usdt_fallback_rate", 1.0)) or 1.0)
              current = (now or datetime.now(timezone.utc)).astimezone(timezone.utc)

              definitions = [str(row.get("name", "")) for row in config.get("portfolios", []) if row.get("enabled", True)]
              portfolios = dict(state.get("portfolios", {}))
              ordered_names = [name for name in definitions if name in portfolios]
              ordered_names.extend(name for name in portfolios if name not in ordered_names)
              account_number = {name: index for index, name in enumerate(ordered_names, start=1)}

              total_positions = sum(len(portfolio.get("open_positions", [])) for portfolio in portfolios.values())
              if total_positions == 0:
                  return ["📌 POSIZIONI APERTE\n\nNessuna posizione paper attualmente aperta."]

              lines = [
                  "📌 POSIZIONI PAPER ANCORA APERTE",
                  f"Totale: {total_positions}. Ogni conto resta una simulazione separata.",
              ]

              for name in ordered_names:
                  portfolio = portfolios[name]
                  positions = list(portfolio.get("open_positions", []))
                  if not positions:
                      continue

                  number = account_number[name]
                  account_pnl = 0.0
                  position_lines = []

                  for position in positions:
                      asset = str(position.get("asset", ""))
                      side = str(position.get("side", "")).upper()
                      mark = float(prices.get(asset, 0.0) or 0.0)
                      entry = float(position.get("entry_price", 0.0) or 0.0)
                      stop = float(position.get("stop_price", 0.0) or 0.0)
                      target = float(position.get("target_price", 0.0) or 0.0)
                      margin = float(position.get("margin_eur", 0.0) or 0.0)
                      pnl = _position_unrealized_eur(position, mark, eur_rate)
                      account_pnl += pnl
                      pnl_pct = pnl / margin * 100.0 if margin > 0 else 0.0
                      stop_distance = _level_distance_pct(mark, stop, side, "stop")
                      target_distance = _level_distance_pct(mark, target, side, "target")
                      risk = _position_risk_label(position, pnl, stop_distance)
                      side_icon = "🟢" if side == "LONG" else "🔴"
                      pnl_icon = "✅" if pnl > 0 else "❌" if pnl < 0 else "➖"

                      position_lines.extend([
                          "",
                          f"{side_icon} {asset} {side} · {float(position.get('leverage', 0.0)):.1f}x · TF {position.get('timeframe_minutes', '')}m",
                          f"Entry {entry:.6g} · Mark {mark:.6g}",
                          f"{pnl_icon} P/L {_fmt_eur(pnl, signed=True)} ({_fmt_pct(pnl_pct, signed=True)})",
                          f"Margine {_fmt_eur(margin)} · esposizione {_fmt_eur(position.get('notional_eur'))}",
                          f"Stop {stop:.6g} · distanza {_fmt_optional_pct(stop_distance)}",
                          f"Target {target:.6g} · distanza {_fmt_optional_pct(target_distance)}",
                          f"Rischio posizione: {risk} · aperta da {_duration_text(position.get('opened_at'), current)}",
                      ])

                  account_icon = "🟢" if account_pnl > 0 else "🔴" if account_pnl < 0 else "⚪"
                  lines.extend([
                      "",
                      "──────────────",
                      f"{account_icon} Conto {number} — {portfolio_label(name)}",
                      f"{len(positions)} aperte · P/L aperto conto {_fmt_eur(account_pnl, signed=True)}",
                  ])
                  lines.extend(position_lines)

              lines.extend([
                  "",
                  "Legenda rischio:",
                  "🟢 margine di sicurezza ampio · 🟡 leva/perdita o stop più vicino · 🔴 posizione vicina allo stop o molto aggressiva",
              ])
              return _chunks(lines)


          '''
              if anchor not in notify:
                  raise SystemExit("Anchor _send_text non trovato.")
              notify = notify.replace(anchor, block + anchor, 1)

              old = '''        "account_summary_sent": False,
                      "digest_sent": False,
              '''
              new = '''        "account_summary_sent": False,
                      "open_positions_messages": 0,
                      "digest_sent": False,
              '''
              if old in notify:
                  notify = notify.replace(old, new, 1)
              elif '"open_positions_messages": 0' not in notify:
                  raise SystemExit("Anchor result non trovato.")

              old = '''        result["account_summary_sent"] = True

              if not messages:
          '''
              new = '''        result["account_summary_sent"] = True

                  open_position_messages = build_open_positions_messages(
                      state,
                      config,
                      summary,
                      current,
                  )
                  messages.extend(open_position_messages)
                  result["open_positions_messages"] = len(open_position_messages)

              if not messages:
          '''
              if old in notify:
                  notify = notify.replace(old, new, 1)
              elif "open_position_messages = build_open_positions_messages" not in notify:
                  raise SystemExit("Anchor invio riepilogo non trovato.")

          notify_path.write_text(notify, encoding="utf-8")
          PY

      - name: Validate installation
        shell: bash
        run: |
          python -m py_compile paper_trading_engine.py paper_trading_notify.py

          python - <<'PY'
          from datetime import datetime, timezone
          from paper_trading_notify import build_open_positions_messages

          state = {
              "portfolios": {
                  "MAIN": {
                      "open_positions": [{
                          "asset": "DOGE",
                          "side": "SHORT",
                          "timeframe_minutes": 240,
                          "opened_at": "2026-07-13T06:00:00+00:00",
                          "entry_price": 0.078,
                          "stop_price": 0.0806,
                          "target_price": 0.060,
                          "quantity": 100000,
                          "notional_eur": 7800,
                          "margin_eur": 1560,
                          "leverage": 5,
                          "funding_pnl_eur": 0,
                      }]
                  }
              }
          }
          config = {
              "eur_usdt_fallback_rate": 1.0,
              "portfolios": [{"name": "MAIN", "enabled": True}],
          }
          summary = {"market_prices": {"DOGE": 0.076}, "eur_usdt_rate": 1.0}
          messages = build_open_positions_messages(
              state, config, summary,
              datetime(2026, 7, 13, 8, 0, tzinfo=timezone.utc),
          )
          text = "\n".join(messages)
          assert "POSIZIONI PAPER ANCORA APERTE" in text
          assert "DOGE SHORT" in text
          assert "P/L +€200,00" in text
          assert "Rischio posizione:" in text
          assert "aperta da 2h 0m" in text
          print("Test messaggio posizioni aperte superato.")
          PY

      - name: Commit installation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_trading_engine.py paper_trading_notify.py
          if git diff --cached --quiet; then
            echo "Messaggio posizioni aperte già installato."
          else
            git commit -m "Add separate Telegram open positions report"
            git push origin HEAD:main
          fi
