name: Apply Cleaner Paper Trading Messages Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-paper-trading.txt

      - name: Create readable portfolio helpers
        run: |
          echo '' | base64 -d > paper_trading_display.py

      - name: Patch Telegram messages
        run: |
          echo '' | base64 -d > /tmp/patch_notify.py
          python /tmp/patch_notify.py

      - name: Patch Markdown report
        run: |
          echo '' | base64 -d > /tmp/patch_report.py
          python /tmp/patch_report.py

      - name: Compile modified modules
        run: |
          python -m py_compile \
            paper_trading_display.py \
            paper_trading_notify.py \
            paper_trading_report.py

      - name: Run offline formatting self-test
        run: |
          python - <<'PY'
          from paper_trading_display import (
              aggregate_positions,
              portfolio_label,
          )
          from paper_trading_notify import build_event_messages

          positions = [
              {
                  "portfolio": "SHADOW_1H_BALANCED",
                  "asset": "ZEC",
                  "side": "LONG",
                  "leverage": 3.0,
                  "timeframe_minutes": 60,
                  "entry_price": 100.0,
                  "stop_price": 95.0,
                  "target_price": 110.0,
                  "quantity": 10.0,
                  "notional_eur": 1000.0,
                  "margin_eur": 333.33,
                  "initial_risk_eur": 50.0,
                  "eur_usdt_rate": 1.0,
              },
              {
                  "portfolio": "SHADOW_1H_BALANCED",
                  "asset": "AAVE",
                  "side": "LONG",
                  "leverage": 3.0,
                  "timeframe_minutes": 60,
                  "entry_price": 50.0,
                  "stop_price": 47.5,
                  "target_price": 55.0,
                  "quantity": 20.0,
                  "notional_eur": 1000.0,
                  "margin_eur": 333.33,
                  "initial_risk_eur": 50.0,
                  "eur_usdt_rate": 1.0,
              },
          ]

          assert portfolio_label(
              "SHADOW_1H_BALANCED"
          ) == "Bilanciata 1H"

          totals = aggregate_positions(positions)
          assert totals["count"] == 2
          assert round(totals["margin_eur"], 2) == 666.66
          assert round(totals["initial_risk_eur"], 2) == 100.0

          messages = build_event_messages(
              {
                  "opened": positions,
                  "closed": [],
                  "trailing_updates": [],
                  "risk_alerts": [],
                  "risk_recoveries": [],
              }
          )
          rendered = "\n".join(messages)
          assert "BILANCIATA 1H" in rendered
          assert "Margine impegnato" in rendered
          assert "Esposizione con leva" in rendered
          assert "Capitale a rischio agli stop" in rendered
          assert "€100,00" in rendered
          assert "SHADOW_1H_BALANCED" not in rendered

          print("Readable paper trading formatting self-test: OK")
          PY

      - name: Commit readable paper trading messages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            paper_trading_display.py \
            paper_trading_notify.py \
            paper_trading_report.py

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m \
              "Improve paper trading messages and risk summaries"
            git push
          fi
