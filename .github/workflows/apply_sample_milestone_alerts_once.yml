name: Apply Statistical Sample Milestone Alerts Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-paper-trading.txt

      - name: Add sample milestone engine
        run: |
          cat > paper_trading_sample_watch.py <<'PY'
          # -*- coding: utf-8 -*-
          # Statistical sample milestones for automatic paper trading.
          # Milestones are based on independent CLOSED market events in MAIN.

          from __future__ import annotations

          import math
          from typing import Any

          import pandas as pd

          from paper_trading_engine import TRADE_LOG_PATH

          DEFAULT_MILESTONES = [30, 100, 200, 300]


          def _milestones(config: dict[str, Any]) -> list[int]:
              raw = config.get("notifications", {}).get(
                  "sample_milestones",
                  DEFAULT_MILESTONES,
              )
              values: set[int] = set()
              for item in raw:
                  try:
                      value = int(item)
                  except (TypeError, ValueError):
                      continue
                  if value > 0:
                      values.add(value)
              return sorted(values) or list(DEFAULT_MILESTONES)


          def _main_name(state: dict[str, Any], config: dict[str, Any]) -> str:
              for name, portfolio in state.get("portfolios", {}).items():
                  if portfolio.get("is_main"):
                      return str(name)
              for portfolio in config.get("portfolios", []):
                  if portfolio.get("enabled", True) and portfolio.get("is_main"):
                      return str(portfolio.get("name", "MAIN"))
              return "MAIN"


          def _load_trades() -> pd.DataFrame:
              if not TRADE_LOG_PATH.exists():
                  return pd.DataFrame()
              try:
                  return pd.read_csv(TRADE_LOG_PATH)
              except Exception:
                  return pd.DataFrame()


          def _event_ids(frame: pd.DataFrame) -> set[str]:
              if frame.empty or "experiment_group_id" not in frame.columns:
                  return set()
              values = frame["experiment_group_id"].astype(str).str.strip()
              return {
                  value
                  for value in values
                  if value and value.lower() not in {"nan", "none"}
              }


          def _pnl_series(frame: pd.DataFrame) -> pd.Series:
              if frame.empty or "net_pnl_eur" not in frame.columns:
                  return pd.Series(dtype=float)
              return pd.to_numeric(
                  frame["net_pnl_eur"],
                  errors="coerce",
              ).fillna(0.0)


          def sample_snapshot(
              state: dict[str, Any],
              config: dict[str, Any],
          ) -> dict[str, Any]:
              milestones = _milestones(config)
              main_name = _main_name(state, config)
              trades = _load_trades()

              if trades.empty or "portfolio" not in trades.columns:
                  main_trades = pd.DataFrame()
              else:
                  main_trades = trades[
                      trades["portfolio"].astype(str) == main_name
                  ].copy()

              main_events = len(_event_ids(main_trades))
              system_events = len(_event_ids(trades))
              pnl = _pnl_series(main_trades)
              closed_trades = int(len(main_trades))
              wins = int((pnl > 0).sum()) if not pnl.empty else 0
              win_rate = (
                  wins / closed_trades * 100.0
                  if closed_trades
                  else 0.0
              )
              gross_profit = (
                  float(pnl[pnl > 0].sum())
                  if not pnl.empty
                  else 0.0
              )
              gross_loss = (
                  abs(float(pnl[pnl < 0].sum()))
                  if not pnl.empty
                  else 0.0
              )
              profit_factor = (
                  gross_profit / gross_loss
                  if gross_loss > 0
                  else (math.inf if gross_profit > 0 else 0.0)
              )
              net_pnl = float(pnl.sum()) if not pnl.empty else 0.0
              expectancy = float(pnl.mean()) if not pnl.empty else 0.0

              main_portfolio = state.get("portfolios", {}).get(
                  main_name,
                  {},
              )
              max_drawdown = float(
                  main_portfolio.get("max_drawdown_pct", 0.0)
              )

              next_milestone = next(
                  (
                      value
                      for value in milestones
                      if value > main_events
                  ),
                  None,
              )
              if main_events < 30:
                  status = "CAMPIONE INSUFFICIENTE"
                  meaning = (
                      "Servono altri eventi indipendenti prima "
                      "di trarre conclusioni."
                  )
              elif main_events < 100:
                  status = "PRIME INDICAZIONI"
                  meaning = (
                      "Si può osservare la direzione, "
                      "ma il risultato resta fragile."
                  )
              elif main_events < 200:
                  status = "PRIMA VALUTAZIONE SERIA"
                  meaning = (
                      "Campione sufficiente per una prima analisi completa, "
                      "non per attivare automaticamente il live."
                  )
              elif main_events < 300:
                  status = "CAMPIONE FORTE"
                  meaning = (
                      "Affidabilità maggiore; resta necessario verificare "
                      "regimi di mercato diversi."
                  )
              else:
                  status = "CAMPIONE ROBUSTO"
                  meaning = (
                      "Campione robusto per la valutazione; "
                      "il passaggio al live richiede controllo umano."
                  )

              remaining = (
                  max(0, int(next_milestone - main_events))
                  if next_milestone is not None
                  else 0
              )
              return {
                  "basis": "MAIN_INDEPENDENT_CLOSED_EVENTS",
                  "main_portfolio": main_name,
                  "main_independent_events": main_events,
                  "system_independent_events": system_events,
                  "closed_trades": closed_trades,
                  "wins": wins,
                  "win_rate_pct": win_rate,
                  "profit_factor": profit_factor,
                  "net_pnl_eur": net_pnl,
                  "expectancy_eur": expectancy,
                  "max_drawdown_pct": max_drawdown,
                  "milestones": milestones,
                  "next_milestone": next_milestone,
                  "remaining_to_next": remaining,
                  "status": status,
                  "meaning": meaning,
              }


          def _fmt_eur(value: Any, signed: bool = False) -> str:
              try:
                  number = float(value)
                  prefix = "+" if signed and number > 0 else ""
                  rendered = f"{prefix}€{number:,.2f}"
                  return (
                      rendered.replace(",", "X")
                      .replace(".", ",")
                      .replace("X", ".")
                  )
              except Exception:
                  return "n/a"


          def _fmt_pct(value: Any) -> str:
              try:
                  return f"{float(value):.2f}%".replace(".", ",")
              except Exception:
                  return "n/a"


          def _fmt_num(value: Any) -> str:
              try:
                  number = float(value)
                  if math.isinf(number):
                      return "∞"
                  return f"{number:.2f}".replace(".", ",")
              except Exception:
                  return "n/a"


          def pending_milestone_notification(
              state: dict[str, Any],
              config: dict[str, Any],
          ) -> tuple[str | None, list[int], dict[str, Any]]:
              snapshot = sample_snapshot(state, config)
              sent_raw = state.get("notifications", {}).get(
                  "sample_milestones_sent",
                  [],
              )
              sent = {
                  int(value)
                  for value in sent_raw
                  if str(value).isdigit()
              }
              reached = [
                  milestone
                  for milestone in snapshot["milestones"]
                  if (
                      milestone
                      <= snapshot["main_independent_events"]
                      and milestone not in sent
                  )
              ]
              if not reached:
                  return None, [], snapshot

              highest = max(reached)
              next_milestone = snapshot.get("next_milestone")
              next_line = (
                  f"Prossima soglia: {next_milestone} "
                  f"(mancano {snapshot['remaining_to_next']})."
                  if next_milestone is not None
                  else "Tutte le soglie configurate sono state raggiunte."
              )
              message = "\n".join(
                  [
                      f"🎯 CAMPIONE STATISTICO — SOGLIA {highest}",
                      "",
                      (
                          "MAIN ha raggiunto "
                          f"{snapshot['main_independent_events']} "
                          "eventi indipendenti chiusi."
                      ),
                      f"Stato: {snapshot['status']}",
                      snapshot["meaning"],
                      "",
                      f"Trade chiusi: {snapshot['closed_trades']}",
                      f"Win rate: {_fmt_pct(snapshot['win_rate_pct'])}",
                      (
                          "Profit factor: "
                          f"{_fmt_num(snapshot['profit_factor'])}"
                      ),
                      (
                          "Expectancy: "
                          f"{_fmt_eur(snapshot['expectancy_eur'], signed=True)} "
                          "per trade"
                      ),
                      (
                          "P&L netto: "
                          f"{_fmt_eur(snapshot['net_pnl_eur'], signed=True)}"
                      ),
                      (
                          "Max drawdown: "
                          f"{_fmt_pct(snapshot['max_drawdown_pct'])}"
                      ),
                      (
                          "Eventi indipendenti complessivi del sistema: "
                          f"{snapshot['system_independent_events']}"
                      ),
                      "",
                      next_line,
                      (
                          "La soglia non abilita automaticamente il trading "
                          "reale: segnala che è il momento di fare la "
                          "valutazione."
                      ),
                  ]
              )
              return message, reached, snapshot


          def mark_milestones_sent(
              state: dict[str, Any],
              reached: list[int],
          ) -> None:
              notifications = state.setdefault("notifications", {})
              current = {
                  int(value)
                  for value in notifications.get(
                      "sample_milestones_sent",
                      [],
                  )
                  if str(value).isdigit()
              }
              current.update(int(value) for value in reached)
              notifications["sample_milestones_sent"] = sorted(current)
          PY

      - name: Integrate milestones into Telegram and scanner report
        run: |
          python - <<'PY'
          from pathlib import Path
          import json


          def replace_required(
              text: str,
              old: str,
              new: str,
              label: str,
          ) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"Patch non applicabile: {label}")
              return text.replace(old, new, 1)


          notify_path = Path("paper_trading_notify.py")
          notify = notify_path.read_text(encoding="utf-8")

          notify = replace_required(
              notify,
              "import requests\n",
              (
                  "import requests\n\n"
                  "from paper_trading_sample_watch import (\n"
                  "    mark_milestones_sent,\n"
                  "    pending_milestone_notification,\n"
                  ")\n"
              ),
              "import sample milestone",
          )

          notify = replace_required(
              notify,
              '        "digest_sent": False,\n',
              (
                  '        "digest_sent": False,\n'
                  '        "sample_milestone_sent": False,\n'
                  '        "sample_milestones": [],\n'
              ),
              "campi risultato milestone",
          )

          milestone_block = '''
              milestone_message = None
              reached_milestones: list[int] = []
              if state is not None and config is not None:
                  milestone_message, reached_milestones, _ = pending_milestone_notification(
                      state,
                      config,
                  )
                  if milestone_message:
                      messages.extend(_chunks(milestone_message.splitlines()))
                      result["sample_milestones"] = reached_milestones
          '''
          milestone_block = milestone_block.strip("\n") + "\n"

          marker = (
              '        result["event_messages"] = len(event_messages)\n'
          )
          notify_body = notify.split("def notify(", 1)[1]
          if "pending_milestone_notification(" not in notify_body:
              if marker not in notify:
                  raise SystemExit(
                      "Patch non applicabile: milestone Telegram"
                  )
              notify = notify.replace(
                  marker,
                  marker + "\n" + milestone_block,
                  1,
              )

          sent_block = '''
              if reached_milestones and state is not None:
                  mark_milestones_sent(state, reached_milestones)
                  result["sample_milestone_sent"] = True
          '''
          sent_block = sent_block.strip("\n") + "\n"

          sent_marker = '    result["sent"] = True\n'
          if (
              "mark_milestones_sent(state, reached_milestones)"
              not in notify
          ):
              if sent_marker not in notify:
                  raise SystemExit(
                      "Patch non applicabile: salvataggio milestone"
                  )
              notify = notify.replace(
                  sent_marker,
                  sent_marker + "\n" + sent_block,
                  1,
              )

          notify_path.write_text(notify, encoding="utf-8")

          report_path = Path("paper_trading_report.py")
          report = report_path.read_text(encoding="utf-8")

          report = replace_required(
              report,
              (
                  "from paper_trading_engine import "
                  "STATE_PATH, TRADE_LOG_PATH\n"
              ),
              (
                  "from paper_trading_engine import "
                  "STATE_PATH, TRADE_LOG_PATH\n"
                  "from paper_trading_sample_watch import "
                  "sample_snapshot\n"
              ),
              "import sample report",
          )

          report = replace_required(
              report,
              '    target = float(config["monthly_target_eur"])\n',
              (
                  '    target = float(config["monthly_target_eur"])\n'
                  "    sample = sample_snapshot(state, config)\n"
              ),
              "snapshot campione",
          )

          sample_section = '''
              next_milestone = sample.get("next_milestone")
              next_text = (
                  f"{next_milestone} (mancano {sample['remaining_to_next']})"
                  if next_milestone is not None
                  else "tutte le soglie raggiunte"
              )
              lines.extend(
                  [
                      "## Stato del campione statistico",
                      "",
                      md_table(
                          [
                              "MAIN eventi indip.",
                              "Sistema eventi indip.",
                              "Stato",
                              "Prossima soglia",
                          ],
                          [[
                              sample["main_independent_events"],
                              sample["system_independent_events"],
                              sample["status"],
                              next_text,
                          ]],
                      ),
                      "",
                      (
                          f"- Trade MAIN chiusi: **{sample['closed_trades']}**; "
                          f"win rate **{fmt_pct(sample['win_rate_pct'])}**; "
                          f"profit factor **{fmt_num(sample['profit_factor'])}**."
                      ),
                      (
                          f"- Expectancy: **{fmt_eur(sample['expectancy_eur'])}** "
                          f"per trade; P&L netto: "
                          f"**{fmt_eur(sample['net_pnl_eur'])}**; "
                          f"max drawdown: "
                          f"**{fmt_pct(sample['max_drawdown_pct'])}**."
                      ),
                      f"- Valutazione: **{sample['meaning']}**",
                      (
                          "- Soglie automatiche Telegram: **30, 100, 200 "
                          "e 300 eventi indipendenti chiusi del MAIN**."
                      ),
                      (
                          "- Una soglia richiede una valutazione; non attiva "
                          "automaticamente il trading reale."
                      ),
                      "",
                  ]
              )

          '''
          sample_section = sample_section.strip("\n") + "\n"

          comparison_marker = (
              '    lines.extend(["## Confronto portafogli", ""])\n'
          )
          if "## Stato del campione statistico" not in report:
              if comparison_marker not in report:
                  raise SystemExit(
                      "Patch non applicabile: sezione campione report"
                  )
              report = report.replace(
                  comparison_marker,
                  sample_section + comparison_marker,
                  1,
              )

          report_path.write_text(report, encoding="utf-8")

          config_path = Path("paper_trading_config.json")
          config = json.loads(
              config_path.read_text(encoding="utf-8")
          )
          notifications = config.setdefault("notifications", {})
          notifications["sample_milestones"] = [
              30,
              100,
              200,
              300,
          ]
          notifications["sample_threshold_basis"] = (
              "MAIN_INDEPENDENT_CLOSED_EVENTS"
          )
          config_path.write_text(
              json.dumps(
                  config,
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Compile upgraded modules
        run: |
          python -m py_compile \
            paper_trading_sample_watch.py \
            paper_trading_notify.py \
            paper_trading_report.py

      - name: Run offline milestone self-test
        run: |
          python - <<'PY'
          import csv
          import tempfile
          from pathlib import Path

          import paper_trading_sample_watch as watch

          with tempfile.TemporaryDirectory() as tmp:
              watch.TRADE_LOG_PATH = Path(tmp) / "trade_log.csv"
              with watch.TRADE_LOG_PATH.open(
                  "w",
                  encoding="utf-8",
                  newline="",
              ) as handle:
                  writer = csv.DictWriter(
                      handle,
                      fieldnames=[
                          "portfolio",
                          "experiment_group_id",
                          "net_pnl_eur",
                      ],
                  )
                  writer.writeheader()
                  for index in range(30):
                      writer.writerow(
                          {
                              "portfolio": "MAIN",
                              "experiment_group_id": f"event-{index}",
                              "net_pnl_eur": (
                                  10
                                  if index % 2 == 0
                                  else -5
                              ),
                          }
                      )
                  for index in range(10):
                      writer.writerow(
                          {
                              "portfolio": "SHADOW_1H_FAST",
                              "experiment_group_id": f"shadow-{index}",
                              "net_pnl_eur": 1,
                          }
                      )

              state = {
                  "portfolios": {
                      "MAIN": {
                          "is_main": True,
                          "max_drawdown_pct": 2.5,
                      }
                  },
                  "notifications": {},
              }
              config = {
                  "portfolios": [
                      {
                          "name": "MAIN",
                          "enabled": True,
                          "is_main": True,
                      }
                  ],
                  "notifications": {
                      "sample_milestones": [
                          30,
                          100,
                          200,
                          300,
                      ],
                  },
              }

              message, reached, snapshot = (
                  watch.pending_milestone_notification(
                      state,
                      config,
                  )
              )
              assert reached == [30], reached
              assert message and "SOGLIA 30" in message
              assert snapshot["main_independent_events"] == 30
              assert snapshot["system_independent_events"] == 40
              assert snapshot["next_milestone"] == 100

              watch.mark_milestones_sent(state, reached)
              message2, reached2, _ = (
                  watch.pending_milestone_notification(
                      state,
                      config,
                  )
              )
              assert message2 is None
              assert reached2 == []

          print("Sample milestone self-test: OK")
          PY

      - name: Commit statistical sample milestone alerts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            paper_trading_sample_watch.py \
            paper_trading_notify.py \
            paper_trading_report.py \
            paper_trading_config.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m \
              "Add statistical sample milestone alerts"
            git push
          fi
