name: SOL Spot Adaptive Range paper cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: sol-spot-adaptive-range-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy requests

      - name: Run SOL spot adaptive paper cycle
        run: python sol_spot_adaptive_integration.py

      - name: Validate outputs
        run: |
          python -m py_compile sol_spot_adaptive.py sol_spot_adaptive_integration.py
          test -s reports/sol_spot_adaptive_state.json
          test -s reports/sol_spot_adaptive_report.md
          grep -q "SOL_SPOT_ADAPTIVE_START" reports/latest_report.md
          grep -q "€40.000,00" reports/latest_report.md
          grep -q "Leva: \*\*nessuna (1x)\*\*" reports/latest_report.md

      - name: Commit generated SOL paper reports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            reports/sol_spot_adaptive_state.json \
            reports/sol_spot_adaptive_report.md \
            reports/latest_report.md \
            reports/paper_trading_market_cache.json
          git diff --cached --quiet || (git commit -m "Update SOL spot adaptive paper report" && git push)
