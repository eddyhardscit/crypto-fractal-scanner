name: Apply Macro Cycle Follow-up Fixes Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate installer syntax
        run: python -m py_compile apply_macro_cycle_followup_fixes.py

      - name: Apply corrections
        run: python apply_macro_cycle_followup_fixes.py

      - name: Verify final state
        run: |
          python apply_macro_cycle_followup_fixes.py --verify-only
          git diff --check

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            btc_macro_cycle_report.py \
            relative_strength_btc_report.py \
            exchange_microstructure_report.py \
            exchange_signal_tracker.py \
            reports/macro_cycle_followup_fix_status.md
          if [ -f reports/exchange_microstructure_history.csv ]; then
            git add reports/exchange_microstructure_history.csv
          fi
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
          else
            git commit -m "Fix macro cycle lifecycle and exchange calibration history"
            git push
          fi
