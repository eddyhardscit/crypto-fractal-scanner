name: Manual cleanup legacy RSI paper accounts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-cleanup-legacy-rsi-paper-accounts
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      GITHUB_TOKEN: ${{ github.token }}
      PAPER_TRADING_RELEASE_TAG: paper-trading-v1
      PAPER_TRADING_ASSET_NAME: paper-trading-state.zip

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install requests

      - name: Restore persistent paper-trading state
        run: python paper_trading_storage.py restore

      - name: Remove six legacy RSI accounts from persistent state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("paper_trading_config.json")
          state_path = Path("reports/paper_trading_state.json")

          config = json.loads(config_path.read_text(encoding="utf-8"))

          expected_names = {
              str(portfolio.get("name", ""))
              for portfolio in config.get("portfolios", [])
              if portfolio.get("enabled", True)
          }

          if len(expected_names) != 23:
              raise SystemExit(
                  f"Configurazione inattesa: attesi 23 conti, "
                  f"trovati {len(expected_names)}"
              )

          legacy_names = {
              "SHADOW_RSI_LONG_15X_10",
              "SHADOW_RSI_LONG_15X_50",
              "SHADOW_RSI_LONG_5X",
              "SHADOW_RSI_SHORT_15X_10",
              "SHADOW_RSI_SHORT_15X_50",
              "SHADOW_RSI_SHORT_5X",
          }

          if legacy_names & expected_names:
              raise SystemExit(
                  "La configurazione contiene ancora vecchi conti RSI: "
                  + ", ".join(sorted(legacy_names & expected_names))
              )

          if not state_path.exists():
              raise SystemExit(
                  "Stato persistente non trovato dopo il restore."
              )

          state = json.loads(state_path.read_text(encoding="utf-8"))
          portfolios = state.get("portfolios", {})

          if not isinstance(portfolios, dict):
              raise SystemExit(
                  "Formato inatteso di state['portfolios']."
              )

          removed = {}
          for name in sorted(legacy_names):
              if name in portfolios:
                  portfolio = portfolios[name]
                  open_positions = list(
                      portfolio.get("open_positions", [])
                      if isinstance(portfolio, dict)
                      else []
                  )
                  if open_positions:
                      raise SystemExit(
                          f"{name} ha ancora {len(open_positions)} "
                          "posizioni aperte: pulizia interrotta per sicurezza."
                      )
                  removed[name] = portfolios.pop(name)

          # Remove stale per-account notification metadata.
          notifications = state.get("notifications", {})
          if isinstance(notifications, dict):
              for key in (
                  "risk_status",
                  "last_portfolio_status",
                  "portfolio_status",
              ):
                  mapping = notifications.get(key)
                  if isinstance(mapping, dict):
                      for name in legacy_names:
                          mapping.pop(name, None)

          # Keep only configured accounts in state; refuse to delete any
          # unexpected account with open positions.
          unexpected = sorted(set(portfolios) - expected_names)
          for name in unexpected:
              portfolio = portfolios.get(name, {})
              open_positions = list(
                  portfolio.get("open_positions", [])
                  if isinstance(portfolio, dict)
                  else []
              )
              if open_positions:
                  raise SystemExit(
                      f"Conto inatteso {name} ha posizioni aperte; "
                      "pulizia interrotta."
                  )
              portfolios.pop(name, None)

          state["portfolios"] = portfolios

          remaining = set(portfolios)
          missing = sorted(expected_names - remaining)
          extra = sorted(remaining - expected_names)

          if missing:
              raise SystemExit(
                  "Mancano conti nello stato: " + ", ".join(missing)
              )
          if extra:
              raise SystemExit(
                  "Restano conti extra nello stato: " + ", ".join(extra)
              )
          if len(portfolios) != 23:
              raise SystemExit(
                  f"Stato finale inatteso: {len(portfolios)} conti."
              )

          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(json.dumps({
              "removed_legacy_accounts": sorted(removed),
              "removed_count": len(removed),
              "final_state_accounts": len(portfolios),
              "final_config_accounts": len(expected_names),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Validate clean 23-account state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(
              Path("paper_trading_config.json").read_text(
                  encoding="utf-8"
              )
          )
          state = json.loads(
              Path("reports/paper_trading_state.json").read_text(
                  encoding="utf-8"
              )
          )

          configured = {
              str(portfolio["name"])
              for portfolio in config["portfolios"]
              if portfolio.get("enabled", True)
          }
          stored = set(state.get("portfolios", {}))

          assert len(configured) == 23
          assert len(stored) == 23
          assert configured == stored

          legacy = {
              "SHADOW_RSI_LONG_15X_10",
              "SHADOW_RSI_LONG_15X_50",
              "SHADOW_RSI_LONG_5X",
              "SHADOW_RSI_SHORT_15X_10",
              "SHADOW_RSI_SHORT_15X_50",
              "SHADOW_RSI_SHORT_5X",
          }
          assert not (legacy & stored)

          print("PASS: stato persistente pulito, 23 conti esatti")
          PY

      - name: Upload cleaned persistent state
        run: python paper_trading_storage.py upload
