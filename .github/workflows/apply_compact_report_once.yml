name: Apply Compact Report View Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-compact-view:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install compact report view
        run: python apply_compact_report_once.py

      - name: Compile and validate
        run: |
          python -m py_compile \
            compact_latest_report.py \
            data_quality_coherence_report.py \
            apply_compact_report_once.py

      - name: Commit compact view
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            compact_latest_report.py \
            data_quality_coherence_report.py \
            apply_compact_report_once.py
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare: vista compatta già installata."
          else
            git commit -m "Add collapsible compact view to latest report"
            git push
          fi
