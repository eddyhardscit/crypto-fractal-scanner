name: Fix History Reports Parser V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pandas

      - name: Correct history parsers
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/fix_history_parsers_v2.py
          python /tmp/fix_history_parsers_v2.py

      - name: Validate both history parsers
        shell: bash
        run: |
          python -m py_compile             forecast_30d_history_report.py             sol_btc_fractal_history_report.py

          python - <<'PY'
          from pathlib import Path

          import forecast_30d_history_report as forecast
          import sol_btc_fractal_history_report as fractal

          report_path = Path("reports/latest_report.md")
          assert report_path.exists(), "reports/latest_report.md mancante"
          text = report_path.read_text(encoding="utf-8")

          rows = forecast.parse_latest_report(text)
          assert len(rows) == 3, (
              f"Attese 3 previsioni BTC/SOL/DOGE, trovate {len(rows)}"
          )
          assert {row["asset"] for row in rows} == {
              "BTC", "SOL", "DOGE"
          }
          assert all(row["current_price"] for row in rows)

          fractal_row = fractal.parse_fractal_report(text)
          assert fractal_row is not None
          assert fractal_row.get("sol_price") is not None
          assert fractal_row.get("gap_pct") is not None
          assert fractal_row.get("btc_scaled_today") is not None

          print("Parser forecast: 3 asset letti.")
          print(
              "Parser frattale: SOL",
              fractal_row["sol_price"],
              "gap",
              fractal_row["gap_pct"],
              "BTC-scalato",
              fractal_row["btc_scaled_today"],
          )
          PY

      - name: Commit parser corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             forecast_30d_history_report.py             sol_btc_fractal_history_report.py

          if git diff --cached --quiet; then
            echo "Correzioni parser già installate."
          else
            git commit -m "Fix forecast and SOL BTC history parsers"
            git push origin HEAD:main
          fi
