name: Manual fix SOL spot KuCoin candle timestamps v3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-fix-sol-spot-kucoin-candle-timestamps-v3
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Patch automatic timestamp units
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path("sol_spot_adaptive_bot.py")
          source = path.read_text(encoding="utf-8")

          old = base64.b64decode('ICAgICAgICAgICAgdGltZXN0YW1wID0gcGQudG9fZGF0ZXRpbWUoCiAgICAgICAgICAgICAgICByb3dbMF0sCiAgICAgICAgICAgICAgICB1bml0PSJzIiwKICAgICAgICAgICAgICAgIHV0Yz1UcnVlLAogICAgICAgICAgICAgICAgZXJyb3JzPSJjb2VyY2UiLAogICAgICAgICAgICApCg==').decode("utf-8")
          new = base64.b64decode('').decode("utf-8")

          if old not in source:
              raise SystemExit(
                  "Expected v2 timestamp block not found. "
                  "Confirm that the v2 candle fix was installed."
              )

          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate patched bot
        run: |
          python -m pip install numpy pandas requests
          python -m py_compile sol_spot_adaptive_bot.py
          python sol_spot_adaptive_bot.py \
            --config sol_spot_adaptive_config.json \
            --self-test
          git diff --check

      - name: Commit timestamp fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add sol_spot_adaptive_bot.py
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "KuCoin timestamp-unit fix already installed."
          else
            git commit -m "Fix SOL spot KuCoin candle timestamp units"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
