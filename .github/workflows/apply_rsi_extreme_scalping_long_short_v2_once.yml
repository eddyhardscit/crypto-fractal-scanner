name: Apply RSI Extreme Scalping Long Short V2 Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-paper-trading.txt

      - name: Create RSI extreme reversal module
        run: |
          echo '' | base64 -d > paper_rsi_extreme_scalping.py

      - name: Integrate long and short RSI signals
        run: |
          echo '' | base64 -d > /tmp/patch_signal.py
          python /tmp/patch_signal.py

      - name: Integrate long and short diagnostics
        run: |
          echo '' | base64 -d > /tmp/patch_diagnostics.py
          python /tmp/patch_diagnostics.py

      - name: Add fixed margin leverage and liquidation estimate
        run: |
          echo '' | base64 -d > /tmp/patch_engine.py
          python /tmp/patch_engine.py

      - name: Update paper-only leverage validation
        run: |
          echo '' | base64 -d > /tmp/patch_config_loader.py
          python /tmp/patch_config_loader.py

      - name: Add six RSI scalp portfolios
        run: |
          echo '' | base64 -d > /tmp/patch_config_json.py
          python /tmp/patch_config_json.py

      - name: Add readable names and liquidation fields
        run: |
          echo '' | base64 -d > /tmp/patch_display.py
          python /tmp/patch_display.py
          echo '' | base64 -d > /tmp/patch_report_notify.py
          python /tmp/patch_report_notify.py

      - name: Compile modified modules
        run: |
          python -m py_compile \
            paper_rsi_extreme_scalping.py \
            paper_signal_engine.py \
            paper_trading_diagnostics.py \
            paper_trading_engine.py \
            paper_trading_config.py \
            paper_trading_display.py \
            paper_trading_report.py \
            paper_trading_notify.py

      - name: Verify report and Telegram fields
        run: |
          python - <<'PY'
          from pathlib import Path

          report = Path("paper_trading_report.py").read_text(
              encoding="utf-8"
          )
          notify = Path("paper_trading_notify.py").read_text(
              encoding="utf-8"
          )
          assert 'position.get("liquidation_price")' in report
          assert '"Liquidazione"' in report
          assert "Liquidazione stimata" in notify
          print("Campi liquidazione verificati.")
          PY

      - name: Run offline RSI long and short self-test
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json

          import numpy as np
          import pandas as pd

          from kucoin_public_data import frame_to_records
          from paper_rsi_extreme_scalping import (
              extreme_reversal_setup,
          )
          from paper_signal_engine import generate_signals
          from paper_trading_config import load_config
          from paper_trading_diagnostics import (
              annotate_market_freshness,
              build_signal_diagnostics,
          )
          from paper_trading_engine import (
              build_position,
              initial_state,
          )

          config = load_config()
          expected_long = {
              "SHADOW_RSI_LONG_15X_10",
              "SHADOW_RSI_LONG_15X_50",
              "SHADOW_RSI_LONG_5X",
          }
          expected_short = {
              "SHADOW_RSI_SHORT_15X_10",
              "SHADOW_RSI_SHORT_15X_50",
              "SHADOW_RSI_SHORT_5X",
          }
          expected = expected_long | expected_short
          names = {
              row["name"]
              for row in config["portfolios"]
          }
          assert expected.issubset(names)
          assert "DOGE" in config["universe"]["mandatory_assets"]

          current = datetime(
              2026,
              7,
              12,
              18,
              31,
              tzinfo=timezone.utc,
          )
          index = pd.date_range(
              end=pd.Timestamp("2026-07-12T18:15:00Z"),
              periods=80,
              freq="15min",
          )


          def make_extreme_frame(side: str) -> pd.DataFrame:
              direction = side.upper()
              base = [
                  100.0 + 0.03 * np.sin(i / 3)
                  for i in range(60)
              ]
              if direction == "LONG":
                  closes = base + [
                      99.5, 99.0, 98.5, 98.0, 97.5,
                      97.0, 96.5, 96.0, 95.5, 95.0,
                      94.5, 94.0, 93.5, 93.0, 92.5,
                      92.0, 91.5, 91.0, 88.5, 92.2,
                  ]
              else:
                  closes = base + [
                      100.5, 101.0, 101.5, 102.0, 102.5,
                      103.0, 103.5, 104.0, 104.5, 105.0,
                      105.5, 106.0, 106.5, 107.0, 107.5,
                      108.0, 108.5, 109.0, 111.5, 107.8,
                  ]

              opened = []
              highs = []
              lows = []
              volumes = []
              for i, value in enumerate(closes):
                  previous = closes[i - 1] if i else value
                  opened.append(previous)
                  highs.append(max(previous, value) + 0.15)
                  lows.append(min(previous, value) - 0.15)
                  volumes.append(100.0)

              if direction == "LONG":
                  opened[-2] = 91.0
                  highs[-2] = 91.2
                  lows[-2] = 87.8
                  closes[-2] = 88.5
                  volumes[-2] = 500.0
                  opened[-1] = 88.5
                  highs[-1] = 92.4
                  lows[-1] = 88.3
                  closes[-1] = 92.2
                  volumes[-1] = 220.0
              else:
                  opened[-2] = 109.0
                  highs[-2] = 112.2
                  lows[-2] = 108.8
                  closes[-2] = 111.5
                  volumes[-2] = 500.0
                  opened[-1] = 111.5
                  highs[-1] = 111.7
                  lows[-1] = 107.6
                  closes[-1] = 107.8
                  volumes[-1] = 220.0

              return pd.DataFrame(
                  {
                      "open": opened,
                      "high": highs,
                      "low": lows,
                      "close": closes,
                      "volume": volumes,
                  },
                  index=index,
              )


          long_frame = make_extreme_frame("LONG")
          short_frame = make_extreme_frame("SHORT")
          stable_frame = pd.DataFrame(
              {
                  "open": [100.0] * len(index),
                  "high": [100.2] * len(index),
                  "low": [99.8] * len(index),
                  "close": [100.0] * len(index),
                  "volume": [100.0] * len(index),
              },
              index=index,
          )

          long_definition = next(
              row
              for row in config["portfolios"]
              if row["name"] == "SHADOW_RSI_LONG_15X_10"
          )
          short_definition = next(
              row
              for row in config["portfolios"]
              if row["name"] == "SHADOW_RSI_SHORT_15X_10"
          )

          long_setup = extreme_reversal_setup(
              long_frame,
              "LONG",
              long_definition,
          )
          short_setup = extreme_reversal_setup(
              short_frame,
              "SHORT",
              short_definition,
          )
          assert long_setup["accepted"], long_setup
          assert short_setup["accepted"], short_setup
          assert long_setup["score"] >= 8.0
          assert short_setup["score"] >= 8.0
          assert long_setup["candidate_rsi"] <= 15.0
          assert short_setup["candidate_rsi"] >= 85.0

          bundle = {
              "schema_version": 1,
              "generated_utc": current.isoformat(),
              "source": "OFFLINE_RSI_EXTREME_TEST",
              "eur_usdt_rate": 1.0,
              "eur_usdt_rate_source": "TEST",
              "failures": [],
              "assets": {
                  "DOGE": {
                      "symbol": "DOGEUSDTM",
                      "mark_price": float(
                          long_frame["close"].iloc[-1]
                      ),
                      "turnover_24h": 100000000.0,
                      "volume_24h": 1000000.0,
                      "funding_rate": 0.0,
                      "candles": {
                          "15": frame_to_records(long_frame),
                      },
                  },
                  "SOL": {
                      "symbol": "SOLUSDTM",
                      "mark_price": float(
                          short_frame["close"].iloc[-1]
                      ),
                      "turnover_24h": 100000000.0,
                      "volume_24h": 1000000.0,
                      "funding_rate": 0.0,
                      "candles": {
                          "15": frame_to_records(short_frame),
                      },
                  },
                  "BTC": {
                      "symbol": "XBTUSDTM",
                      "mark_price": 100.0,
                      "turnover_24h": 1000000000.0,
                      "volume_24h": 1000000.0,
                      "funding_rate": 0.0,
                      "candles": {
                          "15": frame_to_records(stable_frame),
                      },
                  },
              },
          }

          signals = generate_signals(bundle, config)
          long_signals = [
              signal
              for signal in signals
              if signal.strategy == "rsi_extreme_reversal"
              and signal.asset == "DOGE"
              and signal.side == "LONG"
          ]
          short_signals = [
              signal
              for signal in signals
              if signal.strategy == "rsi_extreme_reversal"
              and signal.asset == "SOL"
              and signal.side == "SHORT"
          ]
          assert {
              signal.portfolio
              for signal in long_signals
          } == expected_long
          assert {
              signal.portfolio
              for signal in short_signals
          } == expected_short

          state = initial_state(config, current)
          annotate_market_freshness(
              bundle,
              config,
              current,
          )
          diagnostics = build_signal_diagnostics(
              bundle,
              config,
              signals,
              state,
              current,
          )
          executable = set(
              diagnostics["executable_signal_ids"]
          )
          assert all(
              signal.signal_id in executable
              for signal in long_signals + short_signals
          )

          long_signal = next(
              signal
              for signal in long_signals
              if signal.portfolio
              == "SHADOW_RSI_LONG_15X_10"
          )
          short_signal = next(
              signal
              for signal in short_signals
              if signal.portfolio
              == "SHADOW_RSI_SHORT_15X_10"
          )

          long_portfolio = state["portfolios"][
              long_signal.portfolio
          ]
          short_portfolio = state["portfolios"][
              short_signal.portfolio
          ]

          long_position, reason = build_position(
              long_portfolio,
              long_signal,
              bundle,
              10000.0,
              config,
              current,
          )
          assert long_position is not None, reason
          short_position, reason = build_position(
              short_portfolio,
              short_signal,
              bundle,
              10000.0,
              config,
              current,
          )
          assert short_position is not None, reason

          assert round(long_position["leverage"], 2) == 15.0
          assert round(short_position["leverage"], 2) == 15.0
          assert abs(long_position["margin_eur"] - 10.0) < 0.05
          assert abs(short_position["margin_eur"] - 10.0) < 0.05
          assert (
              long_position["liquidation_price"]
              < long_position["stop_price"]
              < long_position["entry_price"]
          )
          assert (
              short_position["entry_price"]
              < short_position["stop_price"]
              < short_position["liquidation_price"]
          )

          print(
              json.dumps(
                  {
                      "long_score": long_setup["score"],
                      "short_score": short_setup["score"],
                      "long_signals": len(long_signals),
                      "short_signals": len(short_signals),
                      "long_margin": long_position["margin_eur"],
                      "short_margin": short_position["margin_eur"],
                      "leverage": long_position["leverage"],
                  },
                  indent=2,
              )
          )
          print("RSI extreme long/short self-test: OK")

          PY

      - name: Commit RSI extreme scalping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            paper_rsi_extreme_scalping.py \
            paper_signal_engine.py \
            paper_trading_diagnostics.py \
            paper_trading_engine.py \
            paper_trading_config.py \
            paper_trading_config.json \
            paper_trading_display.py \
            paper_trading_report.py \
            paper_trading_notify.py

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m \
              "Add RSI extreme long and short scalp paper tests"
            git push
          fi
