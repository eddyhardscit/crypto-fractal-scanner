name: Apply RSI Capitulation Scalping Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-paper-trading.txt

      - name: Add RSI capitulation signal logic
        run: |
          echo '' | base64 -d > /tmp/patch_signal.py
          python /tmp/patch_signal.py

      - name: Integrate RSI scalp diagnostics
        run: |
          echo '' | base64 -d > /tmp/patch_diagnostics.py
          python /tmp/patch_diagnostics.py

      - name: Add fixed margin leverage and liquidation simulation
        run: |
          echo '' | base64 -d > /tmp/patch_engine.py
          python /tmp/patch_engine.py

      - name: Update paper-only leverage validation
        run: |
          echo '' | base64 -d > /tmp/patch_config_loader.py
          python /tmp/patch_config_loader.py

      - name: Add three RSI scalp portfolios
        run: |
          echo '' | base64 -d > /tmp/patch_config_json.py
          python /tmp/patch_config_json.py

      - name: Add readable names and liquidation fields
        run: |
          echo '' | base64 -d > /tmp/patch_display.py
          python /tmp/patch_display.py
          echo '' | base64 -d > /tmp/patch_report_notify.py
          python /tmp/patch_report_notify.py

      - name: Compile modified modules
        run: |
          python -m py_compile \
            paper_signal_engine.py \
            paper_trading_diagnostics.py \
            paper_trading_engine.py \
            paper_trading_config.py \
            paper_trading_display.py \
            paper_trading_report.py \
            paper_trading_notify.py

      - name: Run offline RSI capitulation self-test
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json

          import numpy as np
          import pandas as pd

          from kucoin_public_data import frame_to_records
          from paper_signal_engine import (
              generate_signals,
              rsi_capitulation_setup,
          )
          from paper_trading_config import load_config
          from paper_trading_diagnostics import (
              annotate_market_freshness,
              build_signal_diagnostics,
          )
          from paper_trading_engine import (
              build_position,
              initial_state,
          )

          config = load_config()
          names = {
              row["name"]
              for row in config["portfolios"]
          }
          expected = {
              "SHADOW_RSI_CAP_15X_10",
              "SHADOW_RSI_CAP_15X_50",
              "SHADOW_RSI_CAP_5X",
          }
          assert expected.issubset(names)
          assert "DOGE" in config["universe"]["mandatory_assets"]

          current = datetime(
              2026,
              7,
              12,
              18,
              31,
              tzinfo=timezone.utc,
          )
          index = pd.date_range(
              end=pd.Timestamp(
                  "2026-07-12T18:15:00Z"
              ),
              periods=80,
              freq="15min",
          )

          closes = [
              100.0 + 0.03 * np.sin(i / 3)
              for i in range(60)
          ]
          closes += [
              99.5, 99.0, 98.5, 98.0, 97.5,
              97.0, 96.5, 96.0, 95.5, 95.0,
              94.5, 94.0, 93.5, 93.0, 92.5,
              92.0, 91.5, 91.0,
          ]
          closes += [88.5, 92.2]

          opened = []
          highs = []
          lows = []
          volumes = []
          for i, value in enumerate(closes):
              previous = (
                  closes[i - 1]
                  if i
                  else value
              )
              opened.append(previous)
              highs.append(max(previous, value) + 0.15)
              lows.append(min(previous, value) - 0.15)
              volumes.append(100.0)

          opened[-2] = 91.0
          highs[-2] = 91.2
          lows[-2] = 87.8
          closes[-2] = 88.5
          volumes[-2] = 500.0

          opened[-1] = 88.5
          highs[-1] = 92.4
          lows[-1] = 88.3
          closes[-1] = 92.2
          volumes[-1] = 220.0

          doge = pd.DataFrame(
              {
                  "open": opened,
                  "high": highs,
                  "low": lows,
                  "close": closes,
                  "volume": volumes,
              },
              index=index,
          )
          stable = pd.DataFrame(
              {
                  "open": [100.0] * len(index),
                  "high": [100.2] * len(index),
                  "low": [99.8] * len(index),
                  "close": [100.0] * len(index),
                  "volume": [100.0] * len(index),
              },
              index=index,
          )

          scalp_definition = next(
              row
              for row in config["portfolios"]
              if row["name"]
              == "SHADOW_RSI_CAP_15X_10"
          )
          setup = rsi_capitulation_setup(
              doge,
              scalp_definition,
          )
          assert setup["accepted"], setup
          assert setup["score"] >= 8.0
          assert setup["stop_pct"] <= 0.05

          bundle = {
              "schema_version": 1,
              "generated_utc": current.isoformat(),
              "source": "OFFLINE_RSI_SCALP_TEST",
              "eur_usdt_rate": 1.0,
              "eur_usdt_rate_source": "TEST",
              "failures": [],
              "assets": {
                  "DOGE": {
                      "symbol": "DOGEUSDTM",
                      "mark_price": float(
                          doge["close"].iloc[-1]
                      ),
                      "turnover_24h": 100000000.0,
                      "volume_24h": 1000000.0,
                      "funding_rate": 0.0,
                      "candles": {
                          "15": frame_to_records(doge),
                      },
                  },
                  "BTC": {
                      "symbol": "XBTUSDTM",
                      "mark_price": 100.0,
                      "turnover_24h": 1000000000.0,
                      "volume_24h": 1000000.0,
                      "funding_rate": 0.0,
                      "candles": {
                          "15": frame_to_records(stable),
                      },
                  },
              },
          }

          signals = generate_signals(bundle, config)
          scalp_signals = [
              signal
              for signal in signals
              if signal.strategy
              == "rsi_capitulation_scalp"
              and signal.asset == "DOGE"
          ]
          assert {
              signal.portfolio
              for signal in scalp_signals
          } == expected

          state = initial_state(config, current)
          annotate_market_freshness(
              bundle,
              config,
              current,
          )
          diagnostics = build_signal_diagnostics(
              bundle,
              config,
              signals,
              state,
              current,
          )
          executable = set(
              diagnostics["executable_signal_ids"]
          )
          assert all(
              signal.signal_id in executable
              for signal in scalp_signals
          )

          fixed_signal = next(
              signal
              for signal in scalp_signals
              if signal.portfolio
              == "SHADOW_RSI_CAP_15X_10"
          )
          fixed_portfolio = state["portfolios"][
              fixed_signal.portfolio
          ]
          position, reason = build_position(
              fixed_portfolio,
              fixed_signal,
              bundle,
              10000.0,
              config,
              current,
          )
          assert position is not None, reason
          assert round(position["leverage"], 2) == 15.0
          assert abs(position["margin_eur"] - 10.0) < 0.05
          assert (
              position["liquidation_price"]
              < position["stop_price"]
              < position["entry_price"]
          )

          print(
              json.dumps(
                  {
                      "setup_score": setup["score"],
                      "signals": len(scalp_signals),
                      "fixed_margin": position["margin_eur"],
                      "leverage": position["leverage"],
                      "stop_pct": fixed_signal.stop_pct,
                  },
                  indent=2,
              )
          )
          print("RSI capitulation scalp self-test: OK")
          PY

      - name: Commit RSI capitulation scalping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            paper_signal_engine.py \
            paper_trading_diagnostics.py \
            paper_trading_engine.py \
            paper_trading_config.py \
            paper_trading_config.json \
            paper_trading_display.py \
            paper_trading_report.py \
            paper_trading_notify.py

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m \
              "Add RSI capitulation scalp paper tests"
            git push
          fi
