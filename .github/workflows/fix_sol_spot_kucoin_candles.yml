name: Manual fix SOL spot KuCoin candles

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-fix-sol-spot-kucoin-candles
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Patch KuCoin candle retrieval
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("sol_spot_adaptive_bot.py")
          source = path.read_text(encoding="utf-8")

          old = '''    rows = get_public_json(
              session,
              "/api/v1/market/candles",
              {
                  "symbol": symbol,
                  "type": interval_names[timeframe_minutes],
                  "startAt": start_at,
                  "endAt": end_at,
              },
          )
          normalized: list[dict[str, Any]] = []
          for row in rows if isinstance(rows, list) else []:
              if not isinstance(row, (list, tuple)) or len(row) < 7:
                  continue
              timestamp = pd.to_datetime(row[0], unit="s", utc=True, errors="coerce")
              opened = safe_float(row[1])
              closed = safe_float(row[2])
              high = safe_float(row[3])
              low = safe_float(row[4])
              volume = safe_float(row[5], 0.0)
              turnover = safe_float(row[6], 0.0)
              if pd.isna(timestamp) or not all(math.isfinite(v) and v > 0 for v in (opened, high, low, closed)):
                  continue
              normalized.append(
                  {
                      "time": timestamp,
                      "open": opened,
                      "high": high,
                      "low": low,
                      "close": closed,
                      "volume": max(0.0, volume),
                      "turnover": max(0.0, turnover),
                  }
              )
          if not normalized:
              raise RuntimeError("KuCoin returned no usable SOL spot candles.")
          '''

          new = '''    request_variants = [
              {
                  "symbol": symbol,
                  "type": interval_names[timeframe_minutes],
                  "startAt": start_at,
                  "endAt": end_at,
              },
              {
                  "symbol": symbol,
                  "type": interval_names[timeframe_minutes],
              },
          ]

          normalized: list[dict[str, Any]] = []
          diagnostics: list[str] = []

          for request_params in request_variants:
              try:
                  rows = get_public_json(
                      session,
                      "/api/v1/market/candles",
                      request_params,
                  )
              except Exception as exc:
                  diagnostics.append(
                      f"params={request_params}: request failed: {exc}"
                  )
                  continue

              raw_count = len(rows) if isinstance(rows, list) else 0
              accepted_before = len(normalized)

              for row in rows if isinstance(rows, list) else []:
                  if not isinstance(row, (list, tuple)) or len(row) < 6:
                      continue

                  timestamp = pd.to_datetime(
                      row[0],
                      unit="s",
                      utc=True,
                      errors="coerce",
                  )
                  opened = safe_float(row[1])
                  closed = safe_float(row[2])
                  high = safe_float(row[3])
                  low = safe_float(row[4])
                  volume = safe_float(row[5], 0.0)
                  turnover = (
                      safe_float(row[6], 0.0)
                      if len(row) >= 7
                      else 0.0
                  )

                  if pd.isna(timestamp):
                      continue
                  if not all(
                      math.isfinite(value) and value > 0
                      for value in (opened, high, low, closed)
                  ):
                      continue

                  normalized.append(
                      {
                          "time": timestamp,
                          "open": opened,
                          "high": high,
                          "low": low,
                          "close": closed,
                          "volume": max(0.0, volume),
                          "turnover": max(0.0, turnover),
                      }
                  )

              diagnostics.append(
                  f"params={request_params}: raw={raw_count}, "
                  f"accepted={len(normalized) - accepted_before}"
              )
              if normalized:
                  break

          if not normalized:
              raise RuntimeError(
                  "KuCoin returned no usable SOL spot candles after "
                  "windowed and fallback requests. "
                  + " | ".join(diagnostics)
              )
          '''

          if old not in source:
              raise SystemExit(
                  "Expected candle-retrieval block not found; "
                  "repository code differs from the validated version."
              )

          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate patched bot
        run: |
          python -m pip install numpy pandas requests
          python -m py_compile sol_spot_adaptive_bot.py
          python sol_spot_adaptive_bot.py \
            --config sol_spot_adaptive_config.json \
            --self-test
          git diff --check

      - name: Commit candle fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add sol_spot_adaptive_bot.py
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "KuCoin candle fallback already installed."
          else
            git commit -m "Fix SOL spot KuCoin candle fallback"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
