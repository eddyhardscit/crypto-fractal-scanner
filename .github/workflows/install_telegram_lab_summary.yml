name: Manual install Telegram lab summary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Patch Telegram laboratory summary
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import base64
          from pathlib import Path

          path = Path("paper_trading_notify.py")
          source = path.read_text(encoding="utf-8")
          patches = [('aW1wb3J0IG1hdGgKaW1wb3J0IG9zCmZyb20gZGF0ZXRpbWUgaW1wb3J0IGRhdGV0aW1lLCB0aW1lZGVsdGEsIHRpbWV6b25lCmZyb20gdHlwaW5nIGltcG9ydCBBbnkK', 'aW1wb3J0IGNzdgppbXBvcnQganNvbgppbXBvcnQgbWF0aAppbXBvcnQgb3MKZnJvbSBkYXRldGltZSBpbXBvcnQgZGF0ZXRpbWUsIHRpbWVkZWx0YSwgdGltZXpvbmUKZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCmZyb20gdHlwaW5nIGltcG9ydCBBbnkK'), ('ZGVmIGJ1aWxkX2V2ZW50X21lc3NhZ2VzKHN1bW1hcnk6IGRpY3Rbc3RyLCBBbnldKSAtPiBsaXN0W3N0cl06Cg==', ''), ('ICAgIHJldHVybiAiXG4iLmpvaW4obGluZXMpCgoKZGVmIF9zZW5kX3RleHQ=', 'ICAgIGxpbmVzLmV4dGVuZChfb2ZmaWNpYWxfbGFiX2xpbmVzKG1ldHJpY3MsIGluaXRpYWwpKQogICAgbGluZXMuZXh0ZW5kKF9hdXhpbGlhcnlfbGFiX2xpbmVzKCkpCgogICAgcmV0dXJuICJcbiIuam9pbihsaW5lcykKCgpkZWYgX3NlbmRfdGV4dA==')]

          for old64, new64 in patches:
              old = base64.b64decode(old64).decode()
              new = base64.b64decode(new64).decode()
              if new in source:
                  continue
              if old not in source:
                  raise SystemExit("Expected patch block not found")
              source = source.replace(old, new, 1)

          ast.parse(source)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Validate
        run: |
          python -m pip install requests pandas numpy
          python -m py_compile paper_trading_notify.py
          python - <<'PY'
          import paper_trading_notify as n
          text = "\n".join(n._official_lab_lines([
              {"portfolio":"MAIN","equity_eur":10100,"closed_trades":2,"open_positions":1},
              {"portfolio":"SHADOW_FAST","equity_eur":9950,"closed_trades":1,"open_positions":0},
          ], 10000))
          assert "HALL OF FAME" in text
          assert "BOTTOM 5" in text
          assert "In profitto: 1" in text
          assert "in perdita: 1" in text
          aux = "\n".join(n._auxiliary_lab_lines())
          assert "Profili previsti: 15" in aux
          print("PASS")
          PY
          git diff --check

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_trading_notify.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Already installed"
          else
            git commit -m "Add Telegram laboratory ranking summary"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
