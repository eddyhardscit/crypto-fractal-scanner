name: Install Open Positions Telegram V3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install paper-trading dependencies
        run: python -m pip install -r requirements-paper-trading.txt

      - name: Install independent open-positions notifier
        shell: bash
        run: |
          echo '' | base64 --decode > paper_trading_open_positions_notify.py

          python - <<'PY'
          from pathlib import Path

          runner_path = Path("paper_trading_runner.py")
          if not runner_path.exists():
              raise SystemExit("paper_trading_runner.py non trovato.")

          runner = runner_path.read_text(encoding="utf-8")

          import_line = (
              "from paper_trading_open_positions_notify "
              "import send_open_positions_report\n"
          )
          if import_line not in runner:
              anchor = "from paper_trading_notify import notify\n"
              if anchor not in runner:
                  raise SystemExit(
                      "Import paper_trading_notify non trovato."
                  )
              runner = runner.replace(
                  anchor,
                  anchor + import_line,
                  1,
              )

          marker = "# OPEN_POSITIONS_TELEGRAM_SEPARATE_V3"
          if marker not in runner:
              anchor = '''    try:
              telegram_result = notify(summary, state, config, current)
          except Exception as exc:
              telegram_result = {"configured": True, "sent": False, "error": str(exc)}
              print(f"Telegram paper trading non inviato: {exc}")

          '''
              replacement = '''    try:
              telegram_result = notify(summary, state, config, current)
          except Exception as exc:
              telegram_result = {"configured": True, "sent": False, "error": str(exc)}
              print(f"Telegram paper trading non inviato: {exc}")

              # OPEN_POSITIONS_TELEGRAM_SEPARATE_V3
              open_positions_telegram_result = {
                  "configured": False,
                  "sent": False,
                  "messages": 0,
                  "skipped": True,
              }
              if telegram_result.get("account_summary_sent"):
                  try:
                      open_positions_telegram_result = (
                          send_open_positions_report(
                              state,
                              config,
                              bundle,
                              current,
                          )
                      )
                  except Exception as exc:
                      open_positions_telegram_result = {
                          "configured": True,
                          "sent": False,
                          "messages": 0,
                          "error": str(exc),
                      }
                      print(
                          "Telegram posizioni aperte non inviato: "
                          f"{exc}"
                      )

          '''
              if anchor not in runner:
                  raise SystemExit(
                      "Blocco notify attuale non trovato nel runner."
                  )
              runner = runner.replace(anchor, replacement, 1)

          payload_anchor = '''        "telegram_paper": telegram_result,
              "telegram_scanner": scanner_telegram_result,
          '''
          payload_replacement = '''        "telegram_paper": telegram_result,
              "telegram_open_positions": open_positions_telegram_result,
              "telegram_scanner": scanner_telegram_result,
          '''
          if (
              '"telegram_open_positions": open_positions_telegram_result'
              not in runner
          ):
              if payload_anchor not in runner:
                  raise SystemExit(
                      "Anchor payload Telegram non trovato."
                  )
              runner = runner.replace(
                  payload_anchor,
                  payload_replacement,
                  1,
              )

          runner_path.write_text(runner, encoding="utf-8")
          PY

      - name: Validate installation
        shell: bash
        run: |
          python -m py_compile \
            paper_trading_open_positions_notify.py \
            paper_trading_runner.py

          python - <<'PY'
          from datetime import datetime, timezone

          from paper_trading_open_positions_notify import (
              build_open_positions_messages,
          )

          state = {
              "portfolios": {
                  "MAIN": {
                      "open_positions": [
                          {
                              "asset": "DOGE",
                              "side": "SHORT",
                              "timeframe_minutes": 240,
                              "opened_at": "2026-07-13T06:00:00+00:00",
                              "entry_price": 0.078,
                              "stop_price": 0.0806,
                              "target_price": 0.060,
                              "quantity": 100000,
                              "notional_eur": 7800,
                              "margin_eur": 1560,
                              "leverage": 5,
                              "funding_pnl_eur": 0,
                              "atr_pct": 3.9,
                          }
                      ]
                  }
              }
          }
          config = {
              "eur_usdt_fallback_rate": 1.0,
              "portfolios": [
                  {"name": "MAIN", "enabled": True},
              ],
          }
          bundle = {
              "eur_usdt_rate": 1.0,
              "assets": {
                  "DOGE": {"mark_price": 0.076},
              },
          }
          messages = build_open_positions_messages(
              state,
              config,
              bundle,
              datetime(
                  2026,
                  7,
                  13,
                  8,
                  0,
                  tzinfo=timezone.utc,
              ),
          )
          text = "\n".join(messages)
          assert "POSIZIONI PAPER ANCORA APERTE" in text
          assert "DOGE SHORT" in text
          assert "+€200,00" in text
          assert "Rischio:" in text
          assert "aperta da 2h 0m" in text
          print("Test messaggio posizioni aperte superato.")
          PY

          python - <<'PY'
          from pathlib import Path

          runner = Path("paper_trading_runner.py").read_text(
              encoding="utf-8"
          )
          assert (
              "from paper_trading_open_positions_notify "
              "import send_open_positions_report"
          ) in runner
          assert "# OPEN_POSITIONS_TELEGRAM_SEPARATE_V3" in runner
          assert "telegram_result.get(\"account_summary_sent\")" in runner
          assert '"telegram_open_positions"' in runner
          print("Self-test patch runner completato.")
          PY

      - name: Commit installation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            paper_trading_open_positions_notify.py \
            paper_trading_runner.py

          if git diff --cached --quiet; then
            echo "Messaggio posizioni aperte già installato."
          else
            git commit -m \
              "Add independent Telegram open positions report"
            git push origin HEAD:main
          fi
