name: Apply Balanced and Fast V2 Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt requests

      - name: Create Bilanciata 1H V2 and Rapida 1H V2
        shell: bash
        run: |
          echo "" | base64 --decode > /tmp/apply_balanced_fast_v2.py
          python /tmp/apply_balanced_fast_v2.py

      - name: Validate V1 and V2 accounts
        shell: bash
        run: |
          python -m py_compile \
            paper_signal_engine.py \
            paper_trading_display.py \
            research_sample_watch.py \
            research_all_signals.py \
            paper_trading_diagnostics.py

          python - <<'PYTEST'
          from paper_signal_engine import (
              Signal,
              apply_signal_caps,
              core_strategy_v2_accepts,
          )
          from paper_trading_config import load_config
          from paper_trading_display import portfolio_label
          from research_sample_watch import (
              CORE_PROFILES,
              PROFILE_LABELS,
          )

          config = load_config()
          portfolios = {
              row["name"]: row
              for row in config["portfolios"]
          }

          balanced_v1 = portfolios["SHADOW_1H_BALANCED"]
          balanced_v2 = portfolios["SHADOW_1H_BALANCED_V2"]
          fast_v1 = portfolios["SHADOW_1H_FAST"]
          fast_v2 = portfolios["SHADOW_1H_FAST_V2"]

          assert balanced_v1["strategy"] == "confluence_trend"
          assert fast_v1["strategy"] == "momentum_breakout"
          assert balanced_v2["strategy"] == "confluence_trend_v2"
          assert fast_v2["strategy"] == "momentum_breakout_v2"
          assert balanced_v2["minimum_abs_score"] == 5.5
          assert fast_v2["minimum_abs_score"] == 5.0

          assert (
              portfolio_label("SHADOW_1H_BALANCED")
              == "Bilanciata 1H V1"
          )
          assert (
              portfolio_label("SHADOW_1H_BALANCED_V2")
              == "Bilanciata 1H V2"
          )
          assert (
              portfolio_label("SHADOW_1H_FAST")
              == "Rapida 1H V1"
          )
          assert (
              portfolio_label("SHADOW_1H_FAST_V2")
              == "Rapida 1H V2"
          )

          for name in (
              "SHADOW_1H_BALANCED_V2",
              "SHADOW_1H_FAST_V2",
          ):
              assert name in CORE_PROFILES
              assert name in PROFILE_LABELS

          range_context = {
              "regime": "RANGE",
              "features": {},
          }
          transition_context = {
              "regime": "TRANSITION",
              "features": {},
          }
          bad_context = {
              "regime": "RANGE_HIGH_VOL",
              "features": {},
          }
          trend_context = {
              "regime": "TREND_UP",
              "features": {},
          }

          balanced_features = {
              "price": 110.0,
              "ema20": 105.0,
              "ema50": 100.0,
              "rsi14": 61.0,
              "ret_short_pct": 1.0,
              "ret_medium_pct": 2.0,
              "breakout_state": "NONE",
              "adx14": 15.0,
              "volume_ratio": 1.0,
          }

          assert core_strategy_v2_accepts(
              "confluence_trend_v2",
              "LONG",
              balanced_features,
              balanced_v2,
              range_context,
          )
          assert not core_strategy_v2_accepts(
              "confluence_trend_v2",
              "LONG",
              balanced_features,
              balanced_v2,
              bad_context,
          )
          assert not core_strategy_v2_accepts(
              "confluence_trend_v2",
              "LONG",
              balanced_features,
              balanced_v2,
              trend_context,
          )

          fast_features = {
              **balanced_features,
              "breakout_state": "UP",
              "adx14": 24.0,
              "volume_ratio": 1.5,
          }
          assert core_strategy_v2_accepts(
              "momentum_breakout_v2",
              "LONG",
              fast_features,
              fast_v2,
              transition_context,
          )
          no_breakout = {
              **fast_features,
              "breakout_state": "NONE",
          }
          assert not core_strategy_v2_accepts(
              "momentum_breakout_v2",
              "LONG",
              no_breakout,
              fast_v2,
              transition_context,
          )

          def signal(
              asset: str,
              strength: float,
          ) -> Signal:
              return Signal(
                  signal_id=asset,
                  experiment_group_id="episode",
                  portfolio="SHADOW_1H_BALANCED_V2",
                  is_main=False,
                  strategy="confluence_trend_v2",
                  asset=asset,
                  symbol=asset + "-USDT",
                  timeframe_minutes=60,
                  candle_time="2026-07-17T12:00:00+00:00",
                  side="LONG",
                  score=6.0,
                  confidence="BUONA",
                  entry_reference_price=100.0,
                  atr_pct=2.0,
                  stop_pct=0.036,
                  target_pct=0.072,
                  leverage=3.0,
                  max_holding_hours=120,
                  trailing_at_r=1.0,
                  trailing_atr_multiple=1.4,
                  reason="test",
                  relative_strength_score=strength,
                  breakout_state="UP",
                  global_overlay=0.0,
                  exchange_overlay=0.0,
              )

          capped = apply_signal_caps(
              [
                  signal("AAA", 1.0),
                  signal("BBB", 3.0),
                  signal("CCC", 2.0),
              ],
              config,
          )
          assert [
              row.asset
              for row in capped
          ] == ["BBB", "CCC"]

          print(
              "Validazione Bilanciata/Rapida V1-V2 completata"
          )
          PYTEST

          git diff --check

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nessuna modifica necessaria: le V2 sono già installate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            paper_trading_config.json \
            paper_signal_engine.py \
            paper_trading_display.py \
            research_sample_watch.py \
            research_all_signals.py \
            paper_trading_diagnostics.py
          git commit -m "Add Balanced 1H V2 and Fast 1H V2 research accounts"
          git push
