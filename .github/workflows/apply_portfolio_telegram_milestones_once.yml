name: Apply Portfolio Telegram Milestones Once

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply portfolio milestone notifications
        env:
          PORTFOLIO_MILESTONE_PATCH_B64: ""
        run: |
          python -c 'import base64, os; exec(compile(base64.b64decode(os.environ["PORTFOLIO_MILESTONE_PATCH_B64"]), "<portfolio-milestones>", "exec"))'

      - name: Validate notification system
        run: |
          set -euxo pipefail
          python -m py_compile             portfolio_sample_watch.py             paper_trading_notify.py

          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(
              Path("paper_trading_config.json").read_text(
                  encoding="utf-8"
              )
          )
          assert config["notifications"][
              "portfolio_trade_milestones"
          ] == [30, 100, 200, 300]

          module = Path(
              "portfolio_sample_watch.py"
          ).read_text(encoding="utf-8")
          notify = Path(
              "paper_trading_notify.py"
          ).read_text(encoding="utf-8")

          assert "pending_portfolio_notifications" in module
          assert "portfolio_trade_milestones_sent" in module
          assert "average_mfe_net_eur" in module
          assert "average_mae_net_eur" in module
          assert "pending_portfolio_notifications" in notify
          assert "mark_portfolio_notifications_sent" in notify
          print("Portfolio Telegram milestones validated.")
          PY

      - name: Commit notification system
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email             41898282+github-actions[bot]@users.noreply.github.com

          git add             portfolio_sample_watch.py             paper_trading_notify.py             paper_trading_config.json

          if git diff --cached --quiet; then
            echo "Portfolio milestone notifications already installed."
            exit 0
          fi

          git commit -m             "Add Telegram milestones for every shadow portfolio"
          git pull --rebase origin main
          git push origin HEAD:main
