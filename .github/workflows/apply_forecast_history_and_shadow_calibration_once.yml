name: Apply Forecast History And Shadow Calibration Once

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib

      - name: Apply history and shadow calibration
        env:
          FORECAST_SHADOW_PATCH_B64: ""
        run: |
          python -c 'import base64, os; exec(compile(base64.b64decode(os.environ["FORECAST_SHADOW_PATCH_B64"]), "<forecast-history-shadow>", "exec"))'

      - name: Validate tracker and calibration gates
        run: |
          set -euxo pipefail

          python -m py_compile             scanner_forecast_tracker.py             scanner_forecast_shadow_calibration.py

          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          from scanner_forecast_shadow_calibration import (
              CALIBRATION_MIN_CONTROLS,
              build_shadow_cone,
          )

          tracker = Path(
              "scanner_forecast_tracker.py"
          ).read_text(encoding="utf-8")
          assert "SHADOW_CALIBRATION_NO_LEAKAGE_V1" in tracker
          assert "plot_frozen_cone_review" in tracker
          assert "build_shadow_cone" in tracker
          assert "Cono calibrato shadow" in tracker
          assert "Confronto fuori campione" in tracker

          raw = pd.DataFrame(
              {
                  "day": list(range(31)),
                  "p10_price": [90.0] * 31,
                  "p25_price": [95.0] * 31,
                  "p50_price": [100.0] * 31,
                  "p75_price": [105.0] * 31,
                  "p90_price": [110.0] * 31,
              }
          )

          price_index = pd.date_range(
              "2025-01-01",
              "2027-12-31",
              freq="D",
          )
          prices = pd.DataFrame(
              {"Close": [106.0] * len(price_index)},
              index=price_index,
          )

          def history_with_weeks(weeks):
              rows = []
              for start in pd.date_range(
                  "2025-01-01",
                  periods=weeks,
                  freq="7D",
              ):
                  for horizon in range(31):
                      rows.append(
                          {
                              "snapshot_date": start.date().isoformat(),
                              "target_ticker": "BTC-USD",
                              "target_date": (
                                  start
                                  + pd.Timedelta(days=horizon)
                              ).date().isoformat(),
                              "horizon_day": horizon,
                              "p10_price": 90.0,
                              "p25_price": 95.0,
                              "p50_price": 100.0,
                              "p75_price": 105.0,
                              "p90_price": 110.0,
                          }
                      )
              return pd.DataFrame(rows)

          shadow_29, status_29 = build_shadow_cone(
              "BTC-USD",
              raw,
              history_with_weeks(
                  CALIBRATION_MIN_CONTROLS - 1
              ),
              {"BTC-USD": prices},
          )
          assert not any(
              item["active"]
              for item in status_29
          )
          assert (
              shadow_29["shadow_p50_price"]
              == shadow_29["raw_p50_price"]
          ).all()

          shadow_30, status_30 = build_shadow_cone(
              "BTC-USD",
              raw,
              history_with_weeks(
                  CALIBRATION_MIN_CONTROLS
              ),
              {"BTC-USD": prices},
          )
          assert any(
              item["active"]
              for item in status_30
          )
          active_rows = shadow_30[
              shadow_30["calibration_active"]
          ]
          assert not active_rows.empty
          assert (
              active_rows["shadow_p50_price"]
              != active_rows["raw_p50_price"]
          ).any()

          print(
              "Forecast history and shadow calibration validated."
          )
          PY

      - name: Commit combined upgrade
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email             41898282+github-actions[bot]@users.noreply.github.com

          git add             scanner_forecast_tracker.py             scanner_forecast_shadow_calibration.py

          if git diff --cached --quiet; then
            echo "Combined forecast upgrade already installed."
            exit 0
          fi

          git commit -m             "Add frozen cone review and shadow calibration"
          git pull --rebase origin main
          git push origin HEAD:main
