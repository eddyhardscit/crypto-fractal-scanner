name: Apply Final Logic Tweaks Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-final-logic:
    runs-on: ubuntu-latest

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply final logic tweaks
        run: python apply_final_logic_tweaks.py

      - name: Compile modified files
        run: |
          python -m py_compile \
            global_confluence_report.py \
            decision_report.py

      - name: Commit modified files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            global_confluence_report.py \
            decision_report.py \
            apply_final_logic_tweaks.py

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refine RSI top risk and BTC leverage confirmation"
            git push
          fi
