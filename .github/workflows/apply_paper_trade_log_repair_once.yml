name: Repair Paper Trade Log CSV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install resilient trade-log repair
        shell: bash
        run: |
          echo '' | base64 --decode > paper_trading_trade_log_repair.py

          python - <<'PY'
          from pathlib import Path

          engine_path = Path("paper_trading_engine.py")
          runner_path = Path("paper_trading_runner.py")
          report_path = Path("paper_trading_report.py")
          sample_path = Path("paper_trading_sample_watch.py")
          storage_path = Path("paper_trading_storage.py")

          required = [
              engine_path,
              runner_path,
              report_path,
              sample_path,
              storage_path,
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f"File mancanti: {missing}")

          engine = engine_path.read_text(encoding="utf-8")
          marker = "# TRADE_LOG_SCHEMA_GUARD_V1"
          if marker not in engine:
              anchor = '''def append_csv(path: Path, fieldnames: list[str], row: dict[str, Any]) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
          '''
              replacement = '''def append_csv(path: Path, fieldnames: list[str], row: dict[str, Any]) -> None:
              # TRADE_LOG_SCHEMA_GUARD_V1
              if path == TRADE_LOG_PATH:
                  from paper_trading_trade_log_repair import (
                      ensure_trade_log_schema,
                  )
                  ensure_trade_log_schema(path, fieldnames)
              path.parent.mkdir(parents=True, exist_ok=True)
          '''
              if anchor not in engine:
                  raise SystemExit("Anchor append_csv non trovato")
              engine = engine.replace(anchor, replacement, 1)
          engine_path.write_text(engine, encoding="utf-8")

          runner = runner_path.read_text(encoding="utf-8")
          if "TRADE_FIELDS," not in runner:
              anchor = '''from paper_trading_engine import (
              current_prices,
          '''
              replacement = '''from paper_trading_engine import (
              TRADE_FIELDS,
              TRADE_LOG_PATH,
              current_prices,
          '''
              if anchor not in runner:
                  raise SystemExit("Anchor import engine nel runner non trovato")
              runner = runner.replace(anchor, replacement, 1)

          repair_import = '''from paper_trading_trade_log_repair import (
              reconcile_state_counters,
              repair_trade_log,
          )
          '''
          if repair_import not in runner:
              anchor = "from paper_trading_live_publish import publish_markdown\n"
              if anchor not in runner:
                  raise SystemExit("Anchor import publish non trovato")
              runner = runner.replace(
                  anchor,
                  repair_import + anchor,
                  1,
              )

          if "# TRADE_LOG_REPAIR_STARTUP_V1" not in runner:
              anchor = '''def main() -> None:
              config = load_config()
              bundle = annotate_market_freshness(
          '''
              replacement = '''def main() -> None:
              config = load_config()
              # TRADE_LOG_REPAIR_STARTUP_V1
              trade_log_repair = repair_trade_log(
                  TRADE_LOG_PATH,
                  TRADE_FIELDS,
              )
              bundle = annotate_market_freshness(
          '''
              if anchor not in runner:
                  raise SystemExit("Anchor main/config non trovato")
              runner = runner.replace(anchor, replacement, 1)

              anchor = '''    state = load_state(config)
              signal_diagnostics = build_signal_diagnostics(
          '''
              replacement = '''    state = load_state(config)
              trade_log_reconcile = reconcile_state_counters(
                  state,
                  list(trade_log_repair.get("records", [])),
              )
              signal_diagnostics = build_signal_diagnostics(
          '''
              if anchor not in runner:
                  raise SystemExit("Anchor load_state non trovato")
              runner = runner.replace(anchor, replacement, 1)

          runner_path.write_text(runner, encoding="utf-8")

          report = report_path.read_text(encoding="utf-8")
          report = report.replace(
              "from paper_trading_engine import STATE_PATH, TRADE_LOG_PATH\n",
              (
                  "from paper_trading_engine import "
                  "STATE_PATH, TRADE_FIELDS, TRADE_LOG_PATH\n"
              ),
          )
          repair_report_import = '''from paper_trading_trade_log_repair import (
              fallback_metrics_from_portfolio,
              load_trade_frame_resilient,
          )
          '''
          if repair_report_import not in report:
              anchor = "from paper_trading_sample_watch import sample_snapshot\n"
              if anchor not in report:
                  raise SystemExit("Anchor report sample_watch non trovato")
              report = report.replace(
                  anchor,
                  anchor + repair_report_import,
                  1,
              )

          old_loader = '''def load_trades() -> pd.DataFrame:
              if not TRADE_LOG_PATH.exists():
                  return pd.DataFrame()
              try:
                  return pd.read_csv(TRADE_LOG_PATH)
              except Exception:
                  return pd.DataFrame()
          '''
          new_loader = '''def load_trades() -> pd.DataFrame:
              # TRADE_LOG_RESILIENT_READER_V1
              return load_trade_frame_resilient(
                  TRADE_LOG_PATH,
                  TRADE_FIELDS,
              )
          '''
          if old_loader in report:
              report = report.replace(old_loader, new_loader, 1)
          elif "# TRADE_LOG_RESILIENT_READER_V1" not in report:
              raise SystemExit("Loader report non riconosciuto")

          old_empty = '''        if subset.empty:
                      trade_count = wins = unique_events = 0
                      net = expectancy = win_rate = 0.0
                      profit_factor = 0.0
                  else:
          '''
          new_empty = '''        state_fallback = fallback_metrics_from_portfolio(portfolio)
                  if (
                      subset.empty
                      or int(state_fallback["closed_trades"]) > len(subset)
                  ):
                      # State fallback prevents a false all-zero or partial
                      # display if historical CSV rows are unrecoverable.
                      trade_count = int(state_fallback["closed_trades"])
                      wins = int(state_fallback["winning_trades"])
                      unique_events = (
                          subset.get(
                              "experiment_group_id",
                              pd.Series(dtype=str),
                          ).astype(str).nunique()
                          if not subset.empty
                          else 0
                      )
                      net = float(state_fallback["net_pnl_eur"])
                      expectancy = float(state_fallback["expectancy_eur"])
                      win_rate = float(state_fallback["win_rate_pct"])
                      profit_factor = float(state_fallback["profit_factor"])
                  else:
          '''
          if old_empty in report:
              report = report.replace(old_empty, new_empty, 1)
          elif "State fallback prevents a false all-zero display" not in report:
              raise SystemExit("Blocco subset.empty report non riconosciuto")
          report_path.write_text(report, encoding="utf-8")

          sample = sample_path.read_text(encoding="utf-8")
          sample = sample.replace(
              "from paper_trading_engine import TRADE_LOG_PATH\n",
              (
                  "from paper_trading_engine import "
                  "TRADE_FIELDS, TRADE_LOG_PATH\n"
              ),
          )
          repair_sample_import = (
              "from paper_trading_trade_log_repair "
              "import load_trade_frame_resilient\n"
          )
          if repair_sample_import not in sample:
              anchor = (
                  "from paper_trading_engine import "
                  "TRADE_FIELDS, TRADE_LOG_PATH\n"
              )
              if anchor not in sample:
                  raise SystemExit("Anchor sample engine non trovato")
              sample = sample.replace(
                  anchor,
                  anchor + repair_sample_import,
                  1,
              )

          old_sample_loader = '''def _load_trades() -> pd.DataFrame:
              if not TRADE_LOG_PATH.exists():
                  return pd.DataFrame()
              try:
                  return pd.read_csv(TRADE_LOG_PATH)
              except Exception:
                  return pd.DataFrame()
          '''
          new_sample_loader = '''def _load_trades() -> pd.DataFrame:
              # TRADE_LOG_RESILIENT_SAMPLE_READER_V1
              return load_trade_frame_resilient(
                  TRADE_LOG_PATH,
                  TRADE_FIELDS,
              )
          '''
          if old_sample_loader in sample:
              sample = sample.replace(
                  old_sample_loader,
                  new_sample_loader,
                  1,
              )
          elif "# TRADE_LOG_RESILIENT_SAMPLE_READER_V1" not in sample:
              raise SystemExit("Loader sample non riconosciuto")
          sample_path.write_text(sample, encoding="utf-8")

          storage = storage_path.read_text(encoding="utf-8")
          extra_files = [
              "paper_trading_trade_log_before_repair.csv",
              "paper_trading_trade_log_quarantine.csv",
              "paper_trading_trade_log_repair_status.json",
          ]
          for filename in extra_files:
              line = f'    "{filename}",\n'
              if line in storage:
                  continue
              anchor = '    "paper_trading_trade_log.csv",\n'
              if anchor not in storage:
                  raise SystemExit("Anchor storage trade log non trovato")
              storage = storage.replace(
                  anchor,
                  anchor + line,
                  1,
              )
          storage_path.write_text(storage, encoding="utf-8")
          PY

      - name: Validate code and repair behavior
        shell: bash
        run: |
          python -m py_compile \
            paper_trading_trade_log_repair.py \
            paper_trading_engine.py \
            paper_trading_runner.py \
            paper_trading_report.py \
            paper_trading_sample_watch.py \
            paper_trading_storage.py

          python - <<'PY'
          import csv
          import tempfile
          from pathlib import Path

          from paper_trading_engine import TRADE_FIELDS
          from paper_trading_trade_log_repair import repair_trade_log

          legacy = [
              field
              for field in TRADE_FIELDS
              if field != "liquidation_price"
          ]

          old_record = {field: "" for field in legacy}
          old_record.update(
              {
                  "trade_id": "OLD-1",
                  "experiment_group_id": "EVENT-OLD",
                  "portfolio": "MAIN",
                  "is_main": "True",
                  "strategy": "confluence_trend",
                  "asset": "ZEC",
                  "symbol": "ZEC-USDT",
                  "side": "LONG",
                  "timeframe_minutes": "240",
                  "opened_at": "2026-07-12T00:00:00+00:00",
                  "closed_at": "2026-07-12T04:00:00+00:00",
                  "entry_price": "500",
                  "exit_price": "510",
                  "net_pnl_eur": "20",
                  "close_reason": "TARGET",
              }
          )

          new_record = {field: "" for field in TRADE_FIELDS}
          new_record.update(
              {
                  "trade_id": "NEW-1",
                  "experiment_group_id": "EVENT-NEW",
                  "portfolio": "SHADOW_RELATIVE_STRENGTH",
                  "is_main": "False",
                  "strategy": "relative_strength",
                  "asset": "LAB",
                  "symbol": "LAB-USDT",
                  "side": "SHORT",
                  "timeframe_minutes": "60",
                  "opened_at": "2026-07-12T00:00:00+00:00",
                  "closed_at": "2026-07-13T08:00:00+00:00",
                  "entry_price": "0.473335",
                  "exit_price": "0.348444",
                  "liquidation_price": "0.70",
                  "net_pnl_eur": "109.64",
                  "close_reason": "TARGET",
              }
          )

          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp) / "paper_trading_trade_log.csv"
              with path.open("w", encoding="utf-8", newline="") as handle:
                  writer = csv.writer(handle)
                  writer.writerow(legacy)
                  writer.writerow([old_record[field] for field in legacy])
                  writer.writerow(
                      [new_record[field] for field in TRADE_FIELDS]
                  )

              result = repair_trade_log(path, TRADE_FIELDS)
              assert result["rows_after"] == 2, result
              assert result["rows_quarantined"] == 0, result
              assert result["rewritten"] is True, result

              with path.open("r", encoding="utf-8", newline="") as handle:
                  rows = list(csv.DictReader(handle))
              assert len(rows) == 2
              assert rows[0]["trade_id"] == "OLD-1"
              assert rows[0]["liquidation_price"] == ""
              assert rows[1]["trade_id"] == "NEW-1"
              assert rows[1]["liquidation_price"] == "0.70"
              assert rows[1]["net_pnl_eur"] == "109.64"

          print("Test CSV legacy/corrente superato.")
          PY

          python - <<'PY'
          from pathlib import Path

          checks = {
              "paper_trading_engine.py": [
                  "# TRADE_LOG_SCHEMA_GUARD_V1",
              ],
              "paper_trading_runner.py": [
                  "# TRADE_LOG_REPAIR_STARTUP_V1",
                  "reconcile_state_counters",
              ],
              "paper_trading_report.py": [
                  "# TRADE_LOG_RESILIENT_READER_V1",
                  "State fallback prevents a false all-zero or partial",
              ],
              "paper_trading_sample_watch.py": [
                  "# TRADE_LOG_RESILIENT_SAMPLE_READER_V1",
              ],
              "paper_trading_storage.py": [
                  "paper_trading_trade_log_before_repair.csv",
                  "paper_trading_trade_log_quarantine.csv",
                  "paper_trading_trade_log_repair_status.json",
              ],
          }
          for filename, markers in checks.items():
              text = Path(filename).read_text(encoding="utf-8")
              for marker in markers:
                  assert marker in text, (filename, marker)
          print("Self-test installazione completato.")
          PY

      - name: Commit installation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            paper_trading_trade_log_repair.py \
            paper_trading_engine.py \
            paper_trading_runner.py \
            paper_trading_report.py \
            paper_trading_sample_watch.py \
            paper_trading_storage.py

          if git diff --cached --quiet; then
            echo "Riparazione già installata."
          else
            git commit -m \
              "Repair persistent paper trade log schema"
            git push origin HEAD:main
          fi
