name: Manual install three benchmark paper strategies

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-install-three-benchmark-strategies
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Patch benchmark strategy logic and labels
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import base64
          from pathlib import Path

          patch_sets = {'engine': [('ICAgIGVtYTIwID0gZW1hKGNsb3NlLCAyMCkKICAgIGVtYTUwID0gZW1hKGNsb3NlLCA1MCkKICAgIGVtYTIwMCA9IGVtYShjbG9zZSwgMjAwKQogICAgcnNpMTQgPSByc2koY2xvc2UsIDE0KQo=', ''), ('ICAgICAgICAiZW1hMjAwIjogX3NhZmVfbnVtKGVtYTIwMC5pbG9jWy0xXSwgY3VycmVudCksCiAgICAgICAgInJzaTE0IjogX3NhZmVfbnVtKHJzaTE0Lmlsb2NbLTFdLCA1MC4wKSwK', ''), ('ZGVmIHN0cmF0ZWd5X2FjY2VwdHMoCg==', ''), ('', ''), ('ICAgICAgICAgICAgcmVhc29uID0gIjsgIi5qb2luKAogICAgICAgICAgICAgICAgcmVhc29ucwogICAgICAgICAgICAgICAgKyBbZ2xvYmFsX3JlYXNvbiwgZXhjaGFuZ2VfcmVhc29uXQogICAgICAgICAgICApCg==', ''), ('', '')], 'display': [('ICAgICJTSEFET1dfUlNJX1NIT1JUXzVYIjogIlNjYWxwIFJTSSBTaG9ydCBwcnVkZW50ZSA1eCIsCn0K', ''), ('ICAgICJTSEFET1dfUlNJX1NIT1JUXzVYIjogKAogICAgICAgICJWZXJzaW9uZSBwcnVkZW50ZSBzaG9ydCBkZWxsbyBzY2FscCBSU0kgMTVtLCBsZXZhIDV4IGUgcmlzY2hpbyByaWRvdHRvLiIKICAgICksCn0K', ''), ('ICAgICJyc2lfZXh0cmVtZV9yZXZlcnNhbCI6ICJJbnZlcnNpb25lIFJTSSBlc3RyZW1hIDE1bSIsCn0K', '')]}

          for filename, replacements in (
              ("paper_signal_engine.py", patch_sets["engine"]),
              ("paper_trading_display.py", patch_sets["display"]),
          ):
              path = Path(filename)
              source = path.read_text(encoding="utf-8")
              for old_encoded, new_encoded in replacements:
                  old = base64.b64decode(old_encoded).decode("utf-8")
                  new = base64.b64decode(new_encoded).decode("utf-8")
                  if new in source:
                      continue
                  if old not in source:
                      raise SystemExit(
                          f"{filename}: expected patch block not found"
                      )
                  source = source.replace(old, new, 1)
              ast.parse(source, filename=filename)
              path.write_text(source, encoding="utf-8")
          PY

      - name: Add three benchmark portfolios
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("paper_trading_config.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          portfolios = list(config.get("portfolios", []))

          rsi_before = [
              json.dumps(p, sort_keys=True)
              for p in portfolios
              if p.get("strategy") == "rsi_extreme_reversal"
          ]
          if len(rsi_before) != 18:
              raise SystemExit(
                  f"Attesi 18 conti RSI prima della patch, "
                  f"trovati {len(rsi_before)}"
              )

          additions = [
              {
                  "name": "SHADOW_DONCHIAN_1H",
                  "enabled": True,
                  "is_main": False,
                  "strategy": "donchian_breakout",
                  "timeframe_minutes": 60,
                  "minimum_abs_score": 5.0,
                  "atr_stop_multiple": 2.0,
                  "reward_risk": 2.5,
                  "leverage": 2.0,
                  "max_holding_hours": 240,
                  "allow_long": True,
                  "allow_short": True,
                  "trailing_at_r": 1.25,
                  "trailing_atr_multiple": 1.6,
                  "max_open_positions": 3,
                  "max_same_direction_positions": 2
              },
              {
                  "name": "SHADOW_BOLLINGER_MR_1H",
                  "enabled": True,
                  "is_main": False,
                  "strategy": "bollinger_mean_reversion",
                  "timeframe_minutes": 60,
                  "minimum_abs_score": 5.0,
                  "atr_stop_multiple": 1.5,
                  "reward_risk": 1.5,
                  "leverage": 2.0,
                  "max_holding_hours": 72,
                  "allow_long": True,
                  "allow_short": True,
                  "trailing_at_r": 0.9,
                  "trailing_atr_multiple": 1.1,
                  "max_open_positions": 3,
                  "max_same_direction_positions": 2
              },
              {
                  "name": "SHADOW_EMA_TREND_1H",
                  "enabled": True,
                  "is_main": False,
                  "strategy": "ema_trend_following",
                  "timeframe_minutes": 60,
                  "minimum_abs_score": 5.0,
                  "atr_stop_multiple": 2.0,
                  "reward_risk": 2.2,
                  "leverage": 2.0,
                  "max_holding_hours": 168,
                  "allow_long": True,
                  "allow_short": True,
                  "trailing_at_r": 1.1,
                  "trailing_atr_multiple": 1.5,
                  "max_open_positions": 3,
                  "max_same_direction_positions": 2
              }
          ]

          by_name = {
              str(portfolio.get("name", "")): portfolio
              for portfolio in portfolios
          }
          original_order = [
              str(portfolio.get("name", ""))
              for portfolio in portfolios
              if str(portfolio.get("name", ""))
          ]

          for addition in additions:
              by_name[addition["name"]] = addition

          ordered = [by_name[name] for name in original_order]
          for addition in additions:
              if addition["name"] not in original_order:
                  ordered.append(addition)

          rsi_after = [
              json.dumps(p, sort_keys=True)
              for p in ordered
              if p.get("strategy") == "rsi_extreme_reversal"
          ]
          if rsi_after != rsi_before:
              raise SystemExit(
                  "I 18 conti RSI sono stati modificati: commit bloccato."
              )

          config["portfolios"] = ordered
          enabled = [p for p in ordered if p.get("enabled", True)]

          if len(enabled) != 26:
              raise SystemExit(
                  f"Attesi 26 conti attivi, trovati {len(enabled)}"
              )
          if len({p["name"] for p in enabled}) != 26:
              raise SystemExit("Nomi di conto duplicati.")

          path.write_text(
              json.dumps(config, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("PASS: 23 conti esistenti + 3 benchmark = 26")
          PY

      - name: Validate benchmark installation
        shell: bash
        run: |
          python -m pip install numpy pandas requests
          python -m py_compile             paper_signal_engine.py             paper_trading_display.py             paper_trading_engine.py             paper_trading_report.py

          python - <<'PY'
          import json
          from pathlib import Path

          import pandas as pd

          from paper_signal_engine import (
              benchmark_strategy_score,
              compute_features,
          )
          from paper_trading_display import (
              portfolio_description,
              portfolio_label,
              strategy_label,
          )

          config = json.loads(
              Path("paper_trading_config.json").read_text(
                  encoding="utf-8"
              )
          )
          enabled = [
              p for p in config["portfolios"]
              if p.get("enabled", True)
          ]
          names = {p["name"] for p in enabled}
          required = {
              "SHADOW_DONCHIAN_1H",
              "SHADOW_BOLLINGER_MR_1H",
              "SHADOW_EMA_TREND_1H",
          }

          assert len(enabled) == 26
          assert len(names) == 26
          assert required.issubset(names)
          assert sum(
              p.get("strategy") == "rsi_extreme_reversal"
              for p in enabled
          ) == 18

          # Confirm the RSI signal branch still uses its original overlays.
          source = Path("paper_signal_engine.py").read_text(
              encoding="utf-8"
          )
          rsi_marker = '"RSI_EXTREME_REVERSAL"'
          rsi_pos = source.index(rsi_marker)
          rsi_tail = source[rsi_pos:rsi_pos + 1200]
          assert "signal_global_overlay" not in rsi_tail
          assert "global_overlay=round(" in rsi_tail

          # Minimal feature/strategy smoke test.
          index = pd.date_range(
              "2026-01-01",
              periods=240,
              freq="h",
              tz="UTC",
          )
          close = pd.Series(
              [100.0 + i * 0.2 for i in range(240)],
              index=index,
          )
          frame = pd.DataFrame({
              "open": close.shift(1).fillna(close.iloc[0]),
              "high": close * 1.002,
              "low": close * 0.998,
              "close": close,
              "volume": 1000.0,
          })
          features = compute_features(frame, frame)
          assert "bollinger_upper" in features
          assert "bollinger_lower" in features
          assert "bollinger_zscore" in features

          for strategy in (
              "donchian_breakout",
              "bollinger_mean_reversion",
              "ema_trend_following",
          ):
              accepted, score, reasons = benchmark_strategy_score(
                  strategy,
                  features,
              )
              assert isinstance(accepted, bool)
              assert isinstance(score, float)
              assert isinstance(reasons, list)
              assert " " in strategy_label(strategy)

          for name in sorted(required):
              assert "Benchmark" in portfolio_label(name)
              assert "Benchmark puro" in portfolio_description(name)
              print(portfolio_label(name))

          print("PASS: benchmark logic isolated; RSI accounts unchanged")
          PY

          git diff --check

      - name: Commit benchmark strategies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             paper_signal_engine.py             paper_trading_config.json             paper_trading_display.py

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Benchmark strategies already installed."
          else
            git commit -m "Add three benchmark paper strategies"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
