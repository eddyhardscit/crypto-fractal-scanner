name: SOL Spot Adaptive Final

on:
  workflow_dispatch:
    inputs:
      force_telegram:
        description: "Invia il messaggio Telegram anche se lo stato SOL non è cambiato"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: sol-spot-adaptive-final
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests
          fi

      - name: Validate autonomous files
        run: |
          set -euxo pipefail
          test -f sol_spot_adaptive.py
          test -f sol_spot_adaptive_integration.py
          test -f sol_spot_telegram_notify.py
          python -m py_compile \
            sol_spot_adaptive.py \
            sol_spot_adaptive_integration.py \
            sol_spot_telegram_notify.py

      - name: Run SOL Spot Adaptive
        run: |
          set -euxo pipefail
          PYTHONUNBUFFERED=1 python -u sol_spot_adaptive_integration.py

      - name: Validate generated report
        run: |
          set -euxo pipefail
          test -f reports/sol_spot_adaptive_report.md
          test -f reports/sol_spot_adaptive_state.json
          test -f reports/latest_report.md
          grep -q "SOL_SPOT_ADAPTIVE_START" reports/latest_report.md
          grep -qF 'Capitale iniziale separato: **€40.000,00**' reports/latest_report.md
          grep -qF 'Asset: **SOL spot**' reports/latest_report.md
          grep -qF 'Leva: **nessuna (1x)**' reports/latest_report.md

      - name: Send SOL Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && inputs.force_telegram || false }}
        run: |
          set -euxo pipefail
          if [ "$FORCE_TELEGRAM" = "true" ]; then
            python -u sol_spot_telegram_notify.py --force
          else
            python -u sol_spot_telegram_notify.py
          fi

      - name: Commit SOL state and reports
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git add --force reports/sol_spot_adaptive_state.json
          git add reports/sol_spot_adaptive_report.md
          git add reports/latest_report.md

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update SOL spot adaptive paper report"
            git push
          fi
