name: Apply Separate Account Summary Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-paper-trading.txt

      - name: Add separate numbered account summary
        run: |
          echo '' | base64 -d > /tmp/patch_account_summary.py
          python /tmp/patch_account_summary.py

      - name: Compile notification module
        run: |
          python -m py_compile paper_trading_notify.py

      - name: Run offline Telegram summary self-test
        run: |
          python - <<'PY'
          import paper_trading_notify as notify
          import paper_trading_report as report

          fake_metrics = [
              {
                  "portfolio": "MAIN",
                  "is_main": True,
                  "equity_eur": 10000.0,
                  "open_positions": 0,
                  "open_margin_eur": 0.0,
                  "open_notional_eur": 0.0,
                  "open_stop_risk_eur": 0.0,
                  "unrealized_pnl_eur": 0.0,
                  "net_pnl_closed_eur": 0.0,
              },
              {
                  "portfolio": "SHADOW_1H_BALANCED",
                  "is_main": False,
                  "equity_eur": 10041.0,
                  "open_positions": 2,
                  "open_margin_eur": 700.0,
                  "open_notional_eur": 2100.0,
                  "open_stop_risk_eur": 100.0,
                  "unrealized_pnl_eur": 11.0,
                  "net_pnl_closed_eur": 30.0,
              },
              {
                  "portfolio": "SHADOW_1H_FAST",
                  "is_main": False,
                  "equity_eur": 9980.0,
                  "open_positions": 1,
                  "open_margin_eur": 100.0,
                  "open_notional_eur": 300.0,
                  "open_stop_risk_eur": 20.0,
                  "unrealized_pnl_eur": -5.0,
                  "net_pnl_closed_eur": -15.0,
              },
          ]
          report.portfolio_metrics = (
              lambda state, config: fake_metrics
          )

          config = {
              "initial_capital_eur": 10000.0,
              "portfolios": [
                  {"name": "MAIN", "enabled": True},
                  {
                      "name": "SHADOW_1H_BALANCED",
                      "enabled": True,
                  },
                  {
                      "name": "SHADOW_1H_FAST",
                      "enabled": True,
                  },
              ],
          }
          state = {
              "initial_capital_eur": 10000.0,
              "portfolios": {},
          }
          summary = {
              "opened": [
                  {
                      "portfolio": "SHADOW_1H_BALANCED",
                      "asset": "DOGE",
                      "side": "LONG",
                      "entry_price": 0.0728,
                      "margin_eur": 50.0,
                      "notional_eur": 750.0,
                  }
              ],
              "closed": [
                  {
                      "portfolio": "SHADOW_1H_FAST",
                      "asset": "ZEC",
                      "side": "LONG",
                      "entry_price": 500.0,
                      "exit_price": 530.0,
                      "margin_eur": 100.0,
                      "net_pnl_eur": 20.0,
                  }
              ],
          }

          rendered = notify.build_status_message(
              state,
              config,
              summary,
          )
          assert "Conto 1 — Principale 4H" in rendered
          assert "Conto 2 — Bilanciata 1H" in rendered
          assert "Conto 3 — Rapida 1H" in rendered
          assert "Entrate: 1" in rendered
          assert "Uscite: 1" in rendered
          assert "entry 0.0728" in rendered
          assert "500→530" in rendered
          assert "Impiegato €700,00" in rendered
          assert "totale +€41,00" in rendered
          assert "totale -€20,00" in rendered

          print(rendered)
          print("Separate account summary self-test: OK")
          PY

      - name: Commit separate account summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add paper_trading_notify.py

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m \
              "Add separate numbered paper account summary"
            git push
          fi
