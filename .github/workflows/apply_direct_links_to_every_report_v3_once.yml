name: Apply Direct Links To Every Report V3 Once

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install direct report links V3
        env:
          DIRECT_REPORT_LINKS_V3_PATCH_B64: ""
        run: |
          python -c 'import base64, os; exec(compile(base64.b64decode(os.environ["DIRECT_REPORT_LINKS_V3_PATCH_B64"]), "<direct-report-links-v3>", "exec"))'

      - name: Validate persistent report links
        run: |
          set -euxo pipefail

          python -m py_compile \
            report_direct_links.py \
            paper_trading_report.py

          python - <<'PY'
          from pathlib import Path

          from report_direct_links import process

          links = Path(
              "report_direct_links.py"
          ).read_text(encoding="utf-8")
          paper = Path(
              "paper_trading_report.py"
          ).read_text(encoding="utf-8")
          latest = Path(
              "reports/latest_report.md"
          ).read_text(encoding="utf-8")

          preview, audit = process(latest)

          assert "def update_latest_report_links()" in links
          assert (
              "from report_direct_links import "
              "update_latest_report_links"
          ) in paper
          assert "link_audit = update_latest_report_links()" in paper
          assert "Report separato completo:" in preview
          assert audit["added"] >= 0
          assert ".github/workflows/daily.yml" not in paper
          print(
              "Direct report links V3 validated without "
              "modifying latest_report.md."
          )
          PY

      - name: Commit direct report links V3
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com

          # Do not commit latest_report.md here: it is frequently updated
          # by other workflows and caused the previous race.
          git add \
            report_direct_links.py \
            paper_trading_report.py

          if git diff --cached --quiet; then
            echo "Direct report links V3 already installed."
            exit 0
          fi

          git commit -m \
            "Add persistent direct links to report sections"

          # Another scheduled workflow can update main at any moment.
          # Fetch, rebase and retry instead of failing on a ref-lock race.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push completed."
              exit 0
            fi

            sleep $((attempt * 4))
          done

          echo "Push failed after 5 attempts."
          exit 1
