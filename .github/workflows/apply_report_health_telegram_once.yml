name: Install Report Health Telegram

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests pyyaml

      - name: Install report health audit
        shell: bash
        run: |
          echo '' | base64 --decode > report_health_audit.py
          echo '' | base64 --decode > report_health_config.json
          echo '' | base64 --decode > /tmp/patch_report_health.py
          python /tmp/patch_report_health.py

      - name: Validate installation
        shell: bash
        run: |
          python -m py_compile report_health_audit.py
          python report_health_audit.py --self-test

          python - <<'PY'
          from pathlib import Path
          import json
          import yaml

          daily = Path(".github/workflows/daily.yml").read_text(
              encoding="utf-8"
          )
          assert daily.count(
              "Audit report health and notify Telegram"
          ) == 1
          assert "python report_health_audit.py" in daily
          assert "TELEGRAM_BOT_TOKEN" in daily
          assert "TELEGRAM_CHAT_ID" in daily
          assert yaml.safe_load(daily)

          config = json.loads(
              Path("report_health_config.json").read_text(
                  encoding="utf-8"
              )
          )
          assert len(config["critical_reports"]) == 6
          assert len(config["watch_checks"]) == 2
          print("Installazione validata.")
          PY

      - name: Commit installation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             report_health_audit.py             report_health_config.json             .github/workflows/daily.yml

          if git diff --cached --quiet; then
            echo "Controllo report già installato."
          else
            git commit -m "Add Telegram report health audit"
            git push origin HEAD:main
          fi
