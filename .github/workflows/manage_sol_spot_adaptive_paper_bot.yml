name: Manage SOL Spot Adaptive Range paper bot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply_sol_spot_adaptive_once*.yml
      - .github/workflows/manage_sol_spot_adaptive*.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manage-sol-spot-adaptive-paper-bot
  cancel-in-progress: false

jobs:
  install-or-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install numpy pandas requests PyYAML

