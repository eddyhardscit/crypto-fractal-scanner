              gitignore_path.read_text(encoding="utf-8")
              if gitignore_path.exists()
              else ""
          )
          marker = "# SOL Spot Adaptive Range paper state"
          block = '# SOL Spot Adaptive Range paper state (dedicated GitHub Release asset)\n/reports/sol_spot_adaptive_state.json\n/reports/sol_spot_adaptive_trades.csv\n/reports/sol_spot_adaptive_equity.csv\n/reports/sol_spot_adaptive_latest.json\n/reports/sol_spot_adaptive_config_snapshot.json\n/reports/sol_spot_adaptive_storage_status.json\n'
