              separator = "" if not existing or existing.endswith("\n") else "\n"
              gitignore_path.write_text(
                  existing + separator + "\n" + block,
                  encoding="utf-8",
              )
          PY

      - name: Validate programs and strategy
        run: |
          test -f sol_spot_adaptive_config.json
          test -f sol_spot_adaptive_bot.py
          test -f sol_spot_adaptive_storage.py
          test -f .github/workflows/sol_spot_adaptive_paper.yml
          test -f reports/sol_spot_adaptive_installation_status.md

          python -m py_compile             sol_spot_adaptive_bot.py             sol_spot_adaptive_storage.py

          python sol_spot_adaptive_bot.py             --config sol_spot_adaptive_config.json             --self-test

      - name: Validate paper-only safety and Telegram isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          config = json.loads(
              Path("sol_spot_adaptive_config.json").read_text(encoding="utf-8")
          )
          required = {
              "mode": "PAPER_ONLY",
              "asset": "SOL",
              "symbol": "SOL-USDT",
              "initial_capital_eur": 40000.0,
              "public_data_only": True,
              "real_orders_enabled": False,
              "allow_short": False,
              "leverage": 1.0,
          }
          for key, expected in required.items():
              actual = config.get(key)
              if actual != expected:
                  raise SystemExit(
                      f"Unsafe configuration: {key}={actual!r}, "
                      f"expected {expected!r}"
                  )

          source = Path("sol_spot_adaptive_bot.py").read_text(encoding="utf-8")
          forbidden = (
              "/api/v1/orders",
              "/api/v1/order",
              "/api/v1/hf/orders",
              "KUCOIN_API_SECRET",
              "KUCOIN_API_KEY",
              "KUCOIN_API_PASSPHRASE",
              "KC-API-KEY",
              "KC-API-SIGN",
              "KC-API-PASSPHRASE",
          )
          found = [token for token in forbidden if token in source]
          if found:
              raise SystemExit(f"Exchange-order capability found: {found}")

          post_count = source.count("requests.post(")
          if post_count != 1:
              raise SystemExit(
                  "Exactly one POST call is allowed for Telegram; "
                  f"found {post_count}."
              )
          if (
              "https://api.telegram.org/bot" not in source
              or "/sendMessage" not in source
          ):
              raise SystemExit("The permitted POST is not Telegram sendMessage.")

          for method in ("requests.put(", "requests.patch(", "requests.delete("):
              if method in source:
                  raise SystemExit(
                      f"Unexpected write-capable HTTP method: {method}"
                  )

          workflow_path = Path(
              ".github/workflows/sol_spot_adaptive_paper.yml"
          )
          workflow_text = workflow_path.read_text(encoding="utf-8")
          workflow = yaml.safe_load(workflow_text)
          if not isinstance(workflow, dict) or "jobs" not in workflow:
              raise SystemExit("Permanent SOL workflow is not valid YAML.")

          required_tokens = (
              "SOL_SPOT_ADAPTIVE_RELEASE_TAG",
              "sol-spot-adaptive-v1",
              "sol-spot-adaptive-paper-state",
              "TELEGRAM_BOT_TOKEN",
              "TELEGRAM_CHAT_ID",
          )
          missing = [
              token for token in required_tokens
              if token not in workflow_text
          ]
          if missing:
              raise SystemExit(
                  f"Permanent workflow missing isolation: {missing}"
              )

          forbidden_workflow_tokens = (
              "PAPER_TRADING_RELEASE_TAG",
              "paper-trading-persistent-state",
              "KUCOIN_API_KEY",
              "KUCOIN_API_SECRET",
              "KUCOIN_API_PASSPHRASE",
          )
          found = [
              token for token in forbidden_workflow_tokens
              if token in workflow_text
          ]
          if found:
              raise SystemExit(
                  f"Permanent workflow shares unsafe state: {found}"
              )
          PY

          git diff --check

      - name: Commit installation or update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             sol_spot_adaptive_config.json             sol_spot_adaptive_bot.py             sol_spot_adaptive_storage.py             .gitignore             .github/workflows/sol_spot_adaptive_paper.yml             reports/sol_spot_adaptive_installation_status.md

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "SOL Spot Adaptive Range is already fully installed."
          else
            git commit -m "Install or update SOL spot adaptive paper bot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
