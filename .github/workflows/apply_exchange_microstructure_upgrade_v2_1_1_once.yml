name: Apply Exchange Microstructure Upgrade V2.1.1 Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exchange dependencies
        run: python -m pip install -r requirements-exchange.txt

      - name: Validate v2.1.1 package files
        run: |
          test -f exchange_market_data.py
          test -f exchange_microstructure_report.py
          test -f exchange_signal_tracker.py
          test -f exchange_persistent_storage.py
          test -f exchange_external_collector.py
          test -f exchange_fallback_guard.py
          test -f exchange_intraday_workflow.yml
          test -f requirements-exchange-collector.txt

      - name: Run offline v2.1.1 self-test
        run: python exchange_microstructure_selftest.py

      - name: Apply corrective source patches
        run: python apply_exchange_microstructure_upgrade_v2_1_1.py

      - name: Compile upgraded Python files
        run: |
          python -m py_compile \
            exchange_market_data.py \
            exchange_persistent_storage.py \
            exchange_microstructure_report.py \
            exchange_signal_tracker.py \
            exchange_external_collector.py \
            exchange_fallback_guard.py \
            exchange_microstructure_selftest.py \
            module_signal_tracker.py \
            data_quality_coherence_report.py

      - name: Validate prepared daily workflow order
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/daily.yml').read_text(encoding='utf-8')
          first_report = text.find('python exchange_microstructure_report.py')
          tracker = text.find('python exchange_signal_tracker.py')
          second_report = text.find('python exchange_microstructure_report.py', first_report + 1)
          global_pos = text.find('python global_confluence_report.py')
          order = [
              text.find('python exchange_persistent_storage.py restore'),
              text.find('python exchange_persistent_storage.py audit'),
              text.find('python exchange_persistent_storage.py archive-completed-months'),
              first_report,
              tracker,
              second_report,
              global_pos,
          ]
          if min(order) < 0 or order != sorted(order):
              raise SystemExit(f'Ordine daily v2.1.1 errato: {order}')
          if 'python exchange_market_data.py' in text:
              raise SystemExit('Il daily non deve raccogliere dati intraday.')
          print('Ordine daily exchange v2.1.1: OK')
          PY

      - name: Commit source corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            exchange_market_data.py \
            exchange_microstructure_report.py \
            exchange_signal_tracker.py \
            exchange_external_collector.py \
            exchange_fallback_guard.py \
            exchange_microstructure_selftest.py \
            module_signal_tracker.py \
            data_quality_coherence_report.py
          if git diff --cached --quiet; then
            echo "Source corrections already installed."
          else
            git commit -m "Fix exchange collector diagnostics and geo handling v2.1.1"
            git push
          fi

      - name: Prepare workflow artifacts
        run: |
          mkdir -p prepared_exchange_workflows
          cp .github/workflows/daily.yml prepared_exchange_workflows/daily.yml
          cp exchange_intraday_workflow.yml prepared_exchange_workflows/exchange_intraday.yml
          cp exchange_external_self_hosted_workflow.yml prepared_exchange_workflows/exchange_external_self_hosted.yml

      - name: Upload prepared workflows
        uses: actions/upload-artifact@v4
        with:
          name: exchange-v2-1-1-workflows-ready
          path: prepared_exchange_workflows/
          retention-days: 7
