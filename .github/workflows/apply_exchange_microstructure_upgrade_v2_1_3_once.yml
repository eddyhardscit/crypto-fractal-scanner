name: Apply Exchange Microstructure Upgrade V2.1.3 Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-exchange.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-exchange.txt

      - name: Apply and test V2.1.3
        run: python apply_exchange_microstructure_upgrade_v2_1_3.py

      - name: Upload ready workflow and status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exchange-v2-1-3-ready
          path: |
            .github/workflows/exchange_intraday.yml
            reports/exchange_v2_1_3_installation_status.md
          if-no-files-found: error
          retention-days: 14

      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            alternative_exchange_sources.py \
            exchange_market_data.py \
            exchange_microstructure_report.py \
            exchange_signal_tracker.py \
            exchange_persistent_storage.py \
            exchange_microstructure_selftest.py \
            requirements-exchange.txt \
            requirements-exchange-collector.txt \
            exchange_intraday_workflow.yml \
            .github/workflows/exchange_intraday.yml \
            reports/exchange_v2_1_3_installation_status.md
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
          else
            git commit -m "Upgrade exchange microstructure to v2.1.3"
            git push
          fi
