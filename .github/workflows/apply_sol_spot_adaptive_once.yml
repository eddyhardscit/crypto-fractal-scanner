name: Apply SOL spot adaptive improvements once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SOL spot adaptive module
        run: |
          test -f sol_spot_adaptive.py || cp installer/sol_spot_adaptive.py sol_spot_adaptive.py
          python -m py_compile sol_spot_adaptive.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sol_spot_adaptive.py
          git diff --cached --quiet || (git commit -m 'Install SOL spot adaptive paper portfolio' && git push)
