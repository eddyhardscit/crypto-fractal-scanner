name: Apply Direct Links To Every Report Once

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install direct report links
        env:
          DIRECT_REPORT_LINKS_PATCH_B64: ""
        run: |
          python -c 'import base64, os; exec(compile(base64.b64decode(os.environ["DIRECT_REPORT_LINKS_PATCH_B64"]), "<direct-report-links>", "exec"))'

      - name: Validate and update current report
        run: |
          set -euxo pipefail
          python -m py_compile report_direct_links.py
          python report_direct_links.py
          python report_direct_links.py --check

          python - <<'PY'
          from pathlib import Path

          daily = Path(
              ".github/workflows/daily.yml"
          ).read_text(encoding="utf-8")
          script = Path(
              "report_direct_links.py"
          ).read_text(encoding="utf-8")
          latest = Path(
              "reports/latest_report.md"
          ).read_text(encoding="utf-8")

          assert (
              "Add direct links to standalone reports"
              in daily
          )
          assert "report_direct_links.py --check" in daily
          assert "DIRECT_REPORT_LINK" in script
          assert (
              "Report separato completo:"
              in latest
          )
          print(
              "Direct report links validated."
          )
          PY

      - name: Commit direct report links
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email             41898282+github-actions[bot]@users.noreply.github.com

          git add             report_direct_links.py             .github/workflows/daily.yml             reports/latest_report.md

          if git diff --cached --quiet; then
            echo "Direct report links already installed."
            exit 0
          fi

          git commit -m             "Add direct links to standalone report sections"
          git pull --rebase origin main
          git push origin HEAD:main
