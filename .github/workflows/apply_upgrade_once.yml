name: Apply Scanner Upgrade Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-upgrade:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply non-workflow upgrades
        run: |
          python apply_global_confluence_upgrade.py
          python apply_classic_risk_label_upgrade.py
          python -m py_compile             scanner.py             market_snapshot.py             scanner_signal_reader.py             data_quality_coherence_report.py             global_confluence_report.py             classic_technical_confirmation_report.py

      - name: Commit upgraded files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add scanner.py market_snapshot.py scanner_signal_reader.py data_quality_coherence_report.py
          git add global_confluence_report.py classic_technical_confirmation_report.py
          git add apply_all_upgrades.py apply_global_confluence_upgrade.py apply_classic_risk_label_upgrade.py apply_daily_workflow_upgrade.py
          git commit -m "Upgrade scanner data pipeline and coherence checks" || echo "No changes to commit"
          git push
