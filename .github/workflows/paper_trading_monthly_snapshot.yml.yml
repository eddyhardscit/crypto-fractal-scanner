name: Paper Trading Monthly Snapshot

on:
  schedule:
    - cron: "15 6 1 * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trading-monthly-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      GITHUB_TOKEN: ${{ github.token }}
      PAPER_TRADING_RELEASE_TAG: paper-trading-v1
      PAPER_TRADING_ASSET_NAME: paper-trading-state.zip
      SOL_SPOT_ADAPTIVE_RELEASE_TAG: sol-spot-adaptive-v1
      SOL_SPOT_ADAPTIVE_ASSET_NAME: sol-spot-adaptive-state.zip

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Restore paper-trading state and ledgers
        run: python paper_trading_storage.py restore

      - name: Restore SOL Spot state and ledger
        run: python sol_spot_adaptive_storage.py restore

      - name: Validate snapshot generator
        run: python -m py_compile paper_trading_monthly_snapshot.py

      - name: Create monthly snapshot
        run: python paper_trading_monthly_snapshot.py

      - name: Validate JSON snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(
              Path("reports/paper_trading_monthly_snapshots")
              .glob("snapshot_*.json")
          )
          if not files:
              raise SystemExit("No monthly snapshot generated.")

          latest = files[-1]
          payload = json.loads(
              latest.read_text(encoding="utf-8")
          )
          required = {
              "snapshot_month",
              "generated_utc",
              "repository",
              "paper_trading",
              "sol_spot_adaptive",
              "integrity",
          }
          missing = sorted(required - set(payload))
          if missing:
              raise SystemExit(
                  f"Snapshot missing fields: {missing}"
              )

          count = int(
              payload["paper_trading"]["summary"]
              ["portfolio_count"]
          )
          if count < 30:
              raise SystemExit(
                  f"Expected at least 30 paper portfolios, got {count}"
              )

          print(f"PASS: {latest} with {count} portfolios")
          PY

          git diff --check

      - name: Commit monthly snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/paper_trading_monthly_snapshots/
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Monthly snapshot unchanged."
          else
            git commit -m "Add monthly paper trading snapshot"

            # Restore/storage steps can modify tracked reports and create
            # untracked runtime files. They are not part of the snapshot
            # commit and must not block the rebase.
            git status --short
            git stash push \
              --include-untracked \
              -m "monthly-snapshot-runtime-files" \
              || true

            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: monthly-paper-snapshot-${{ github.run_id }}
          path: reports/paper_trading_monthly_snapshots/snapshot_*.json
          if-no-files-found: error
          retention-days: 90
