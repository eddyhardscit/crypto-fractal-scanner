name: Apply Research All Signals Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-paper-trading.txt
      - name: Create research tracker
        run: echo '' | base64 -d > research_all_signals.py
      - name: Patch runner
        run: |
          echo '' | base64 -d > /tmp/patch_runner.py
          python /tmp/patch_runner.py
      - name: Patch persistent storage
        run: |
          echo '' | base64 -d > /tmp/patch_storage.py
          python /tmp/patch_storage.py
      - name: Compile
        run: python -m py_compile research_all_signals.py paper_trading_runner.py paper_trading_storage.py
      - name: Self-test
        run: |
          python - <<'PYTEST'
          from types import SimpleNamespace
          import research_all_signals as r
          r.STATE_PATH = r.REPORTS_DIR / "_test_state.json"
          r.TRADES_PATH = r.REPORTS_DIR / "_test_trades.csv"
          r.REPORT_PATH = r.REPORTS_DIR / "_test_report.md"
          r.LATEST_PATH = r.REPORTS_DIR / "_test_latest.json"
          for p in [r.STATE_PATH, r.TRADES_PATH, r.REPORT_PATH, r.LATEST_PATH]: p.unlink(missing_ok=True)
          s = SimpleNamespace(portfolio="SHADOW_1H_BALANCED", experiment_group_id="evt1", strategy="confluence_trend", asset="DOGE", side="LONG", timeframe_minutes=60, candle_time="2026-07-12T10:00:00+00:00", entry_reference_price=100.0, stop_pct=0.02, target_pct=0.04, max_holding_hours=24, score=7.0, confidence="ALTA")
          bundle = {"assets": {"DOGE": {"mark_price": 104.0, "candles": {"60": [
              {"time": 1783850400000, "open": 100, "high": 101, "low": 99, "close": 100, "volume": 1000},
              {"time": 1783854000000, "open": 100, "high": 105, "low": 99.5, "close": 104, "volume": 1000}
          ]}}}}
          first = r.run_research_cycle([s], bundle, {})
          assert first["opened_this_cycle"] == 1
          second = r.run_research_cycle([], bundle, {})
          assert second["closed_this_cycle"] == 1
          assert "Research All Signals" in second["report_markdown"]
          print("Research All Signals self-test: OK")
          PYTEST
      - name: Clean test files
        run: rm -f reports/_test_*
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_all_signals.py paper_trading_runner.py paper_trading_storage.py
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m "Add all-signals research ledger"
            git push
          fi
