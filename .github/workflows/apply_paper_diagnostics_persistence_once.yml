name: Apply Paper Diagnostics Persistence Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Add diagnostics to persistent archive
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("paper_trading_storage.py")
          text = path.read_text(encoding="utf-8")

          filename = '    "paper_trading_signal_diagnostics.json",\n'
          marker = '    "paper_trading_market_cache.json",\n'

          if filename in text:
              print("Diagnostics persistence already installed.")
          else:
              if marker not in text:
                  raise SystemExit(
                      "Anchor paper_trading_market_cache.json not found."
                  )
              text = text.replace(marker, marker + filename, 1)
              path.write_text(text, encoding="utf-8")
              print(
                  "Added paper_trading_signal_diagnostics.json "
                  "to the persistent archive."
              )
          PY

      - name: Validate storage fix
        run: |
          set -euxo pipefail
          python -m py_compile paper_trading_storage.py
          grep -q 'paper_trading_signal_diagnostics.json'             paper_trading_storage.py

      - name: Commit storage fix
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email             41898282+github-actions[bot]@users.noreply.github.com

          git add paper_trading_storage.py

          if git diff --cached --quiet; then
            echo "Diagnostics persistence already committed."
          else
            git commit -m               "Persist paper trading signal diagnostics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
