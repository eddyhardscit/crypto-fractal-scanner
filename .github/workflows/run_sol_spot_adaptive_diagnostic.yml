name: SOL Spot Adaptive Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sol-spot-adaptive-diagnostic
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Show checked-out revision
        run: |
          set -euxo pipefail
          echo "PWD=$(pwd)"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --date=iso --pretty=fuller
          git status --short
          sha256sum sol_spot_adaptive.py
          sha256sum sol_spot_adaptive_integration.py
          echo "----- integration.py first 20 lines -----"
          sed -n '1,20p' sol_spot_adaptive_integration.py
          echo "----- integration.py last 30 lines -----"
          tail -n 30 sol_spot_adaptive_integration.py
          echo "----- workflows referring to SOL -----"
          grep -RIl "SOL Spot Adaptive" .github/workflows || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests
          fi

      - name: Validate Python imports
        run: |
          set -euxo pipefail
          test -f sol_spot_adaptive.py
          test -f sol_spot_adaptive_integration.py
          python -m py_compile sol_spot_adaptive.py sol_spot_adaptive_integration.py
          python - <<'PY'
          import sol_spot_adaptive
          import sol_spot_adaptive_integration
          print("sol_spot_adaptive:", sol_spot_adaptive.__file__)
          print("integration:", sol_spot_adaptive_integration.__file__)
          print("has run:", callable(getattr(sol_spot_adaptive_integration, "run", None)))
          PY

      - name: Show reports before run
        run: |
          set -euxo pipefail
          mkdir -p reports
          find reports -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true

      - name: Run SOL Spot Adaptive with diagnostics
        run: |
          set -euxo pipefail
          PYTHONUNBUFFERED=1 python -u sol_spot_adaptive_integration.py
          echo "Python exit code: $?"
          echo "----- reports after Python -----"
          find reports -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          echo "----- expected file checks -----"
          ls -la reports
          stat reports/sol_spot_adaptive_report.md
          stat reports/sol_spot_adaptive_state.json
          stat reports/latest_report.md

      - name: Validate generated report verbosely
        run: |
          set -euxo pipefail
          grep -n "SOL_SPOT_ADAPTIVE_START" reports/latest_report.md
          grep -nF 'Capitale iniziale separato: **€40.000,00**' reports/latest_report.md
          grep -nF 'Asset: **SOL spot**' reports/latest_report.md
          grep -nF 'Leva: **nessuna (1x)**' reports/latest_report.md
          sed -n '/SOL_SPOT_ADAPTIVE_START/,/SOL_SPOT_ADAPTIVE_END/p' reports/latest_report.md

      - name: Commit SOL paper state and report
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            reports/sol_spot_adaptive_state.json \
            reports/sol_spot_adaptive_report.md \
            reports/latest_report.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update SOL spot adaptive paper report"
            git push
          fi
