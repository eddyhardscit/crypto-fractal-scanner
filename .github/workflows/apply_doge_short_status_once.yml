name: Install DOGE Short Status Message

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install status notifier
        shell: bash
        run: |
          echo '' | base64 --decode > doge_short_status_notify.py

          python - <<'PY'
          import json
          from pathlib import Path

          runner_path = Path("paper_trading_runner.py")
          storage_path = Path("paper_trading_storage.py")
          config_path = Path("doge_rejection_short_config.json")

          if not runner_path.exists():
              raise SystemExit("paper_trading_runner.py non trovato")
          if not storage_path.exists():
              raise SystemExit("paper_trading_storage.py non trovato")
          if not config_path.exists():
              raise SystemExit(
                  "doge_rejection_short_config.json non trovato: "
                  "installare prima la strategia DOGE"
              )

          runner = runner_path.read_text(encoding="utf-8")
          import_line = (
              "from doge_short_status_notify "
              "import send_doge_short_status\n"
          )
          if import_line not in runner:
              anchor = (
                  "from doge_rejection_short "
                  "import run_doge_rejection_cycle\n"
              )
              if anchor not in runner:
                  raise SystemExit("Anchor import DOGE non trovato")
              runner = runner.replace(
                  anchor,
                  anchor + import_line,
                  1,
              )

          marker = "# DOGE_SHORT_STATUS_TELEGRAM_START"
          if marker not in runner:
              anchor = "    # DOGE_REJECTION_SHORT_CYCLE_END\n"
              if anchor not in runner:
                  raise SystemExit("Anchor ciclo DOGE non trovato")
              block = """    # DOGE_SHORT_STATUS_TELEGRAM_START
              try:
                  doge_status_result = send_doge_short_status(bundle)
              except Exception as exc:
                  doge_status_result = {
                      "configured": True,
                      "sent": False,
                      "error": str(exc),
                  }
                  print(f"Stato Telegram DOGE non inviato: {exc}")
              # DOGE_SHORT_STATUS_TELEGRAM_END

          """
              runner = runner.replace(
                  anchor,
                  anchor + block,
                  1,
              )
          runner_path.write_text(runner, encoding="utf-8")

          storage = storage_path.read_text(encoding="utf-8")
          status_file = '    "doge_rejection_short_status_state.json",\n'
          if status_file not in storage:
              anchor = '    "doge_rejection_short_latest.json",\n'
              if anchor not in storage:
                  raise SystemExit("Anchor storage DOGE non trovato")
              storage = storage.replace(
                  anchor,
                  anchor + status_file,
                  1,
              )
          storage_path.write_text(storage, encoding="utf-8")

          config = json.loads(
              config_path.read_text(encoding="utf-8")
          )
          config["telegram_status_interval_hours"] = 4.0
          config["telegram_status_on_manual"] = True
          config_path.write_text(
              json.dumps(
                  config,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate installation
        shell: bash
        run: |
          python -m py_compile             doge_short_status_notify.py             paper_trading_runner.py             paper_trading_storage.py

          python - <<'PY'
          import json
          from pathlib import Path

          runner = Path("paper_trading_runner.py").read_text(
              encoding="utf-8"
          )
          storage = Path("paper_trading_storage.py").read_text(
              encoding="utf-8"
          )
          config = json.loads(
              Path("doge_rejection_short_config.json").read_text(
                  encoding="utf-8"
              )
          )

          assert "send_doge_short_status" in runner
          assert "# DOGE_SHORT_STATUS_TELEGRAM_START" in runner
          assert "doge_rejection_short_status_state.json" in storage
          assert float(
              config["telegram_status_interval_hours"]
          ) == 4.0
          assert config["telegram_status_on_manual"] is True
          print("Self-test completato.")
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             doge_short_status_notify.py             doge_rejection_short_config.json             paper_trading_runner.py             paper_trading_storage.py

          if git diff --cached --quiet; then
            echo "Installazione già presente."
          else
            git commit -m               "Add periodic DOGE short Telegram status"
            git push origin HEAD:main
          fi
