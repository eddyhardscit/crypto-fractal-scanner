name: Apply Research Milestone Alerts Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-paper-trading.txt

      - name: Install Research milestone watcher
        run: |
          echo '' | base64 -d > research_sample_watch.py

      - name: Integrate Telegram alerts
        run: |
          echo '' | base64 -d > /tmp/patch_notify.py
          python /tmp/patch_notify.py

      - name: Compile modules
        run: |
          python -m py_compile             research_sample_watch.py             paper_trading_notify.py

      - name: Offline milestone self-test
        run: |
          python - <<'PYTEST'
          from pathlib import Path

          import pandas as pd

          import research_sample_watch as watch

          test_path = Path(
              "reports/_test_research_milestones.csv"
          )
          test_path.parent.mkdir(
              parents=True,
              exist_ok=True,
          )
          watch.RESEARCH_TRADES_PATH = test_path

          profiles = [
              ("MAIN", "TREND_UP", 50),
              (
                  "SHADOW_1H_BALANCED",
                  "TREND_UP",
                  50,
              ),
              (
                  "SHADOW_1H_FAST",
                  "RANGE",
                  50,
              ),
              (
                  "SHADOW_4H_WIDE",
                  "TREND_DOWN",
                  30,
              ),
              (
                  "SHADOW_RELATIVE_STRENGTH",
                  "ALT_ROTATION_UP",
                  30,
              ),
          ]
          assets = [
              "BTC",
              "ETH",
              "SOL",
              "DOGE",
              "HYPE",
              "XRP",
          ]
          rows = []
          sequence = 0
          for profile, regime, count in profiles:
              for index in range(count):
                  sequence += 1
                  won = index % 2 == 0
                  rows.append(
                      {
                          "profile": profile,
                          "entry_regime": regime,
                          "experiment_group_id": (
                              f"evt-{sequence}"
                          ),
                          "asset": assets[
                              sequence % len(assets)
                          ],
                          "net_pnl_eur": (
                              12.0 if won else -8.0
                          ),
                          "r_multiple": (
                              1.2 if won else -0.8
                          ),
                      }
                  )
          pd.DataFrame(rows).to_csv(
              test_path,
              index=False,
          )

          state = {"notifications": {}}
          config = {}
          messages, marks, snapshot = (
              watch.pending_research_notifications(
                  state,
                  config,
              )
          )
          print("\n---\n".join(messages))
          assert messages
          assert marks["strategy"]
          assert marks["regime"]
          assert marks["meta_ready"] is True
          assert snapshot["meta_ready"] is True
          assert snapshot["strategies_ready"] == 5
          assert (
              snapshot["qualifying_regime_pairs"]
              >= 3
          )

          watch.mark_research_notifications_sent(
              state,
              marks,
          )
          messages_again, marks_again, _ = (
              watch.pending_research_notifications(
                  state,
                  config,
              )
          )
          assert messages_again == []
          assert not marks_again["strategy"]
          assert not marks_again["regime"]
          assert marks_again["meta_ready"] is False

          test_path.unlink(missing_ok=True)
          print(
              "Research milestone alerts self-test: OK"
          )
          PYTEST

      - name: Import Telegram module
        run: |
          python - <<'PYTEST'
          import paper_trading_notify
          print("paper_trading_notify import: OK")
          PYTEST

      - name: Commit Research milestone alerts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             research_sample_watch.py             paper_trading_notify.py

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m               "Add Research and regime milestone alerts"
            git push
          fi
