name: Report Health Watch

on:
  workflow_run:
    workflows:
      - Daily crypto scanner
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: report-health-watch
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Validate health files
        run: |
          test -f report_health_audit.py
          test -f report_health_config.json
          python -m py_compile report_health_audit.py

      - name: Audit reports and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python report_health_audit.py

      - name: Commit health status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             reports/report_health_audit.md             reports/report_health_audit.json             reports/report_health_state.json

          if git diff --cached --quiet; then
            echo "Nessun cambiamento nel controllo report."
          else
            git commit -m "Update report health status"
            git push origin HEAD:main
          fi
