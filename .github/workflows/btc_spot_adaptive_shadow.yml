name: BTC Spot Adaptive Shadow
on:
  workflow_dispatch:
  schedule:
    - cron: "37 */4 * * *"
permissions:
  contents: write
concurrency:
  group: btc-spot-adaptive-shadow
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas numpy requests; fi
      - name: Validate paper-only BTC shadow
        run: |
          set -euxo pipefail
          python -m py_compile btc_spot_adaptive_shadow.py btc_spot_adaptive_shadow_runner.py
          grep -q 'INITIAL_CAPITAL_EUR = 40000.0' btc_spot_adaptive_shadow.py
          grep -q 'Telegram: \*\*disabilitato\*\*' btc_spot_adaptive_shadow.py
          ! grep -Eq 'TELEGRAM_BOT_TOKEN|sendMessage|/api/v1/orders|KUCOIN_API_SECRET' btc_spot_adaptive_shadow.py btc_spot_adaptive_shadow_runner.py
      - name: Run BTC shadow cycle
        run: |
          set -euxo pipefail
          PYTHONUNBUFFERED=1 python -u btc_spot_adaptive_shadow_runner.py
      - name: Validate outputs
        run: |
          set -euxo pipefail
          test -f reports/btc_spot_adaptive_shadow_state.json
          test -f reports/btc_spot_adaptive_shadow_report.md
          test -f reports/btc_spot_adaptive_shadow_history.csv
          grep -qF 'BTC Spot Adaptive Shadow' reports/btc_spot_adaptive_shadow_report.md
          grep -qF 'Telegram: **disabilitato**' reports/btc_spot_adaptive_shadow_report.md
          grep -qF 'Buy & Hold' reports/btc_spot_adaptive_shadow_report.md
      - name: Commit BTC shadow data
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --force reports/btc_spot_adaptive_shadow_state.json reports/btc_spot_adaptive_shadow_history.csv
          git add reports/btc_spot_adaptive_shadow_report.md
          if git diff --cached --quiet; then echo "No BTC shadow changes to commit."; else git commit -m "Update BTC spot adaptive shadow data"; git pull --rebase origin main; git push; fi
