name: Apply KuCoin Recent Candle Window Fix Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-paper-trading.txt

      - name: Request the latest 200 closed KuCoin candles
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("kucoin_public_data.py")
          text = path.read_text(encoding="utf-8")

          old = '''def fetch_klines(
              session: requests.Session,
              symbol: str,
              timeframe_minutes: int,
              limit: int = 420,
              now: datetime | None = None,
          ) -> pd.DataFrame:
              current = now or utc_now()

              # KuCoin Futures expects `from` and `to` in milliseconds.
              # Unix seconds can return an empty kline payload even when
              # contracts and mark prices are available.
              end = int(current.timestamp() * 1000)
              # Add a buffer for missing intervals and exchange-side truncation.
              start = end - int(
                  timeframe_minutes
                  * 60_000
                  * max(limit + 80, 200)
              )
              data = get_json(
                  session,
                  FUTURES_BASE,
                  "/api/v1/kline/query",
                  {
                      "symbol": symbol,
                      "granularity": int(timeframe_minutes),
                      "from": start,
                      "to": end,
                  },
              )
              frame = _normalize_kline_rows(data)

              # Defensive retry without a time window if KuCoin returns
              # an empty payload for the requested interval.
              if frame.empty:
                  fallback_data = get_json(
                      session,
                      FUTURES_BASE,
                      "/api/v1/kline/query",
                      {
                          "symbol": symbol,
                          "granularity": int(timeframe_minutes),
                      },
                  )
                  frame = _normalize_kline_rows(fallback_data)

              frame = drop_incomplete_candle(
                  frame,
                  timeframe_minutes,
                  now=current,
              )
              if len(frame) > limit:
                  frame = frame.tail(limit)
              return frame
          '''

          new = '''def fetch_klines(
              session: requests.Session,
              symbol: str,
              timeframe_minutes: int,
              limit: int = 420,
              now: datetime | None = None,
          ) -> pd.DataFrame:
              current = now or utc_now()
              interval_ms = int(timeframe_minutes) * 60_000

              # KuCoin Futures returns at most about 200 rows for this public
              # endpoint and, when the requested window is wider, it can return
              # the oldest rows in that window. Ask explicitly for the latest
              # 200 fully closed candles so EMA200 remains available and the
              # final candle is current.
              current_ms = int(current.timestamp() * 1000)
              current_open_ms = (
                  current_ms // interval_ms
              ) * interval_ms
              end = current_open_ms - 1
              requested_count = 200
              start = current_open_ms - (
                  requested_count * interval_ms
              )

              data = get_json(
                  session,
                  FUTURES_BASE,
                  "/api/v1/kline/query",
                  {
                      "symbol": symbol,
                      "granularity": int(timeframe_minutes),
                      "from": start,
                      "to": end,
                  },
              )
              frame = _normalize_kline_rows(data)

              # Defensive retry without a time window if KuCoin returns
              # an empty payload for the precise recent window.
              if frame.empty:
                  fallback_data = get_json(
                      session,
                      FUTURES_BASE,
                      "/api/v1/kline/query",
                      {
                          "symbol": symbol,
                          "granularity": int(timeframe_minutes),
                      },
                  )
                  frame = _normalize_kline_rows(fallback_data)

              frame = drop_incomplete_candle(
                  frame,
                  timeframe_minutes,
                  now=current,
              )
              if len(frame) > requested_count:
                  frame = frame.tail(requested_count)
              if len(frame) > limit:
                  frame = frame.tail(limit)
              return frame
          '''

          if new in text:
              print("Finestra candele recenti già corretta.")
          elif old not in text:
              raise SystemExit(
                  "Patch non applicabile: fetch_klines non coincide "
                  "con la versione attesa."
              )
          else:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
              print(
                  "KuCoin ora richiede esattamente le ultime "
                  "200 candele chiuse."
              )
          PY

      - name: Compile module
        run: |
          python -m py_compile kucoin_public_data.py

      - name: Run offline recent-window self-test
        run: |
          python - <<'PY'
          from datetime import datetime, timezone

          import kucoin_public_data as module

          captured = []
          now = datetime(
              2026,
              7,
              12,
              11,
              29,
              11,
              tzinfo=timezone.utc,
          )

          def fake_get_json(
              session,
              base,
              path,
              params=None,
          ):
              params = dict(params or {})
              captured.append(params)
              interval_ms = int(params["granularity"]) * 60_000
              rows = []
              timestamp = int(params["from"])
              while timestamp <= int(params["to"]):
                  rows.append(
                      [
                          timestamp,
                          "63000",
                          "63500",
                          "62800",
                          "63200",
                          "100",
                      ]
                  )
                  timestamp += interval_ms
              return rows[:200]

          original = module.get_json
          module.get_json = fake_get_json
          try:
              frame = module.fetch_klines(
                  object(),
                  "XBTUSDTM",
                  60,
                  limit=420,
                  now=now,
              )
          finally:
              module.get_json = original

          assert len(captured) == 1, captured
          params = captured[0]
          interval_ms = 60 * 60_000
          current_ms = int(now.timestamp() * 1000)
          current_open_ms = (
              current_ms // interval_ms
          ) * interval_ms

          assert params["to"] == current_open_ms - 1, params
          assert (
              params["from"]
              == current_open_ms - 200 * interval_ms
          ), params
          assert len(frame) == 200, len(frame)
          assert frame.index[-1].isoformat().startswith(
              "2026-07-12T10:00:00"
          ), frame.index[-1]

          print("KuCoin recent candle window self-test: OK")
          PY

      - name: Commit recent candle window fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add kucoin_public_data.py

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m               "Request latest closed KuCoin Futures candles"
            git push
          fi
