name: Apply Daily and Comparative Fix Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Patch fractal tracker and comparative workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          fractal_path = Path("fractal_path_tracker.py")
          comparative_path = Path(
              ".github/workflows/paper_trading_comparative_daily.yml"
          )

          fractal = fractal_path.read_text(encoding="utf-8")
          comparative = comparative_path.read_text(encoding="utf-8")

          marker = "FRACTAL_BOOLEAN_DTYPE_FIX_V1"
          if marker not in fractal:
              anchor = (
                  "    log = pd.concat([log, new_rows], "
                  "ignore_index=True, sort=False)\n"
              )
              if anchor not in fractal:
                  raise SystemExit(
                      "Anchor del projection log non trovato."
                  )

              fix_lines = [
                  "",
                  "    # FRACTAL_BOOLEAN_DTYPE_FIX_V1",
                  "    # I CSV storici possono far rilevare queste colonne come float64",
                  "    # quando contengono soltanto NaN. Pandas recente non permette poi",
                  "    # di assegnare True/False a una colonna float.",
                  "    boolean_columns = (",
                  '        "checked",',
                  '        "inside_band",',
                  '        "inside_reanchored_band",',
                  '        "inside_anchored_band",',
                  "    )",
                  "",
                  "    def _nullable_bool(value):",
                  "        if pd.isna(value):",
                  "            return pd.NA",
                  "        text = str(value).strip().lower()",
                  '        if text in {"true", "1", "yes", "si", "sì"}:',
                  "            return True",
                  '        if text in {"false", "0", "no"}:',
                  "            return False",
                  "        return pd.NA",
                  "",
                  "    for column in boolean_columns:",
                  "        if column not in log.columns:",
                  "            log[column] = pd.Series(",
                  "                pd.NA,",
                  "                index=log.index,",
                  '                dtype="boolean",',
                  "            )",
                  "        else:",
                  "            log[column] = pd.array(",
                  "                [_nullable_bool(value) for value in log[column]],",
                  '                dtype="boolean",',
                  "            )",
                  "",
              ]
              fix = "\n".join(fix_lines)
              fractal = fractal.replace(anchor, anchor + fix, 1)

          old_block = (
              '            git commit -m "Update paper trading comparative ranking"\n'
              "            git pull --rebase origin main\n"
              "            git push origin HEAD:main\n"
          )
          new_block = (
              '            git commit -m "Update paper trading comparative ranking"\n'
              "\n"
              "            # Il ripristino dello stato paper può modificare file tracciati\n"
              "            # che non appartengono al report comparativo. Il commit è già\n"
              "            # stato creato: puliamo soltanto il working tree prima del rebase.\n"
              "            git status --short\n"
              "            git reset --hard HEAD\n"
              "\n"
              "            for attempt in 1 2 3; do\n"
              '              echo "Comparative push attempt ${attempt}/3"\n'
              "              git fetch origin main\n"
              "              git rebase origin/main\n"
              "\n"
              "              if git push origin HEAD:main; then\n"
              '                echo "Comparative reports pushed successfully."\n'
              "                break\n"
              "              fi\n"
              "\n"
              '              if [ "${attempt}" -eq 3 ]; then\n'
              '                echo "Unable to push comparative reports."\n'
              "                exit 1\n"
              "              fi\n"
              "\n"
              "              sleep 5\n"
              "            done\n"
          )
          if "Comparative push attempt" not in comparative:
              if old_block not in comparative:
                  raise SystemExit(
                      "Blocco commit comparativo non trovato."
                  )
              comparative = comparative.replace(
                  old_block,
                  new_block,
                  1,
              )

          fractal_path.write_text(fractal, encoding="utf-8")
          comparative_path.write_text(
              comparative,
              encoding="utf-8",
          )
          PY

      - name: Validate fixes
        run: |
          set -euxo pipefail
          python -m pip install pandas
          python -m py_compile fractal_path_tracker.py
          grep -q "FRACTAL_BOOLEAN_DTYPE_FIX_V1" \
            fractal_path_tracker.py
          grep -q "Comparative push attempt" \
            .github/workflows/paper_trading_comparative_daily.yml

      - name: Commit fixes
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com

          git add \
            fractal_path_tracker.py \
            .github/workflows/paper_trading_comparative_daily.yml

          if git diff --cached --quiet; then
            echo "Fixes already installed."
          else
            git commit -m \
              "Fix fractal boolean dtype and comparative rebase"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
