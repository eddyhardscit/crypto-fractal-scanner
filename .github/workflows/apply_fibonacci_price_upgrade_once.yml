name: Apply Fibonacci Price Upgrade Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-upgrade:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install tabulate

      - name: Install Fibonacci and shared-price upgrade
        run: python install_fibonacci_price_upgrade.py

      - name: Compile upgraded files
        run: |
          python -m py_compile \
            shared_market_snapshot.py \
            price_coherence_sync.py \
            technical_structure_report.py \
            classic_technical_visual_report.py \
            rsi_top_cycle_report.py \
            btc_2022_vs_sol_2026_report.py \
            fractal_path_tracker.py \
            data_quality_coherence_report.py \
            install_fibonacci_price_upgrade.py

      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            shared_market_snapshot.py \
            price_coherence_sync.py \
            technical_structure_report.py \
            classic_technical_visual_report.py \
            rsi_top_cycle_report.py \
            btc_2022_vs_sol_2026_report.py \
            fractal_path_tracker.py \
            data_quality_coherence_report.py \
            install_fibonacci_price_upgrade.py \
            .github/workflows/daily.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add Fibonacci, shared prices and Classic Visual alignment"
            git push
          fi
