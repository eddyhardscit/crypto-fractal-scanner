        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             doge_rejection_short.py             doge_rejection_short_config.json             paper_trading_runner.py             paper_trading_storage.py
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Installer già applicato: nessuna modifica."
            exit 0
          fi

          git commit -m "Add dedicated DOGE rejection short paper strategy"
          git push
