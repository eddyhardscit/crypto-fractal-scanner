          for filename, payload in FILES_B64.items():
              content = base64.b64decode("".join(payload.split())).decode("utf-8")
              Path(filename).write_text(content, encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Anchor non trovato per {label}")
              return text.replace(old, new, 1)

          runner_path = Path("paper_trading_runner.py")
          runner = runner_path.read_text(encoding="utf-8")

          if "DOGE_REJECTION_SHORT_IMPORT" not in runner:
              runner = replace_once(
                  runner,
                  "from research_all_signals import run_research_cycle\n",
                  (
                      "from research_all_signals import run_research_cycle\n"
                      "# DOGE_REJECTION_SHORT_IMPORT\n"
                      "from doge_rejection_short import run_doge_rejection_cycle\n"
                  ),
                  "import runner",
              )

          if "DOGE_REJECTION_SHORT_CYCLE_START" not in runner:
              runner = replace_once(
                  runner,
                  "    current = datetime.now(timezone.utc)\n    report = render_report(state, config)\n",
                  (
                      "    # DOGE_REJECTION_SHORT_CYCLE_START\n"
                      "    try:\n"
                      "        doge_rejection_result = run_doge_rejection_cycle(bundle, config)\n"
                      "    except Exception as exc:\n"
                      "        doge_rejection_result = {\n"
                      "            \"report_markdown\": \"\",\n"
                      "            \"phase\": \"ERROR\",\n"
                      "            \"position_open\": False,\n"
                      "            \"error\": str(exc),\n"
                      "        }\n"
                      "        print(f\"DOGE rejection short non eseguito: {exc}\")\n"
                      "    # DOGE_REJECTION_SHORT_CYCLE_END\n"
                      "\n"
                      "    current = datetime.now(timezone.utc)\n"
                      "    report = render_report(state, config)\n"
                  ),
                  "ciclo DOGE",
              )

          if "DOGE_REJECTION_SHORT_REPORT_START" not in runner:
              runner = replace_once(
                  runner,
                  "    report = render_report(state, config)\n"
                  "    research_markdown = str(research_result.get(\"report_markdown\", \"\")).strip()\n",
                  (
                      "    report = render_report(state, config)\n"
                      "    # DOGE_REJECTION_SHORT_REPORT_START\n"
                      "    doge_rejection_markdown = str(\n"
                      "        doge_rejection_result.get(\"report_markdown\", \"\")\n"
                      "    ).strip()\n"
                      "    if doge_rejection_markdown:\n"
                      "        report = report.rstrip() + \"\\n\\n\" + doge_rejection_markdown + \"\\n\"\n"
                      "    # DOGE_REJECTION_SHORT_REPORT_END\n"
                      "    research_markdown = str(research_result.get(\"report_markdown\", \"\")).strip()\n"
                  ),
                  "report DOGE",
              )

          if "DOGE_REJECTION_SHORT_PAYLOAD" not in runner:
              runner = replace_once(
                  runner,
                  "        \"signal_diagnostics\": signal_diagnostics.get(\n",
                  (
                      "        # DOGE_REJECTION_SHORT_PAYLOAD\n"
                      "        \"doge_rejection_short\": {\n"
                      "            \"phase\": doge_rejection_result.get(\"phase\"),\n"
                      "            \"position_open\": doge_rejection_result.get(\"position_open\", False),\n"
                      "            \"equity_eur\": doge_rejection_result.get(\"equity_eur\"),\n"
                      "            \"opened_this_cycle\": doge_rejection_result.get(\"opened_this_cycle\", 0),\n"
                      "            \"management_events\": doge_rejection_result.get(\"management_events\", 0),\n"
                      "            \"telegram\": doge_rejection_result.get(\"telegram\", {}),\n"
                      "            \"error\": doge_rejection_result.get(\"error\"),\n"
                      "        },\n"
                      "        \"signal_diagnostics\": signal_diagnostics.get(\n"
                  ),
                  "payload DOGE",
              )

          runner_path.write_text(runner, encoding="utf-8")

          storage_path = Path("paper_trading_storage.py")
          storage = storage_path.read_text(encoding="utf-8")
          if '"doge_rejection_short_state.json"' not in storage:
              storage = replace_once(
                  storage,
                  '    "market_regime_history.csv",\n',
                  (
                      '    "market_regime_history.csv",\n'
                      '    "doge_rejection_short_state.json",\n'
                      '    "doge_rejection_short_trades.csv",\n'
                      '    "doge_rejection_short_report.md",\n'
                      '    "doge_rejection_short_latest.json",\n'
                  ),
                  "storage DOGE",
              )
          storage_path.write_text(storage, encoding="utf-8")
          PY

      - name: Self-test
        shell: bash
        run: |
          python -m py_compile             doge_rejection_short.py             paper_trading_runner.py             paper_trading_storage.py

          python - <<'PY'
          import json
          from pathlib import Path

          import pandas as pd

          from doge_rejection_short import evaluate_rejection, load_config

          config = load_config()
          assert config["paper_only"] is True
          assert config["initial_capital_eur"] == 3600.0
          assert config["fixed_margin_eur"] == 3600.0
          assert config["leverage"] == 5.0
          assert config["targets"][-1]["price"] == 0.06000

          index = pd.date_range(
              "2026-07-13T00:00:00Z",
              periods=25,
              freq="15min",
          )
          frame = pd.DataFrame(
              {
                  "open": [0.075] * 24 + [0.0778],
                  "high": [0.0755] * 24 + [0.0790],
                  "low": [0.0745] * 24 + [0.0772],
                  "close": [0.0751] * 23 + [0.0777, 0.0776],
                  "volume": [1000.0] * 24 + [1200.0],
              },
              index=index,
          )
          accepted = evaluate_rejection(frame, 0.0776, config)
          assert accepted["accepted"] is True, accepted

          breakout = frame.copy()
          breakout.iloc[-1, breakout.columns.get_loc("close")] = 0.0800
          rejected = evaluate_rejection(breakout, 0.0800, config)
          assert rejected["accepted"] is False

          runner = Path("paper_trading_runner.py").read_text(encoding="utf-8")
          storage = Path("paper_trading_storage.py").read_text(encoding="utf-8")
          assert "DOGE_REJECTION_SHORT_CYCLE_START" in runner
          assert "DOGE_REJECTION_SHORT_REPORT_START" in runner
          assert "doge_rejection_short_state.json" in storage
          assert "doge_rejection_short_trades.csv" in storage

          parsed = json.loads(
              Path("doge_rejection_short_config.json").read_text(encoding="utf-8")
          )
          assert parsed["paper_only"] is True
          assert not any(
              key in parsed
              for key in ("api_key", "api_secret", "passphrase", "real_orders")
          )
          print("Self-test DOGE rejection short: OK")
          PY

