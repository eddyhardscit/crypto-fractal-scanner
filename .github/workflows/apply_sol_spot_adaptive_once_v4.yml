      - name: Validate SOL spot bot files
        run: |
          test -f sol_spot_adaptive_config.json
          test -f sol_spot_adaptive_bot.py
          test -f sol_spot_adaptive_storage.py
          test -f .github/workflows/sol_spot_adaptive_paper.yml

          python -m py_compile \
            sol_spot_adaptive_bot.py \
            sol_spot_adaptive_storage.py
          python sol_spot_adaptive_bot.py --config sol_spot_adaptive_config.json --self-test

      - name: Verify repository compatibility and safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          config = json.loads(
              Path("sol_spot_adaptive_config.json").read_text(encoding="utf-8")
          )
          required = {
              "mode": "PAPER_ONLY",
              "asset": "SOL",
              "symbol": "SOL-USDT",
              "initial_capital_eur": 40000.0,
              "public_data_only": True,
              "real_orders_enabled": False,
              "allow_short": False,
              "leverage": 1.0,
          }
          for key, expected in required.items():
              actual = config.get(key)
              if actual != expected:
                  raise SystemExit(
                      f"Unsafe or incompatible config: {key}={actual!r}, "
                      f"expected {expected!r}"
                  )

          source = Path("sol_spot_adaptive_bot.py").read_text(encoding="utf-8")
          # POST is allowed only for Telegram notifications. KuCoin remains
          # public-data-only and no exchange credential or order endpoint is allowed.
          forbidden = (
              "/api/v1/orders",
              "/api/v1/order",
              "/api/v1/hf/orders",
              "KUCOIN_API_SECRET",
              "KUCOIN_API_KEY",
              "KUCOIN_API_PASSPHRASE",
              "KC-API-KEY",
              "KC-API-SIGN",
              "KC-API-PASSPHRASE",
          )
          found = [token for token in forbidden if token in source]
          if found:
              raise SystemExit(f"Real-order capability found: {found}")

          post_count = source.count("requests.post(")
          telegram_post = (
              "https://api.telegram.org/bot" in source
              and "/sendMessage" in source
          )
          if post_count != 1 or not telegram_post:
              raise SystemExit(
                  "Unexpected POST capability: only one Telegram sendMessage "
                  f"call is permitted; found post_count={post_count}."
              )

          for method in ("requests.put(", "requests.patch(", "requests.delete("):
              if method in source:
                  raise SystemExit(
                      f"Unexpected write-capable HTTP method found: {method}"
                  )

          for workflow_path in (
              Path(".github/workflows/daily.yml"),
              Path(".github/workflows/paper_trading_intraday.yml"),
              Path(".github/workflows/report_health_watch_v2.yml"),
              Path(".github/workflows/sol_spot_adaptive_paper.yml"),
              Path(".github/workflows/apply_sol_spot_adaptive_once.yml"),
          ):
              payload = yaml.safe_load(workflow_path.read_text(encoding="utf-8"))
              if not isinstance(payload, dict) or "jobs" not in payload:
                  raise SystemExit(f"Invalid workflow YAML: {workflow_path}")

          target = Path(".github/workflows/sol_spot_adaptive_paper.yml").read_text(encoding="utf-8")
          if "paper-trading-persistent-state" in target:
              raise SystemExit("SOL bot must not share the existing paper-trading concurrency group.")
          if "PAPER_TRADING_RELEASE_TAG" in target:
              raise SystemExit("SOL bot must not share the existing paper-trading release state.")
          if "TELEGRAM_BOT_TOKEN" not in target or "TELEGRAM_CHAT_ID" not in target:
              raise SystemExit("SOL spot bot workflow must receive Telegram secrets for notifications.")
          if "KUCOIN_API" in target or "KUCOIN_SECRET" in target or "KUCOIN_PASSPHRASE" in target:
              raise SystemExit("SOL spot bot workflow must not receive exchange credentials.")
          PY
          git diff --check

      - name: Commit validated installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            sol_spot_adaptive_config.json \
            sol_spot_adaptive_bot.py \
            sol_spot_adaptive_storage.py \
            .gitignore \
            .github/workflows/sol_spot_adaptive_paper.yml \
            reports/sol_spot_adaptive_installation_status.md

          git diff --cached --check
          if git diff --cached --quiet; then
            echo "SOL Spot Adaptive Range is already installed."
          else
            git commit -m "Install SOL spot adaptive paper bot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
