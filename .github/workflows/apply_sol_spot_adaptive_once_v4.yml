name: Apply SOL Spot Adaptive Range paper bot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply_sol_spot_adaptive_once*.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-sol-spot-adaptive-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
