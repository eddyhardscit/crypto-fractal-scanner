name: Manual install combined shadow strategies

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-install-combined-shadow-strategies
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install combined strategy logic
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import base64
          import json
          from pathlib import Path

          patch_sets = {
              "paper_signal_engine.py": [('ZGVmIHN0cmF0ZWd5X2FjY2VwdHMoCiAgICBzdHJhdGVneTogc3RyLAogICAgc2lkZTogc3RyLAogICAgZmVhdHVyZXM6IGRpY3Rbc3RyLCBBbnldLAogICAgc2NvcmU6IGZsb2F0LAopIC0+IGJvb2w6Cg==', ''), ('ICAgICAgICAgICAgYmVuY2htYXJrX3N0cmF0ZWdpZXMgPSB7CiAgICAgICAgICAgICAgICAiZG9uY2hpYW5fYnJlYWtvdXQiLAogICAgICAgICAgICAgICAgImJvbGxpbmdlcl9tZWFuX3JldmVyc2lvbiIsCiAgICAgICAgICAgICAgICAiZW1hX3RyZW5kX2ZvbGxvd2luZyIsCiAgICAgICAgICAgIH0KICAgICAgICAgICAgaWYgc3RyYXRlZ3kgaW4gc2Nhbm5lcl9zdHJhdGVnaWVzOgo=', ''), ('', '')],
              "paper_trading_notify.py": [('ZGVmIGJ1aWxkX2V2ZW50X21lc3NhZ2VzKHN1bW1hcnk6IGRpY3Rbc3RyLCBBbnldKSAtPiBsaXN0W3N0cl06Cg==', ''), ('', ''), ('ICAgIG1ldHJpY3MgPSBwb3J0Zm9saW9fbWV0cmljcyhzdGF0ZSwgY29uZmlnKQogICAgaWYgbm90IG1ldHJpY3M6CiAgICAgICAgcmV0dXJuICLwn5K8IFJJRVBJTE9HTyBDT05USSDigJQgc3RhdG8gbm9uIGRpc3BvbmliaWxlIgoKICAgIGluaXRpYWwgPSBmbG9hdCgK', ''), ('ICAgIGxpbmVzLmV4dGVuZChfb2ZmaWNpYWxfbGFiX2xpbmVzKG1ldHJpY3MsIGluaXRpYWwpKQogICAgbGluZXMuZXh0ZW5kKF9hdXhpbGlhcnlfbGFiX2xpbmVzKCkpCgogICAgcmV0dXJuICJcbiIuam9pbihsaW5lcykK', 'ICAgIGxpbmVzLmV4dGVuZChfb2ZmaWNpYWxfbGFiX2xpbmVzKG1ldHJpY3MsIGluaXRpYWwpKQogICAgbGluZXMuZXh0ZW5kKF9hdXhpbGlhcnlfbGFiX2xpbmVzKCkpCiAgICBsaW5lcy5leHRlbmQoX2NvbWJvX2xpbmVzKGNvbWJvX21ldHJpY3MsIGluaXRpYWwpKQoKICAgIHJldHVybiAiXG4iLmpvaW4obGluZXMpCg==')],
          }

          for filename, patches in patch_sets.items():
              path = Path(filename)
              source = path.read_text(encoding="utf-8")
              for old64, new64 in patches:
                  old = base64.b64decode(old64).decode("utf-8")
                  new = base64.b64decode(new64).decode("utf-8")
                  if new in source:
                      continue
                  if old not in source:
                      raise SystemExit(
                          f"{filename}: expected patch block not found"
                      )
                  source = source.replace(old, new, 1)
              ast.parse(source, filename=filename)
              path.write_text(source, encoding="utf-8")

          config_path = Path("paper_trading_config.json")
          config = json.loads(
              config_path.read_text(encoding="utf-8")
          )
          additions = [{'name': 'SHADOW_COMBO_TREND', 'enabled': True, 'is_main': False, 'strategy': 'combo_trend', 'timeframe_minutes': 60, 'minimum_abs_score': 5.0, 'minimum_combo_votes': 2, 'scanner_top_n': 5, 'minimum_scanner_rank_score': 1.0, 'minimum_relative_strength_pct': 0.5, 'minimum_global_score': 4.0, 'minimum_exchange_alignment': 0.0, 'atr_stop_multiple': 2.0, 'reward_risk': 2.2, 'leverage': 2.0, 'max_holding_hours': 168, 'allow_long': True, 'allow_short': True, 'trailing_at_r': 1.1, 'trailing_atr_multiple': 1.5, 'max_open_positions': 3, 'max_same_direction_positions': 2, 'compact_shadow': True}, {'name': 'SHADOW_COMBO_MEAN_REVERSION', 'enabled': True, 'is_main': False, 'strategy': 'combo_mean_reversion', 'timeframe_minutes': 60, 'minimum_abs_score': 5.0, 'minimum_combo_votes': 2, 'atr_stop_multiple': 1.5, 'reward_risk': 1.6, 'leverage': 2.0, 'max_holding_hours': 72, 'allow_long': True, 'allow_short': True, 'trailing_at_r': 0.9, 'trailing_atr_multiple': 1.1, 'max_open_positions': 3, 'max_same_direction_positions': 2, 'compact_shadow': True}, {'name': 'SHADOW_COMBO_SCANNER', 'enabled': True, 'is_main': False, 'strategy': 'combo_scanner', 'timeframe_minutes': 60, 'minimum_abs_score': 5.0, 'minimum_combo_votes': 2, 'scanner_top_n': 5, 'minimum_scanner_rank_score': 1.0, 'maximum_scanner_rank_score': -1.0, 'minimum_relative_strength_pct': 0.5, 'minimum_global_score': 4.0, 'minimum_exchange_alignment': 0.0, 'atr_stop_multiple': 1.8, 'reward_risk': 2.2, 'leverage': 2.0, 'max_holding_hours': 144, 'allow_long': True, 'allow_short': True, 'trailing_at_r': 1.1, 'trailing_atr_multiple': 1.4, 'max_open_positions': 3, 'max_same_direction_positions': 2, 'compact_shadow': True}, {'name': 'SHADOW_COMBO_ADAPTIVE', 'enabled': True, 'is_main': False, 'strategy': 'combo_adaptive', 'timeframe_minutes': 60, 'minimum_abs_score': 5.0, 'minimum_combo_votes': 2, 'scanner_top_n': 5, 'minimum_scanner_rank_score': 1.0, 'maximum_scanner_rank_score': -1.0, 'minimum_relative_strength_pct': 0.5, 'minimum_global_score': 4.0, 'minimum_exchange_alignment': 0.0, 'atr_stop_multiple': 1.8, 'reward_risk': 2.0, 'leverage': 2.0, 'max_holding_hours': 144, 'allow_long': True, 'allow_short': True, 'trailing_at_r': 1.0, 'trailing_atr_multiple': 1.3, 'max_open_positions': 3, 'max_same_direction_positions': 2, 'compact_shadow': True}]
          existing = {
              str(item.get("name"))
              for item in config.get("portfolios", [])
          }
          for item in additions:
              if item["name"] not in existing:
                  config.setdefault("portfolios", []).append(item)

          config_path.write_text(
              json.dumps(
                  config,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate combined strategies
        shell: bash
        run: |
          python -m pip install numpy pandas requests
          python -m py_compile             paper_signal_engine.py             paper_trading_notify.py

          python - <<'PY'
          import json

          import paper_signal_engine as signals
          import paper_trading_notify as notify

          config = json.loads(
              open(
                  "paper_trading_config.json",
                  encoding="utf-8",
              ).read()
          )
          names = {
              item["name"]
              for item in config["portfolios"]
          }
          required = {
              "SHADOW_COMBO_TREND",
              "SHADOW_COMBO_MEAN_REVERSION",
              "SHADOW_COMBO_SCANNER",
              "SHADOW_COMBO_ADAPTIVE",
          }
          assert required <= names
          assert callable(signals.combined_strategy_score)
          assert notify._is_combo("SHADOW_COMBO_TREND")
          assert not notify._is_combo("MAIN")

          sample = [
              {
                  "portfolio": "SHADOW_COMBO_TREND",
                  "equity_eur": 10084,
                  "closed_trades": 6,
                  "open_positions": 1,
                  "profit_factor": 1.42,
              },
              {
                  "portfolio": "SHADOW_COMBO_ADAPTIVE",
                  "equity_eur": 9990,
                  "closed_trades": 2,
                  "open_positions": 0,
                  "profit_factor": 0.85,
              },
          ]
          text = "\n".join(
              notify._combo_lines(sample, 10000.0)
          )
          assert "Combo Trend" in text
          assert "PF 1,42" in text
          assert "Migliore" in text
          print("PASS: 4 combined shadow strategies installed")
          PY

          git diff --check

      - name: Commit combined strategies
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             paper_signal_engine.py             paper_trading_notify.py             paper_trading_config.json

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Combined shadow strategies already installed."
            exit 0
          fi

          git commit -m "Add combined shadow strategy family"
          git pull --rebase origin main
          git push origin HEAD:main
