name: Manual install permanent paper trading ledgers

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-install-permanent-paper-ledgers
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install permanent ledgers
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import base64
          from pathlib import Path

          path = Path("paper_trading_storage.py")
          source = path.read_text(encoding="utf-8")
          patches = [('aW1wb3J0IGlvCmltcG9ydCBqc29uCmltcG9ydCBvcwppbXBvcnQgc3lzCmltcG9ydCB6aXBmaWxlCg==', 'aW1wb3J0IGNzdgppbXBvcnQgaW8KaW1wb3J0IGpzb24KaW1wb3J0IG9zCmltcG9ydCBzeXMKaW1wb3J0IHppcGZpbGUK'), ('QVNTRVRfTkFNRSA9IG9zLmdldGVudigiUEFQRVJfVFJBRElOR19BU1NFVF9OQU1FIiwgInBhcGVyLXRyYWRpbmctc3RhdGUuemlwIikKUkVMRUFTRV9UQUcgPSBvcy5nZXRlbnYoIlBBUEVSX1RSQURJTkdfUkVMRUFTRV9UQUciLCAicGFwZXItdHJhZGluZy12MSIpCkZJTEVTID0gKAo=', ''), ('', ''), ('', ''), ('', '')]

          for old_encoded, new_encoded in patches:
              old = base64.b64decode(old_encoded).decode("utf-8")
              new = base64.b64decode(new_encoded).decode("utf-8")
              if new in source:
                  continue
              if old not in source:
                  raise SystemExit(
                      "paper_trading_storage.py: "
                      "expected patch block not found"
                  )
              source = source.replace(old, new, 1)

          ast.parse(source, filename=str(path))
          path.write_text(source, encoding="utf-8")
          PY

      - name: Validate permanent ledgers
        shell: bash
        run: |
          python -m pip install requests
          python -m py_compile paper_trading_storage.py

          python - <<'PY'
          import paper_trading_storage as storage

          trades = [
              {
                  "trade_id": "T1",
                  "portfolio": "P1",
                  "closed_at": "2026-07-14T10:00:00+00:00",
                  "net_pnl_eur": "12.5",
              }
          ]
          merged_trades = storage.merge_rows(
              trades,
              trades + [{
                  "trade_id": "T2",
                  "portfolio": "P2",
                  "closed_at": "2026-07-15T10:00:00+00:00",
                  "net_pnl_eur": "-4.0",
              }],
              storage.trade_key,
          )
          assert len(merged_trades) == 2

          signals = [
              {
                  "signal_id": "S1",
                  "portfolio": "P1",
                  "processed_at": "2026-07-14T09:00:00+00:00",
                  "decision": "OPENED",
              }
          ]
          merged_signals = storage.merge_rows(
              signals,
              signals,
              storage.signal_key,
          )
          assert len(merged_signals) == 1

          assert storage.TRADE_LEDGER_ASSET_NAME ==               "paper-trading-permanent-trades.csv"
          assert storage.SIGNAL_LEDGER_ASSET_NAME ==               "paper-trading-permanent-signals.csv"

          print("PASS: trade and signal ledgers verified")
          PY

          git diff --check

      - name: Commit permanent ledgers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add paper_trading_storage.py
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Permanent paper ledgers already installed."
          else
            git commit -m "Add permanent paper trading ledgers"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
