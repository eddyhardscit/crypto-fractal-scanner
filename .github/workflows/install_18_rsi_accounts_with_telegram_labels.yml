name: Manual install 18 RSI accounts with Telegram labels

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-install-18-rsi-accounts-labels
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Expand RSI account matrix
        shell: bash
        run: |
          python - <<'PY'
          from copy import deepcopy
          import json
          from pathlib import Path

          path = Path("paper_trading_config.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          portfolios = list(config.get("portfolios", []))

          base_names = {
              "SHADOW_RSI_LONG_15X_10",
              "SHADOW_RSI_LONG_15X_50",
              "SHADOW_RSI_LONG_5X",
              "SHADOW_RSI_SHORT_15X_10",
              "SHADOW_RSI_SHORT_15X_50",
              "SHADOW_RSI_SHORT_5X",
          }

          # Accept both the original six names and a previously expanded matrix.
          originals = {
              str(portfolio.get("name", "")): portfolio
              for portfolio in portfolios
              if str(portfolio.get("name", "")) in base_names
          }

          def find_template(base_name: str) -> dict:
              if base_name in originals:
                  return deepcopy(originals[base_name])

              prefix = base_name + "_RSI"
              candidates = [
                  portfolio
                  for portfolio in portfolios
                  if str(portfolio.get("name", "")).startswith(prefix)
              ]
              if candidates:
                  return deepcopy(candidates[0])

              raise SystemExit(
                  f"Template RSI non trovato per {base_name}"
              )

          templates = {
              name: find_template(name)
              for name in sorted(base_names)
          }

          # Keep all non-RSI portfolios. Remove both old six and any previous
          # generated variants so this operation stays idempotent.
          non_rsi = [
              portfolio
              for portfolio in portfolios
              if portfolio.get("strategy") != "rsi_extreme_reversal"
          ]

          long_thresholds = [
              (15.0, 20.0),
              (20.0, 25.0),
              (25.0, 30.0),
          ]
          short_thresholds = [
              (85.0, 80.0),
              (80.0, 75.0),
              (75.0, 70.0),
          ]

          ordered_profiles = [
              ("SHADOW_RSI_LONG_15X_10", "LONG", long_thresholds),
              ("SHADOW_RSI_LONG_15X_50", "LONG", long_thresholds),
              ("SHADOW_RSI_LONG_5X", "LONG", long_thresholds),
              ("SHADOW_RSI_SHORT_15X_10", "SHORT", short_thresholds),
              ("SHADOW_RSI_SHORT_15X_50", "SHORT", short_thresholds),
              ("SHADOW_RSI_SHORT_5X", "SHORT", short_thresholds),
          ]

          expanded = []
          manifest = []

          for base_name, side, thresholds in ordered_profiles:
              template = templates[base_name]

              if template.get("strategy") != "rsi_extreme_reversal":
                  raise SystemExit(
                      f"{base_name}: strategia inattesa"
                  )

              expected_long = side == "LONG"
              if bool(template.get("allow_long")) != expected_long:
                  raise SystemExit(
                      f"{base_name}: allow_long incoerente"
                  )
              if bool(template.get("allow_short")) == expected_long:
                  raise SystemExit(
                      f"{base_name}: allow_short incoerente"
                  )

              for trigger, recovery in thresholds:
                  variant = deepcopy(template)
                  variant["name"] = f"{base_name}_RSI{int(trigger)}"
                  variant["reversal_side"] = side
                  variant["rsi_trigger"] = trigger
                  variant["rsi_recovery"] = recovery
                  variant["allow_long"] = side == "LONG"
                  variant["allow_short"] = side == "SHORT"
                  expanded.append(variant)
                  manifest.append(
                      {
                          "name": variant["name"],
                          "side": side,
                          "trigger": trigger,
                          "recovery": recovery,
                          "leverage": variant.get("leverage"),
                          "fixed_margin_eur": variant.get(
                              "fixed_margin_eur"
                          ),
                          "risk_per_trade_override": variant.get(
                              "risk_per_trade_override"
                          ),
                      }
                  )

          if len(expanded) != 18:
              raise SystemExit(
                  f"Attese 18 varianti RSI, generate {len(expanded)}"
              )

          names = [portfolio["name"] for portfolio in expanded]
          if len(names) != len(set(names)):
              raise SystemExit("Nomi duplicati nella matrice RSI")

          config["portfolios"] = non_rsi + expanded

          if len(non_rsi) != 5:
              raise SystemExit(
                  f"Attesi 5 conti non-RSI, trovati {len(non_rsi)}"
              )
          if len(config["portfolios"]) != 23:
              raise SystemExit(
                  f"Attesi 23 conti totali, trovati "
                  f"{len(config['portfolios'])}"
              )

          path.write_text(
              json.dumps(config, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(json.dumps({
              "non_rsi_accounts": len(non_rsi),
              "rsi_accounts": len(expanded),
              "total_accounts": len(config["portfolios"]),
              "variants": manifest,
          }, ensure_ascii=False, indent=2))
          PY


      - name: Add readable Telegram labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path("paper_trading_display.py")
          source = path.read_text(encoding="utf-8")

          if "import re\n" not in source:
              source = source.replace(
                  "from __future__ import annotations\n\n",
                  "from __future__ import annotations\n\nimport re\n",
                  1,
              )

          old_label = base64.b64decode(
              'ZGVmIHBvcnRmb2xpb19sYWJlbChuYW1lOiBBbnkpIC0+IHN0cjoKICAgIHJhdyA9IHN0cihuYW1lIG9yICIiKQogICAgcmV0dXJuIFBPUlRGT0xJT19MQUJFTFMuZ2V0KAogICAgICAgIHJhdywKICAgICAgICByYXcucmVwbGFjZSgiU0hBRE9XXyIsICIiKS5yZXBsYWNlKCJfIiwgIiAiKS50aXRsZSgpLAogICAgKQo='
          ).decode("utf-8")
          new_label = base64.b64decode(
              ''
          ).decode("utf-8")
          old_description = base64.b64decode(
              'ZGVmIHBvcnRmb2xpb19kZXNjcmlwdGlvbihuYW1lOiBBbnkpIC0+IHN0cjoKICAgIHJhdyA9IHN0cihuYW1lIG9yICIiKQogICAgcmV0dXJuIFBPUlRGT0xJT19ERVNDUklQVElPTlMuZ2V0KAogICAgICAgIHJhdywKICAgICAgICAiUG9ydGFmb2dsaW8gc3BlcmltZW50YWxlIHNlcGFyYXRvLiIsCiAgICApCg=='
          ).decode("utf-8")
          new_description = base64.b64decode(
              ''
          ).decode("utf-8")

          if old_label not in source:
              raise SystemExit(
                  "Funzione portfolio_label non trovata."
              )
          if old_description not in source:
              raise SystemExit(
                  "Funzione portfolio_description non trovata."
              )

          source = source.replace(
              old_label,
              new_label,
              1,
          )
          source = source.replace(
              old_description,
              new_description,
              1,
          )
          path.write_text(source, encoding="utf-8")
          PY

      - name: Validate 23-account configuration
        shell: bash
        run: |
          python -m json.tool paper_trading_config.json > /dev/null
          python -m py_compile paper_trading_display.py

          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          config = json.loads(
              Path("paper_trading_config.json").read_text(
                  encoding="utf-8"
              )
          )
          portfolios = config["portfolios"]
          rsi = [
              portfolio
              for portfolio in portfolios
              if portfolio.get("strategy") == "rsi_extreme_reversal"
          ]

          assert len(portfolios) == 23
          assert len(rsi) == 18
          assert len({p["name"] for p in portfolios}) == 23

          expected_long = Counter({
              (15.0, 20.0): 3,
              (20.0, 25.0): 3,
              (25.0, 30.0): 3,
          })
          expected_short = Counter({
              (85.0, 80.0): 3,
              (80.0, 75.0): 3,
              (75.0, 70.0): 3,
          })

          actual_long = Counter(
              (p["rsi_trigger"], p["rsi_recovery"])
              for p in rsi
              if p["reversal_side"] == "LONG"
          )
          actual_short = Counter(
              (p["rsi_trigger"], p["rsi_recovery"])
              for p in rsi
              if p["reversal_side"] == "SHORT"
          )

          assert actual_long == expected_long, (
              actual_long,
              expected_long,
          )
          assert actual_short == expected_short, (
              actual_short,
              expected_short,
          )

          for portfolio in rsi:
              side = portfolio["reversal_side"]
              assert portfolio["allow_long"] is (side == "LONG")
              assert portfolio["allow_short"] is (side == "SHORT")
              assert portfolio["max_open_positions"] == 1
              assert portfolio["max_same_direction_positions"] == 1

          from paper_trading_display import (
              portfolio_description,
              portfolio_label,
          )

          examples = [
              "SHADOW_RSI_LONG_15X_10_RSI15",
              "SHADOW_RSI_LONG_15X_50_RSI20",
              "SHADOW_RSI_LONG_5X_RSI25",
              "SHADOW_RSI_SHORT_15X_10_RSI85",
              "SHADOW_RSI_SHORT_15X_50_RSI80",
              "SHADOW_RSI_SHORT_5X_RSI75",
          ]

          for name in examples:
              label = portfolio_label(name)
              description = portfolio_description(name)
              assert "Scalp RSI" in label
              assert "RSI" in description
              print(name, "=>", label)

          print(
              "PASS: 5 conti standard + 18 conti RSI = 23 totali"
          )
          print("PASS: etichette Telegram leggibili")
          PY

          git diff --check

      - name: Commit RSI account matrix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add paper_trading_config.json paper_trading_display.py
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Espansione RSI e label Telegram già installate."
          else
            git commit -m "Expand RSI accounts and add Telegram labels"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
