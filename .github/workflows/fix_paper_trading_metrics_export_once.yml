name: Fix Paper Trading Metrics Export Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-paper-trading.txt

      - name: Fix CSV metrics fields
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("paper_trading_report.py")
          text = path.read_text(encoding="utf-8")

          old_fields = (
              '        "generated_utc", "portfolio", "is_main", '
              '"strategy", "equity_eur", "balance_eur",\n'
          )
          new_fields = (
              '        "generated_utc", "portfolio", "portfolio_label", '
              '"is_main", "strategy", "strategy_label",\n'
              '        "equity_eur", "balance_eur",\n'
          )

          if new_fields not in text:
              if old_fields not in text:
                  raise SystemExit(
                      "Blocco fieldnames atteso non trovato in "
                      "paper_trading_report.py"
                  )
              text = text.replace(old_fields, new_fields, 1)

          old_writer = (
              "writer = csv.DictWriter(handle, fieldnames=fields)"
          )
          new_writer = (
              "writer = csv.DictWriter("
              "handle, fieldnames=fields, extrasaction=\"ignore\""
              ")"
          )

          if new_writer not in text:
              if old_writer not in text:
                  raise SystemExit(
                      "Creazione DictWriter attesa non trovata."
                  )
              text = text.replace(old_writer, new_writer, 1)

          path.write_text(text, encoding="utf-8")
          print(
              "Aggiunti portfolio_label e strategy_label ai campi CSV; "
              "abilitata protezione extrasaction=ignore."
          )
          PY

      - name: Compile report module
        run: |
          python -m py_compile paper_trading_report.py

      - name: Run offline CSV export self-test
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          import tempfile

          import paper_trading_report as report

          with tempfile.TemporaryDirectory() as tmp:
              output = Path(tmp) / "metrics.csv"
              report.METRICS_PATH = output
              report.write_metrics(
                  [
                      {
                          "generated_utc": "2026-07-12T00:00:00+00:00",
                          "portfolio": "MAIN",
                          "portfolio_label": "Principale 4H",
                          "is_main": True,
                          "strategy": "confluence_trend",
                          "strategy_label": "Confluenza trend",
                          "equity_eur": 10000.0,
                          "balance_eur": 10000.0,
                          "unrealized_pnl_eur": 0.0,
                          "month_pnl_eur": 0.0,
                          "monthly_target_eur": 3000.0,
                          "target_progress_pct": 0.0,
                          "open_positions": 0,
                          "open_margin_eur": 0.0,
                          "open_notional_eur": 0.0,
                          "open_initial_risk_eur": 0.0,
                          "open_stop_risk_eur": 0.0,
                          "closed_trades": 0,
                          "unique_market_events": 0,
                          "winning_trades": 0,
                          "win_rate_pct": 0.0,
                          "profit_factor": 0.0,
                          "expectancy_eur": 0.0,
                          "net_pnl_closed_eur": 0.0,
                          "max_drawdown_pct": 0.0,
                          "future_optional_field": "ignored safely",
                      }
                  ]
              )

              with output.open(
                  "r",
                  encoding="utf-8",
                  newline="",
              ) as handle:
                  rows = list(csv.DictReader(handle))

              assert len(rows) == 1
              assert rows[0]["portfolio_label"] == "Principale 4H"
              assert rows[0]["strategy_label"] == "Confluenza trend"

          print("Paper trading metrics CSV self-test: OK")
          PY

      - name: Commit metrics export fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add paper_trading_report.py

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m \
              "Fix paper trading metrics CSV export"
            git push
          fi
