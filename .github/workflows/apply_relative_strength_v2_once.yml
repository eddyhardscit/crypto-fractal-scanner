name: Apply Relative Strength V2 Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create Forza relativa 1H V2
        shell: bash
        run: |
          cat > /tmp/apply_relative_strength_v2.py <<'PY'
          from __future__ import annotations

          import copy
          import json
          from pathlib import Path


          V1_NAME = "SHADOW_RELATIVE_STRENGTH"
          V2_NAME = "SHADOW_RELATIVE_STRENGTH_V2"


          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")


          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise RuntimeError(f"Blocco non trovato per {label}")
              return text.replace(old, new, 1)


          # 1) Config: preserve V1 and insert/update V2 immediately below it.
          config_path = Path("paper_trading_config.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          portfolios = list(config.get("portfolios", []))
          v1_index = next(
              (index for index, row in enumerate(portfolios) if row.get("name") == V1_NAME),
              None,
          )
          if v1_index is None:
              raise RuntimeError("Portafoglio V1 SHADOW_RELATIVE_STRENGTH non trovato")

          v1_before = copy.deepcopy(portfolios[v1_index])
          v2 = copy.deepcopy(v1_before)
          v2.update(
              {
                  "name": V2_NAME,
                  "enabled": True,
                  "is_main": False,
                  "strategy": "relative_strength_v2",
                  "timeframe_minutes": 60,
                  "minimum_abs_score": 5.5,
                  "minimum_relative_strength_pct": 3.0,
                  "minimum_adx": 18.0,
                  "long_rsi_min": 52.0,
                  "long_rsi_max": 72.0,
                  "short_rsi_min": 28.0,
                  "short_rsi_max": 48.0,
                  "require_ema_alignment": True,
                  "require_short_and_medium_return_alignment": True,
                  "excluded_regimes": ["RANGE_HIGH_VOL"],
                  "block_short_in_broad_bullish_market": True,
                  "broad_bullish_btc_trend_score": 2.0,
                  "broad_bullish_breadth_above_ema50_pct": 55.0,
                  "broad_bullish_alt_relative_median_pct": 0.0,
                  "max_signals_per_candle_side": 2,
                  "research_version": 2,
              }
          )

          portfolios = [row for row in portfolios if row.get("name") != V2_NAME]
          v1_index = next(
              index for index, row in enumerate(portfolios) if row.get("name") == V1_NAME
          )
          portfolios.insert(v1_index + 1, v2)
          config["portfolios"] = portfolios

          current_v1 = next(row for row in portfolios if row.get("name") == V1_NAME)
          if current_v1 != v1_before:
              raise RuntimeError("La V1 è stata modificata accidentalmente")

          config_path.write_text(
              json.dumps(config, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          # 2) Signal engine: strict V2 filters, current regime and two candidates per side/candle.
          engine_path = "paper_signal_engine.py"
          engine = read(engine_path)

          import_line = "from market_regime_tagger import classify_market_regime\n"
          if import_line not in engine:
              anchor = "from paper_rsi_extreme_scalping import extreme_reversal_setup\n"
              engine = replace_once(
                  engine,
                  anchor,
                  anchor + import_line,
                  "import classificatore regime",
              )

          if "# RELATIVE_STRENGTH_V2_RULES_V1" not in engine:
              start = engine.find("def strategy_accepts(\n")
              end = engine.find("\ndef generate_signals(\n", start)
              if start < 0 or end < 0:
                  raise RuntimeError("Funzione strategy_accepts non trovata")

              new_block = r'''# RELATIVE_STRENGTH_V2_RULES_V1
          def relative_strength_v2_accepts(
              side: str,
              features: dict[str, Any],
              portfolio: dict[str, Any],
              market_context: dict[str, Any],
          ) -> bool:
              relative = (
                  0.65 * float(features["relative_medium_pct"])
                  + 0.35 * float(features["relative_long_pct"])
              )
              minimum_relative = float(
                  portfolio.get("minimum_relative_strength_pct", 3.0)
              )
              adx_value = float(features["adx14"])
              minimum_adx = float(portfolio.get("minimum_adx", 18.0))
              if adx_value < minimum_adx:
                  return False

              regime = str(
                  market_context.get("regime", "UNKNOWN")
              ).upper()
              excluded = {
                  str(value).upper()
                  for value in portfolio.get(
            "excluded_regimes",
            ["RANGE_HIGH_VOL"],
                  )
              }
              if regime in excluded:
                  return False

              price = float(features["price"])
              ema20_value = float(features["ema20"])
              ema50_value = float(features["ema50"])
              rsi_value = float(features["rsi14"])
              ret_short = float(features["ret_short_pct"])
              ret_medium = float(features["ret_medium_pct"])

              if side == "LONG":
                  return (
            relative >= minimum_relative
            and price > ema20_value > ema50_value
            and ret_short > 0.0
            and ret_medium > 0.0
            and float(portfolio.get("long_rsi_min", 52.0))
            <= rsi_value
            <= float(portfolio.get("long_rsi_max", 72.0))
                  )

              context_features = dict(
                  market_context.get("features", {})
              )
              broad_bullish = (
                  float(context_features.get("btc_trend_score", 0.0))
                  >= float(
            portfolio.get(
                "broad_bullish_btc_trend_score",
                2.0,
            )
                  )
                  and float(
            context_features.get(
                "breadth_above_ema50_pct",
                0.0,
            )
                  )
                  >= float(
            portfolio.get(
                "broad_bullish_breadth_above_ema50_pct",
                55.0,
            )
                  )
                  and float(
            context_features.get(
                "alt_relative_median_pct",
                0.0,
            )
                  )
                  >= float(
            portfolio.get(
                "broad_bullish_alt_relative_median_pct",
                0.0,
            )
                  )
              )
              if (
                  portfolio.get(
            "block_short_in_broad_bullish_market",
            True,
                  )
                  and broad_bullish
              ):
                  return False

              return (
                  relative <= -minimum_relative
                  and price < ema20_value < ema50_value
                  and ret_short < 0.0
                  and ret_medium < 0.0
                  and float(portfolio.get("short_rsi_min", 28.0))
                  <= rsi_value
                  <= float(portfolio.get("short_rsi_max", 48.0))
              )


          def apply_signal_caps(
              signals: list[Signal],
              config: dict[str, Any],
          ) -> list[Signal]:
              definitions = {
                  str(row.get("name")): row
                  for row in config.get("portfolios", [])
              }
              keep: set[int] = set()
              groups: dict[
                  tuple[str, str, str],
                  list[tuple[int, Signal]],
              ] = {}

              for index, signal in enumerate(signals):
                  definition = definitions.get(
            str(signal.portfolio),
            {},
                  )
                  limit = int(
            definition.get(
                "max_signals_per_candle_side",
                0,
            )
            or 0
                  )
                  if limit <= 0:
            keep.add(index)
            continue
                  key = (
            str(signal.portfolio),
            str(signal.candle_time),
            str(signal.side),
                  )
                  groups.setdefault(key, []).append(
            (index, signal)
                  )

              for rows in groups.values():
                  limit = int(
            definitions[
                str(rows[0][1].portfolio)
            ].get(
                "max_signals_per_candle_side",
                0,
            )
                  )
                  ranked = sorted(
            rows,
            key=lambda item: (
                abs(
                    float(
                        item[1].relative_strength_score
                    )
                ),
                abs(float(item[1].score)),
                str(item[1].asset),
            ),
            reverse=True,
                  )
                  keep.update(
            index
            for index, _ in ranked[:limit]
                  )

              return [
                  signal
                  for index, signal in enumerate(signals)
                  if index in keep
              ]


          def strategy_accepts(
              strategy: str,
              side: str,
              features: dict[str, Any],
              score: float,
              portfolio: dict[str, Any] | None = None,
              market_context: dict[str, Any] | None = None,
          ) -> bool:
              if strategy == "momentum_breakout":
                  return (
            features["breakout_state"]
            == ("UP" if side == "LONG" else "DOWN")
            or abs(features["ret_short_pct"]) >= 1.5
                  )
              if strategy == "relative_strength":
                  relative = (
            0.65 * features["relative_medium_pct"]
            + 0.35 * features["relative_long_pct"]
                  )
                  return (
            relative >= 2.0
            if side == "LONG"
            else relative <= -2.0
                  )
              if strategy == "relative_strength_v2":
                  return relative_strength_v2_accepts(
            side,
            features,
            portfolio or {},
            market_context or {},
                  )
              if strategy == "rsi_extreme_reversal":
                  return bool(features.get("extreme_accepted"))
              return True
          '''
              engine = engine[:start] + new_block.rstrip() + "\n\n" + engine[end + 1 :]

          if "market_context = classify_market_regime(bundle)" not in engine:
              engine = replace_once(
                  engine,
                  "    signals: list[Signal] = []\n",
                  (
                      "    signals: list[Signal] = []\n"
                      "    market_context = classify_market_regime(bundle)\n"
                  ),
                  "contesto di regime corrente",
              )

          old_call = '''            if not strategy_accepts(
                strategy,
                side,
                features,
                score,
            ):
          '''
          new_call = '''            if not strategy_accepts(
                strategy,
                side,
                features,
                score,
                portfolio,
                market_context,
            ):
          '''
          engine = replace_once(
              engine,
              old_call,
              new_call,
              "chiamata filtri V2",
          )

          old_group = '''            experiment_group = deterministic_id(
                asset,
                timeframe,
                candle_time,
                side,
                "market_event",
            )
            signal_id = deterministic_id(
                portfolio["name"],
                strategy,
                experiment_group,
            )
          '''
          new_group = '''            if strategy == "relative_strength_v2":
                experiment_group = deterministic_id(
                    timeframe,
                    candle_time,
                    side,
                    "relative_strength_v2_market_episode",
                )
                signal_id = deterministic_id(
                    portfolio["name"],
                    strategy,
                    asset,
                    experiment_group,
                )
            else:
                experiment_group = deterministic_id(
                    asset,
                    timeframe,
                    candle_time,
                    side,
                    "market_event",
                )
                signal_id = deterministic_id(
                    portfolio["name"],
                    strategy,
                    experiment_group,
                )
          '''
          engine = replace_once(
              engine,
              old_group,
              new_group,
              "episodi indipendenti V2",
          )

          if engine.rstrip().endswith("return signals"):
              engine = (
                  engine.rstrip()[: -len("return signals")]
                  + "return apply_signal_caps(signals, config)\n"
              )
          elif not engine.rstrip().endswith(
              "return apply_signal_caps(signals, config)"
          ):
              raise RuntimeError("Ritorno finale generate_signals non riconosciuto")

          write(engine_path, engine)

          # 3) Human-readable labels in the paper report.
          display_path = "paper_trading_display.py"
          display = read(display_path)
          if '"SHADOW_RELATIVE_STRENGTH_V2": "Forza relativa 1H V2",' not in display:
              display = replace_once(
                  display,
                  '    "SHADOW_RELATIVE_STRENGTH": "Forza relativa 1H",\n',
                  (
                      '    "SHADOW_RELATIVE_STRENGTH": "Forza relativa 1H V1",\n'
                      '    "SHADOW_RELATIVE_STRENGTH_V2": "Forza relativa 1H V2",\n'
                  ),
                  "etichette portafogli V1/V2",
              )
          elif '"SHADOW_RELATIVE_STRENGTH": "Forza relativa 1H",' in display:
              display = display.replace(
                  '"SHADOW_RELATIVE_STRENGTH": "Forza relativa 1H",',
                  '"SHADOW_RELATIVE_STRENGTH": "Forza relativa 1H V1",',
                  1,
              )

          if '"SHADOW_RELATIVE_STRENGTH_V2": (' not in display:
              old_description = '''    "SHADOW_RELATIVE_STRENGTH": (
                  "Test a 1 ora che seleziona forza o debolezza rispetto a Bitcoin."
              ),
          '''
              new_description = '''    "SHADOW_RELATIVE_STRENGTH": (
                  "Versione originale V1 a 1 ora basata sulla forza o debolezza rispetto a Bitcoin."
              ),
              "SHADOW_RELATIVE_STRENGTH_V2": (
                  "Versione V2 più selettiva: forza vs BTC, trend USDT, RSI, ADX, regime e massimo due segnali per direzione nella stessa candela."
              ),
          '''
              display = replace_once(
                  display,
                  old_description,
                  new_description,
                  "descrizioni V1/V2",
              )

          if '"relative_strength_v2": "Forza relativa vs BTC V2",' not in display:
              display = replace_once(
                  display,
                  '    "relative_strength": "Forza relativa vs BTC",\n',
                  (
                      '    "relative_strength": "Forza relativa vs BTC V1",\n'
                      '    "relative_strength_v2": "Forza relativa vs BTC V2",\n'
                  ),
                  "etichette strategie V1/V2",
              )
          write(display_path, display)

          # 4) Telegram research milestones: V1 and V2 are separate samples.
          watch_path = "research_sample_watch.py"
          watch = read(watch_path)
          if '    "SHADOW_RELATIVE_STRENGTH_V2",\n' not in watch:
              watch = replace_once(
                  watch,
                  '    "SHADOW_RELATIVE_STRENGTH",\n',
                  (
                      '    "SHADOW_RELATIVE_STRENGTH",\n'
                      '    "SHADOW_RELATIVE_STRENGTH_V2",\n'
                  ),
                  "profilo V2 negli avvisi research",
              )
          if '"SHADOW_RELATIVE_STRENGTH_V2": "Forza relativa 1H V2",' not in watch:
              watch = replace_once(
                  watch,
                  '    "SHADOW_RELATIVE_STRENGTH": "Forza relativa 1H",\n',
                  (
                      '    "SHADOW_RELATIVE_STRENGTH": "Forza relativa 1H V1",\n'
                      '    "SHADOW_RELATIVE_STRENGTH_V2": "Forza relativa 1H V2",\n'
                  ),
                  "etichette avvisi V1/V2",
              )
          write(watch_path, watch)

          # 5) Research report: show friendly V1/V2 names, one under the other.
          research_path = "research_all_signals.py"
          research = read(research_path)
          if "# RESEARCH_PROFILE_LABELS_V2" not in research:
              anchor = '''def profile_name(portfolio: str) -> str:
              raw = str(portfolio)
              if raw.startswith("SHADOW_RSI_LONG_"):
                  return "RSI_EXTREME_LONG_15M"
              if raw.startswith("SHADOW_RSI_SHORT_"):
                  return "RSI_EXTREME_SHORT_15M"
              return raw
          '''
              addition = anchor + '''

          # RESEARCH_PROFILE_LABELS_V2
          def research_profile_label(profile: Any) -> str:
              labels = {
                  "SHADOW_RELATIVE_STRENGTH": "Forza relativa 1H V1",
                  "SHADOW_RELATIVE_STRENGTH_V2": "Forza relativa 1H V2",
              }
              return labels.get(str(profile), str(profile))
          '''
              research = replace_once(
                  research,
                  anchor,
                  addition,
                  "etichette report research",
              )
              research = research.replace(
                  'f"| {row[\'profile\']} |',
                  'f"| {research_profile_label(row[\'profile\'])} |',
              )
          write(research_path, research)

          # 6) Keep state/report portfolio order aligned with config order.
          state_engine_path = "paper_trading_engine.py"
          state_engine = read(state_engine_path)
          if "# CONFIG_PORTFOLIO_ORDER_V1" not in state_engine:
              old_tail = '''    state["config_snapshot"] = public_config_snapshot(config)
              return state
          '''
              new_tail = '''    # CONFIG_PORTFOLIO_ORDER_V1
              existing_portfolios = dict(
                  state.setdefault("portfolios", {})
              )
              ordered_portfolios: dict[str, Any] = {}
              for definition in config.get("portfolios", []):
                  if not definition.get("enabled", True):
            continue
                  name = str(definition.get("name", ""))
                  if name in existing_portfolios:
            ordered_portfolios[name] = existing_portfolios[name]
              for name, value in existing_portfolios.items():
                  if name not in ordered_portfolios:
            ordered_portfolios[name] = value
              state["portfolios"] = ordered_portfolios
              state["config_snapshot"] = public_config_snapshot(config)
              return state
          '''
              state_engine = replace_once(
                  state_engine,
                  old_tail,
                  new_tail,
                  "ordine portafogli nel report",
              )
          write(state_engine_path, state_engine)

          print("Forza relativa 1H V2 preparata senza modificare la V1.")
          PY

          python /tmp/apply_relative_strength_v2.py

      - name: Validate V1 and V2
        shell: bash
        run: |
          python -m py_compile \
            paper_signal_engine.py \
            paper_trading_display.py \
            research_sample_watch.py \
            research_all_signals.py \
            paper_trading_engine.py

          python - <<'PY'
          from paper_signal_engine import (
              Signal,
              apply_signal_caps,
              strategy_accepts,
          )
          from paper_trading_config import load_config
          from paper_trading_display import portfolio_label
          from research_sample_watch import CORE_PROFILES, PROFILE_LABELS

          config = load_config()
          portfolios = {
              row["name"]: row
              for row in config["portfolios"]
          }
          assert "SHADOW_RELATIVE_STRENGTH" in portfolios
          assert "SHADOW_RELATIVE_STRENGTH_V2" in portfolios
          assert portfolios["SHADOW_RELATIVE_STRENGTH"]["strategy"] == "relative_strength"
          assert portfolios["SHADOW_RELATIVE_STRENGTH"]["minimum_abs_score"] == 4.0
          assert portfolios["SHADOW_RELATIVE_STRENGTH_V2"]["strategy"] == "relative_strength_v2"
          assert portfolios["SHADOW_RELATIVE_STRENGTH_V2"]["minimum_abs_score"] == 5.5

          v2 = portfolios["SHADOW_RELATIVE_STRENGTH_V2"]
          normal_context = {
              "regime": "RANGE",
              "features": {
                  "btc_trend_score": 0.0,
                  "breadth_above_ema50_pct": 35.0,
                  "alt_relative_median_pct": -0.5,
              },
          }
          long_features = {
              "relative_medium_pct": 4.0,
              "relative_long_pct": 3.0,
              "adx14": 22.0,
              "price": 110.0,
              "ema20": 105.0,
              "ema50": 100.0,
              "rsi14": 60.0,
              "ret_short_pct": 1.0,
              "ret_medium_pct": 3.0,
              "breakout_state": "UP",
          }
          assert strategy_accepts(
              "relative_strength_v2",
              "LONG",
              long_features,
              7.0,
              v2,
              normal_context,
          )
          high_vol = dict(normal_context)
          high_vol["regime"] = "RANGE_HIGH_VOL"
          assert not strategy_accepts(
              "relative_strength_v2",
              "LONG",
              long_features,
              7.0,
              v2,
              high_vol,
          )

          short_features = {
              "relative_medium_pct": -4.0,
              "relative_long_pct": -3.0,
              "adx14": 23.0,
              "price": 90.0,
              "ema20": 95.0,
              "ema50": 100.0,
              "rsi14": 40.0,
              "ret_short_pct": -1.0,
              "ret_medium_pct": -3.0,
              "breakout_state": "DOWN",
          }
          broad_bullish = {
              "regime": "TREND_UP",
              "features": {
                  "btc_trend_score": 3.0,
                  "breadth_above_ema50_pct": 70.0,
                  "alt_relative_median_pct": 1.0,
              },
          }
          assert not strategy_accepts(
              "relative_strength_v2",
              "SHORT",
              short_features,
              -7.0,
              v2,
              broad_bullish,
          )

          def candidate(asset: str, relative: float) -> Signal:
              return Signal(
                  signal_id=f"id-{asset}",
                  experiment_group_id="episode",
                  portfolio="SHADOW_RELATIVE_STRENGTH_V2",
                  is_main=False,
                  strategy="relative_strength_v2",
                  asset=asset,
                  symbol=f"{asset}-USDT",
                  timeframe_minutes=60,
                  candle_time="2026-07-16T18:00:00+00:00",
                  side="LONG",
                  score=6.0,
                  confidence="BUONA",
                  entry_reference_price=100.0,
                  atr_pct=1.0,
                  stop_pct=0.02,
                  target_pct=0.044,
                  leverage=2.0,
                  max_holding_hours=168,
                  trailing_at_r=1.1,
                  trailing_atr_multiple=1.5,
                  reason="test",
                  relative_strength_score=relative,
                  breakout_state="UP",
                  global_overlay=0.0,
                  exchange_overlay=0.0,
              )

          limited = apply_signal_caps(
              [
                  candidate("AAA", 3.1),
                  candidate("BBB", 5.0),
                  candidate("CCC", 4.0),
              ],
              config,
          )
          assert [row.asset for row in limited] == ["BBB", "CCC"]
          assert portfolio_label("SHADOW_RELATIVE_STRENGTH") == "Forza relativa 1H V1"
          assert portfolio_label("SHADOW_RELATIVE_STRENGTH_V2") == "Forza relativa 1H V2"
          assert "SHADOW_RELATIVE_STRENGTH_V2" in CORE_PROFILES
          assert PROFILE_LABELS["SHADOW_RELATIVE_STRENGTH_V2"] == "Forza relativa 1H V2"

          print("Validazione V1/V2 completata.")
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            paper_trading_config.json \
            paper_signal_engine.py \
            paper_trading_display.py \
            research_sample_watch.py \
            research_all_signals.py \
            paper_trading_engine.py

          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare: V2 già installata."
          else
            git commit -m "Add Relative Strength 1H V2 research account"
            git push
          fi
