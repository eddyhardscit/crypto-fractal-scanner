name: Manual install scanner ranking paper family

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-install-scanner-ranking-paper-family
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Patch scanner-family logic and labels
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import base64
          from pathlib import Path

          patch_sets = {'engine': [('ZGVmIHN0cmF0ZWd5X2FjY2VwdHMoCg==', ''), ('ICAgIGJ0Y19mcmFtZXMgPSBmcmFtZXMuZ2V0KCJCVEMiLCB7fSkKICAgIHNpZ25hbHM6IGxpc3RbU2lnbmFsXSA9IFtdCg==', ''), ('ICAgICAgICAgICAgYmVuY2htYXJrX3N0cmF0ZWdpZXMgPSB7CiAgICAgICAgICAgICAgICAiZG9uY2hpYW5fYnJlYWtvdXQiLAogICAgICAgICAgICAgICAgImJvbGxpbmdlcl9tZWFuX3JldmVyc2lvbiIsCiAgICAgICAgICAgICAgICAiZW1hX3RyZW5kX2ZvbGxvd2luZyIsCiAgICAgICAgICAgIH0KICAgICAgICAgICAgaWYgc3RyYXRlZ3kgaW4gYmVuY2htYXJrX3N0cmF0ZWdpZXM6Cg==', ''), ('ICAgICAgICAgICAgaWYgc3RyYXRlZ3kgaW4gYmVuY2htYXJrX3N0cmF0ZWdpZXM6CiAgICAgICAgICAgICAgICByZWFzb24gPSAiOyAiLmpvaW4ocmVhc29ucykKICAgICAgICAgICAgICAgIHNpZ25hbF9nbG9iYWxfb3ZlcmxheSA9IDAuMAogICAgICAgICAgICAgICAgc2lnbmFsX2V4Y2hhbmdlX292ZXJsYXkgPSAwLjAKICAgICAgICAgICAgZWxzZToK', '')], 'display': [('ICAgICJTSEFET1dfRU1BX1RSRU5EXzFIIjogIkJlbmNobWFyayB0cmVuZCBmb2xsb3dpbmcgRU1BIDFIIiwKfQo=', ''), ('ICAgICJTSEFET1dfRU1BX1RSRU5EXzFIIjogKAogICAgICAgICJCZW5jaG1hcmsgcHVybzogdHJlbmQgZm9sbG93aW5nIGNvbiBwcmV6em8sIEVNQTIwLCBFTUE1MCBlIGZpbHRybyBBRFguIgogICAgKSwKfQo=', ''), ('ICAgICJlbWFfdHJlbmRfZm9sbG93aW5nIjogIlRyZW5kIGZvbGxvd2luZyBFTUEiLAp9Cg==', '')]}

          for filename, replacements in (
              ("paper_signal_engine.py", patch_sets["engine"]),
              ("paper_trading_display.py", patch_sets["display"]),
          ):
              path = Path(filename)
              source = path.read_text(encoding="utf-8")

              for old_encoded, new_encoded in replacements:
                  old = base64.b64decode(old_encoded).decode("utf-8")
                  new = base64.b64decode(new_encoded).decode("utf-8")

                  if new in source:
                      continue
                  if old not in source:
                      raise SystemExit(
                          f"{filename}: expected patch block not found"
                      )
                  source = source.replace(old, new, 1)

              ast.parse(source, filename=filename)
              path.write_text(source, encoding="utf-8")
          PY

      - name: Add four scanner-family portfolios
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("paper_trading_config.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          portfolios = list(config.get("portfolios", []))

          if len([p for p in portfolios if p.get("enabled", True)]) != 26:
              raise SystemExit(
                  "Attesi 26 conti attivi prima dell'installazione."
              )

          protected_before = {
              p["name"]: json.dumps(p, sort_keys=True)
              for p in portfolios
          }

          additions = [
              {
                  "name": "SHADOW_SCANNER_TOP5_LONG",
                  "enabled": True,
                  "is_main": False,
                  "strategy": "scanner_top5_long",
                  "timeframe_minutes": 60,
                  "minimum_abs_score": 5.0,
                  "scanner_top_n": 5,
                  "minimum_scanner_rank_score": 1.0,
                  "atr_stop_multiple": 1.8,
                  "reward_risk": 2.0,
                  "leverage": 2.0,
                  "max_holding_hours": 120,
                  "allow_long": True,
                  "allow_short": False,
                  "trailing_at_r": 1.0,
                  "trailing_atr_multiple": 1.4,
                  "max_open_positions": 3,
                  "max_same_direction_positions": 3
              },
              {
                  "name": "SHADOW_SCANNER_BOTTOM5_SHORT",
                  "enabled": True,
                  "is_main": False,
                  "strategy": "scanner_bottom5_short",
                  "timeframe_minutes": 60,
                  "minimum_abs_score": 5.0,
                  "scanner_top_n": 5,
                  "maximum_scanner_rank_score": -1.0,
                  "atr_stop_multiple": 1.8,
                  "reward_risk": 2.0,
                  "leverage": 2.0,
                  "max_holding_hours": 120,
                  "allow_long": False,
                  "allow_short": True,
                  "trailing_at_r": 1.0,
                  "trailing_atr_multiple": 1.4,
                  "max_open_positions": 3,
                  "max_same_direction_positions": 3
              },
              {
                  "name": "SHADOW_SCANNER_TOP5_BTC",
                  "enabled": True,
                  "is_main": False,
                  "strategy": "scanner_top5_btc_strength",
                  "timeframe_minutes": 60,
                  "minimum_abs_score": 5.0,
                  "scanner_top_n": 5,
                  "minimum_scanner_rank_score": 1.0,
                  "minimum_relative_strength_pct": 0.5,
                  "atr_stop_multiple": 1.8,
                  "reward_risk": 2.2,
                  "leverage": 2.0,
                  "max_holding_hours": 144,
                  "allow_long": True,
                  "allow_short": False,
                  "trailing_at_r": 1.1,
                  "trailing_atr_multiple": 1.4,
                  "max_open_positions": 3,
                  "max_same_direction_positions": 3
              },
              {
                  "name": "SHADOW_GLOBAL_PURE",
                  "enabled": True,
                  "is_main": False,
                  "strategy": "global_confluence_pure",
                  "timeframe_minutes": 60,
                  "minimum_abs_score": 5.0,
                  "minimum_global_score": 4.0,
                  "minimum_exchange_alignment": 0.0,
                  "atr_stop_multiple": 2.0,
                  "reward_risk": 2.5,
                  "leverage": 2.0,
                  "max_holding_hours": 168,
                  "allow_long": True,
                  "allow_short": True,
                  "trailing_at_r": 1.2,
                  "trailing_atr_multiple": 1.5,
                  "max_open_positions": 3,
                  "max_same_direction_positions": 2
              }
          ]

          by_name = {
              str(p.get("name", "")): p
              for p in portfolios
          }
          order = [
              str(p.get("name", ""))
              for p in portfolios
              if str(p.get("name", ""))
          ]

          for addition in additions:
              by_name[addition["name"]] = addition

          updated = [by_name[name] for name in order]
          for addition in additions:
              if addition["name"] not in order:
                  updated.append(addition)

          for name, serialized in protected_before.items():
              current = next(
                  p for p in updated
                  if p.get("name") == name
              )
              if json.dumps(current, sort_keys=True) != serialized:
                  raise SystemExit(
                      f"Conto esistente modificato: {name}"
                  )

          enabled = [
              p for p in updated if p.get("enabled", True)
          ]
          if len(enabled) != 30:
              raise SystemExit(
                  f"Attesi 30 conti, trovati {len(enabled)}"
              )
          if len({p["name"] for p in enabled}) != 30:
              raise SystemExit("Nomi conto duplicati.")

          config["portfolios"] = updated
          path.write_text(
              json.dumps(config, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("PASS: 26 conti esistenti + 4 scanner = 30")
          PY

      - name: Validate scanner family
        shell: bash
        run: |
          python -m pip install numpy pandas requests
          python -m py_compile             paper_signal_engine.py             paper_trading_display.py             paper_trading_engine.py             paper_trading_report.py             paper_trading_comparative_report.py

          python - <<'PY'
          import json
          from pathlib import Path

          from paper_signal_engine import (
              build_live_scanner_ranking,
              scanner_family_score,
          )
          from paper_trading_display import (
              portfolio_description,
              portfolio_label,
              strategy_label,
          )

          config = json.loads(
              Path("paper_trading_config.json").read_text(
                  encoding="utf-8"
              )
          )
          enabled = [
              p for p in config["portfolios"]
              if p.get("enabled", True)
          ]
          required = {
              "SHADOW_SCANNER_TOP5_LONG",
              "SHADOW_SCANNER_BOTTOM5_SHORT",
              "SHADOW_SCANNER_TOP5_BTC",
              "SHADOW_GLOBAL_PURE",
          }

          assert len(enabled) == 30
          assert len({p["name"] for p in enabled}) == 30
          assert required.issubset(
              {p["name"] for p in enabled}
          )

          fixture = {
              "AAA": {
                  "price": 120.0,
                  "ema20": 115.0,
                  "ema50": 110.0,
                  "ema200": 90.0,
                  "rsi14": 60.0,
                  "adx14": 25.0,
                  "volume_ratio": 1.8,
                  "ret_short_pct": 4.0,
                  "ret_medium_pct": 8.0,
                  "ret_long_pct": 15.0,
                  "relative_medium_pct": 5.0,
                  "relative_long_pct": 8.0,
                  "breakout_state": "UP",
              },
              "BBB": {
                  "price": 80.0,
                  "ema20": 85.0,
                  "ema50": 90.0,
                  "ema200": 100.0,
                  "rsi14": 38.0,
                  "adx14": 24.0,
                  "volume_ratio": 1.6,
                  "ret_short_pct": -4.0,
                  "ret_medium_pct": -8.0,
                  "ret_long_pct": -12.0,
                  "relative_medium_pct": -6.0,
                  "relative_long_pct": -9.0,
                  "breakout_state": "DOWN",
              },
          }
          ranking = build_live_scanner_ranking(fixture)
          assert ranking[0]["asset"] == "AAA"
          assert ranking[-1]["asset"] == "BBB"

          for name in sorted(required):
              assert portfolio_label(name)
              assert portfolio_description(name)
              print(portfolio_label(name))

          for strategy in (
              "scanner_top5_long",
              "scanner_bottom5_short",
              "scanner_top5_btc_strength",
              "global_confluence_pure",
          ):
              assert strategy_label(strategy)

          print("PASS: scanner family installed and isolated")
          PY

          git diff --check

      - name: Commit scanner family
        run: |
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             paper_signal_engine.py             paper_trading_config.json             paper_trading_display.py

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Scanner ranking family already installed."
          else
            git commit -m "Add scanner ranking paper strategies"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
