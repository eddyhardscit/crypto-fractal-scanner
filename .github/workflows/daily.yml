name: Daily Crypto Fractal Scanner

on:
  schedule:
    - cron: "37 10 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install tabulate

      - name: Run scanner
        run: python scanner.py

      - name: Run liquidations report
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
        run: python liquidations_report.py

      - name: Commit reports
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add reports/
          git commit -m "Update daily crypto scanner reports" || echo "No changes to commit"
          git push

      - name: Send email
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REPORT_URL: https://github.com/eddyhardscit/crypto-fractal-scanner/blob/main/reports/latest_report.md
          LIQ_REPORT_URL: https://github.com/eddyhardscit/crypto-fractal-scanner/blob/main/reports/liquidation_report.md
        run: python send_email.py
