name: Daily Crypto Fractal Scanner

on:
  schedule:
    # 14:18 ora italiana/spagnola estiva = 12:18 UTC
    # Formato cron: minuto ora giorno mese giorno-settimana
    - cron: "18 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install tabulate

      - name: Run scanner
        run: python scanner.py

      - name: Run calibration status report
        run: python calibration_status_report.py

      - name: Run liquidations report
        run: python liquidations_report.py

      - name: Run daily change report
        run: python daily_change_report.py

      - name: Run bounce after drawdown report
        run: python bounce_after_drawdown_report.py

      - name: Run decision report
        run: python decision_report.py

      - name: Run BTC 2022 vs SOL 2026 fractal report
        run: python btc_2022_vs_sol_2026_report.py

      - name: Run RSI top-cycle report
        run: python rsi_top_cycle_report.py

      - name: Run market regime match report
        run: python market_regime_match_report.py

      - name: Run technical structure report
        run: python technical_structure_report.py

      - name: Commit reports
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add reports/
          git commit -m "Update daily crypto scanner reports" || echo "No changes to commit"
          git push

      - name: Send email
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REPORT_URL: https://github.com/eddyhardscit/crypto-fractal-scanner/blob/main/reports/latest_report.md
          LIQ_REPORT_URL: https://github.com/eddyhardscit/crypto-fractal-scanner/blob/main/reports/liquidation_report.md
        run: python send_email.py
