name: Fix Open Positions Risk Labels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install paper-trading dependencies
        run: python -m pip install -r requirements-paper-trading.txt

      - name: Correct protected-stop risk labels
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/fix_open_position_risk.py
          python /tmp/fix_open_position_risk.py

      - name: Validate correction
        shell: bash
        run: |
          python -m py_compile paper_trading_open_positions_notify.py

          python - <<'PY'
          from paper_trading_open_positions_notify import _risk_assessment

          evaa = {
              "side": "SHORT",
              "entry_price": 0.92491498,
              "stop_price": 0.92491498,
              "margin_eur": 208.21,
              "leverage": 2,
              "atr_pct": 100.0,
          }
          label, reason = _risk_assessment(evaa, 83.25, 24.99)
          assert label == "🟢 BREAK-EVEN", (label, reason)
          assert "profitto aperto non ancora bloccato" in reason

          protected_short = {
              **evaa,
              "stop_price": 0.85,
          }
          label, reason = _risk_assessment(
              protected_short,
              83.25,
              14.86,
          )
          assert label == "🟢 PROFITTO PROTETTO", (label, reason)

          protected_long = {
              "side": "LONG",
              "entry_price": 100.0,
              "stop_price": 104.0,
              "margin_eur": 500.0,
              "leverage": 3,
              "atr_pct": 3.0,
          }
          label, reason = _risk_assessment(
              protected_long,
              40.0,
              4.0,
          )
          assert label == "🟢 PROFITTO PROTETTO", (label, reason)

          close_unprotected_stop = {
              "side": "LONG",
              "entry_price": 100.0,
              "stop_price": 95.0,
              "margin_eur": 500.0,
              "leverage": 3,
              "atr_pct": 3.0,
          }
          label, reason = _risk_assessment(
              close_unprotected_stop,
              -5.0,
              0.8,
          )
          assert label == "🔴 ALTO", (label, reason)

          malformed_atr = {
              "side": "SHORT",
              "entry_price": 1.0,
              "stop_price": 1.3,
              "margin_eur": 200.0,
              "leverage": 2,
              "atr_pct": 100.0,
          }
          label, reason = _risk_assessment(
              malformed_atr,
              10.0,
              25.0,
          )
          assert label == "🟢 BASSO", (label, reason)

          print("Test etichette rischio superato.")
          PY

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add paper_trading_open_positions_notify.py

          if git diff --cached --quiet; then
            echo "Correzione rischio già installata."
          else
            git commit -m "Fix protected stop risk labels"
            git push origin HEAD:main
          fi
