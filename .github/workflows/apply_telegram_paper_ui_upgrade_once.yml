name: Apply Telegram Paper UI Upgrade Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate uploaded helper
        run: |
          set -euxo pipefail
          test -f paper_trading_event_enrichment.py
          python -m py_compile paper_trading_event_enrichment.py

      - name: Patch runner and notifier
        run: |
          python - <<'PY'
          from pathlib import Path
          runner_path = Path("paper_trading_runner.py")
          notify_path = Path("paper_trading_notify.py")
          runner = runner_path.read_text(encoding="utf-8")
          notify = notify_path.read_text(encoding="utf-8")

          runner_import = "from paper_trading_event_enrichment import enrich_opened_positions\n"
          if runner_import not in runner:
              anchor = "from paper_trading_live_publish import publish_markdown\n"
              if anchor not in runner:
                  raise SystemExit("Runner import anchor non trovato")
              runner = runner.replace(anchor, anchor + runner_import, 1)

          if "TELEGRAM_OPENING_PNL_ENRICHMENT_V1" not in runner:
              anchor = "    after = _position_snapshot(state, bundle)\n    summary[\"trailing_updates\"] = _trailing_updates(before, after)\n"
              if anchor not in runner:
                  raise SystemExit("Runner enrichment anchor non trovato")
              runner = runner.replace(anchor, anchor + "    # TELEGRAM_OPENING_PNL_ENRICHMENT_V1\n    enrich_opened_positions(summary, bundle, config)\n", 1)

          notify_import = "from paper_trading_event_enrichment import opening_status_lines\n"
          if notify_import not in notify:
              anchor = "import requests\n"
              if anchor not in notify:
                  raise SystemExit("Notifier import anchor non trovato")
              notify = notify.replace(anchor, anchor + "\n" + notify_import, 1)

          if "TELEGRAM_OPENING_STATUS_LINES_V1" not in notify:
              anchor = "                            f\"· Rischio massimo \"\n                            f\"{_fmt_eur(position.get('initial_risk_eur'))}\"\n                        ),\n"
              if anchor not in notify:
                  raise SystemExit("Notifier opening anchor non trovato")
              notify = notify.replace(anchor, anchor + "                        # TELEGRAM_OPENING_STATUS_LINES_V1\n                        *opening_status_lines(position),\n", 1)

          runner_path.write_text(runner, encoding="utf-8")
          notify_path.write_text(notify, encoding="utf-8")
          PY

      - name: Validate patched files
        run: |
          set -euxo pipefail
          python -m py_compile paper_trading_runner.py paper_trading_notify.py paper_trading_event_enrichment.py
          grep -q "TELEGRAM_OPENING_PNL_ENRICHMENT_V1" paper_trading_runner.py
          grep -q "TELEGRAM_OPENING_STATUS_LINES_V1" paper_trading_notify.py

      - name: Commit upgrade
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add paper_trading_runner.py paper_trading_notify.py paper_trading_event_enrichment.py
          git diff --cached --quiet || (git commit -m "Improve Telegram paper position status" && git push)
