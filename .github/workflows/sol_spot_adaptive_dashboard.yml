name: SOL Spot Adaptive Daily Dashboard

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sol-spot-adaptive-daily-dashboard
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      GITHUB_TOKEN: ${{ github.token }}
      SOL_SPOT_ADAPTIVE_RELEASE_TAG: sol-spot-adaptive-v1
      SOL_SPOT_ADAPTIVE_ASSET_NAME: sol-spot-adaptive-state.zip
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install numpy pandas requests

      - name: Validate dashboard
        run: |
          python -m py_compile \
            sol_spot_adaptive_dashboard.py \
            sol_spot_adaptive_storage.py

      - name: Restore dedicated SOL paper state
        run: python sol_spot_adaptive_storage.py restore

      - name: Generate dashboard and Telegram message
        run: python sol_spot_adaptive_dashboard.py

      - name: Publish dashboard reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            reports/sol_spot_adaptive_dashboard.md \
            reports/sol_spot_adaptive_dashboard.json

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Dashboard unchanged."
          else
            git commit -m "Update SOL spot adaptive dashboard"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: sol-spot-dashboard-${{ github.run_id }}
          path: |
            reports/sol_spot_adaptive_dashboard.md
            reports/sol_spot_adaptive_dashboard.json
          if-no-files-found: error
          retention-days: 30
