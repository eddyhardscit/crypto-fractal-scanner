name: Apply Automatic Paper Trading V1 Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install paper-trading dependencies
        run: python -m pip install -r requirements-paper-trading.txt

      - name: Run offline end-to-end self-test
        run: python paper_trading_selftest.py

      - name: Install paper-trading upgrade
        run: python install_paper_trading_upgrade.py

      - name: Compile installed Python files
        run: |
          python -m py_compile \
            paper_trading_config.py \
            kucoin_public_data.py \
            paper_signal_engine.py \
            paper_trading_engine.py \
            paper_trading_report.py \
            paper_trading_notify.py \
            paper_trading_runner.py \
            paper_trading_storage.py \
            paper_trading_selftest.py \
            install_paper_trading_upgrade.py \
            compact_latest_report.py

      - name: Commit automatic paper-trading upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            paper_trading_config.json \
            paper_trading_config.py \
            kucoin_public_data.py \
            paper_signal_engine.py \
            paper_trading_engine.py \
            paper_trading_report.py \
            paper_trading_notify.py \
            paper_trading_runner.py \
            paper_trading_storage.py \
            paper_trading_selftest.py \
            requirements-paper-trading.txt \
            install_paper_trading_upgrade.py \
            compact_latest_report.py \
            .gitignore \
            .github/workflows/daily.yml \
            .github/workflows/paper_trading_intraday.yml
          if git diff --cached --quiet; then
            echo "Paper trading already installed."
          else
            git commit -m "Add automatic KuCoin paper trading v1"
            git push
          fi
