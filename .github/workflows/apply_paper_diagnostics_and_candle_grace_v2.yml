name: Apply Paper Diagnostics and Candle Grace V2

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply paper fixes
        env:
          PAPER_PATCH_B64: ""
        run: |
          python -c 'import base64, os; exec(compile(base64.b64decode(os.environ["PAPER_PATCH_B64"]), "<paper-patch>", "exec"))'

      - name: Validate fixes
        run: |
          set -euxo pipefail
          python -m py_compile \
            paper_trading_storage.py \
            paper_trading_diagnostics.py \
            paper_trading_report.py
          python -c 'import json; from pathlib import Path; c=json.loads(Path("paper_trading_config.json").read_text()); e=c["execution"]; assert e["stale_data_minutes"]==25; assert e["candle_grace_minutes_by_timeframe"]=={"15":25,"60":45,"240":60}'
          grep -q "paper_trading_signal_diagnostics.json" paper_trading_storage.py
          grep -q "CANDLE_GRACE_BY_TIMEFRAME_V1" paper_trading_diagnostics.py
          grep -q "max_close_delay_minutes" paper_trading_diagnostics.py
          grep -q "Ritardo dopo chiusura" paper_trading_report.py
          grep -q "Ritardo chiusura" paper_trading_report.py

      - name: Commit fixes
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git add \
            paper_trading_storage.py \
            paper_trading_diagnostics.py \
            paper_trading_report.py \
            paper_trading_config.json

          if git diff --cached --quiet; then
            echo "Fixes already installed."
            exit 0
          fi

          git commit -m \
            "Persist diagnostics and extend candle grace"
          git pull --rebase origin main
          git push origin HEAD:main
