name: Apply Relative Strength V2 Once v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create Forza relativa 1H V2
        shell: bash
        run: |
          echo "" | base64 --decode > /tmp/apply_relative_strength_v2.py
          python /tmp/apply_relative_strength_v2.py

      - name: Validate V1 and V2
        shell: bash
        run: |
          python -m py_compile \
            paper_signal_engine.py \
            paper_trading_display.py \
            research_sample_watch.py \
            research_all_signals.py \
            paper_trading_engine.py

          python - <<'PYTEST'
          from paper_signal_engine import Signal, apply_signal_caps, relative_strength_v2_accepts
          from paper_trading_config import load_config
          from paper_trading_display import portfolio_label
          from research_sample_watch import CORE_PROFILES, PROFILE_LABELS

          config = load_config()
          portfolios = {row["name"]: row for row in config["portfolios"]}
          v1 = portfolios["SHADOW_RELATIVE_STRENGTH"]
          v2 = portfolios["SHADOW_RELATIVE_STRENGTH_V2"]
          assert v1["strategy"] == "relative_strength"
          assert v2["strategy"] == "relative_strength_v2"
          assert v2["minimum_abs_score"] == 5.5
          assert v2["minimum_relative_strength_pct"] == 3.0
          assert portfolio_label("SHADOW_RELATIVE_STRENGTH") == "Forza relativa 1H V1"
          assert portfolio_label("SHADOW_RELATIVE_STRENGTH_V2") == "Forza relativa 1H V2"
          assert "SHADOW_RELATIVE_STRENGTH_V2" in CORE_PROFILES
          assert PROFILE_LABELS["SHADOW_RELATIVE_STRENGTH_V2"] == "Forza relativa 1H V2"

          normal_context = {
              "regime": "RANGE",
              "features": {
                  "btc_trend_score": 0.0,
                  "breadth_above_ema50_pct": 40.0,
                  "alt_relative_median_pct": -0.2,
              },
          }
          long_features = {
              "relative_medium_pct": 4.0,
              "relative_long_pct": 3.0,
              "adx14": 22.0,
              "price": 110.0,
              "ema20": 105.0,
              "ema50": 100.0,
              "rsi14": 62.0,
              "ret_short_pct": 1.0,
              "ret_medium_pct": 3.0,
          }
          assert relative_strength_v2_accepts("LONG", long_features, v2, normal_context)
          blocked_context = {**normal_context, "regime": "RANGE_HIGH_VOL"}
          assert not relative_strength_v2_accepts("LONG", long_features, v2, blocked_context)

          def signal(asset: str, relative: float) -> Signal:
              return Signal(
                  signal_id=asset,
                  experiment_group_id="episode",
                  portfolio="SHADOW_RELATIVE_STRENGTH_V2",
                  is_main=False,
                  strategy="relative_strength_v2",
                  asset=asset,
                  symbol=asset + "-USDT",
                  timeframe_minutes=60,
                  candle_time="2026-07-16T12:00:00+00:00",
                  side="LONG",
                  score=6.0,
                  confidence="BUONA",
                  entry_reference_price=100.0,
                  atr_pct=2.0,
                  stop_pct=0.036,
                  target_pct=0.0792,
                  leverage=2.0,
                  max_holding_hours=168,
                  trailing_at_r=1.1,
                  trailing_atr_multiple=1.5,
                  reason="test",
                  relative_strength_score=relative,
                  breakout_state="NONE",
                  global_overlay=0.0,
                  exchange_overlay=0.0,
              )

          capped = apply_signal_caps(
              [signal("AAA", 3.1), signal("BBB", 4.5), signal("CCC", 3.8)],
              config,
          )
          assert [row.asset for row in capped] == ["BBB", "CCC"]
          print("Validazione V1/V2 completata")
          PYTEST

          git diff --check

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nessuna modifica necessaria: V2 già installata."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            paper_trading_config.json \
            paper_signal_engine.py \
            paper_trading_display.py \
            research_sample_watch.py \
            research_all_signals.py \
            paper_trading_engine.py
          git commit -m "Add Relative Strength 1H V2 research account"
          git push
