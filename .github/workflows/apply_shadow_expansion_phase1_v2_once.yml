name: Apply Shadow Expansion Phase 1 V2 Once

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply shadow expansion
        env:
          SHADOW_PATCH_B64: ""
        run: |
          python -c 'import base64, os; exec(compile(base64.b64decode(os.environ["SHADOW_PATCH_B64"]), "<shadow-expansion>", "exec"))'

      - name: Validate expansion
        run: |
          set -euxo pipefail
          python -m py_compile \
            paper_signal_engine.py \
            paper_trading_diagnostics.py

          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(
              Path("paper_trading_config.json").read_text(
                  encoding="utf-8"
              )
          )
          names = {
              row.get("name")
              for row in config.get("portfolios", [])
          }
          required = {
              "SHADOW_BTC_EMA_1H",
              "SHADOW_BTC_ADAPTIVE_4H",
              "SHADOW_SOL_DONCHIAN_1H",
              "SHADOW_SOL_BOLLINGER_4H",
              "SHADOW_ETH_ADAPTIVE_1H",
              "SHADOW_DOGE_BOLLINGER_1H",
          }
          assert required <= names
          assert len([
              name for name in names
              if str(name).startswith(
                  (
                      "SHADOW_BTC_",
                      "SHADOW_SOL_",
                      "SHADOW_ETH_",
                      "SHADOW_DOGE_",
                  )
              )
          ]) >= 24
          assert "ETH" in config["universe"]["mandatory_assets"]
          by_name = {
              row.get("name"): row
              for row in config.get("portfolios", [])
          }
          assert by_name["SHADOW_BTC_EMA_1H"]["leverage"] == 3.0
          assert by_name["SHADOW_BTC_EMA_1H"]["risk_per_trade_override"] == 0.005
          assert by_name["SHADOW_BTC_ADAPTIVE_4H"]["leverage"] == 2.0

          signal = Path("paper_signal_engine.py").read_text(
              encoding="utf-8"
          )
          diagnostics = Path(
              "paper_trading_diagnostics.py"
          ).read_text(encoding="utf-8")
          assert 'portfolio.get("assets", [])' in signal
          assert 'definition.get("assets", [])' in diagnostics
          print(
              "Shadow expansion V2 validated:",
              len(config.get("portfolios", [])),
              "total portfolios.",
          )
          PY

      - name: Commit expansion
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com

          git add \
            paper_trading_config.json \
            paper_signal_engine.py \
            paper_trading_diagnostics.py

          if git diff --cached --quiet; then
            echo "Shadow expansion V2 already installed."
            exit 0
          fi

          git commit -m \
            "Add live-like asset shadow strategy expansion"
          git pull --rebase origin main
          git push origin HEAD:main
