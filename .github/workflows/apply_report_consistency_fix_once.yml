name: Apply Report Consistency Fix Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-report-consistency-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply compact layout and fractal alignment fix
        run: python apply_report_consistency_fix.py

      - name: Detect and compile corrected modules
        shell: bash
        run: |
          set -euo pipefail

          FRACTAL_FILE=""
          for candidate in \
            btc_2022_vs_sol_2026_report.py \
            btc_2022_vs_sol_2026.py
          do
            if [[ -f "$candidate" ]]; then
              FRACTAL_FILE="$candidate"
              break
            fi
          done

          if [[ -z "$FRACTAL_FILE" ]]; then
            echo "Fractal module not found."
            exit 1
          fi

          echo "FRACTAL_FILE=$FRACTAL_FILE" >> "$GITHUB_ENV"
          python -m py_compile \
            compact_latest_report.py \
            "$FRACTAL_FILE" \
            fractal_path_tracker.py

      - name: Commit corrected modules
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            compact_latest_report.py \
            "$FRACTAL_FILE" \
            fractal_path_tracker.py

          if git diff --cached --quiet; then
            echo "Fix already installed; nothing to commit."
          else
            git commit -m "Fix compact report nesting and fractal day alignment"
            git push
          fi
