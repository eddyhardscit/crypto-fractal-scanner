name: Apply Market Regime Research Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-paper-trading.txt

      - name: Install market regime tagger
        run: |
          echo '' | base64 -d > market_regime_tagger.py

      - name: Upgrade Research All Signals
        run: |
          echo '' | base64 -d > research_all_signals.py

      - name: Filter Research to fresh valid signals
        run: |
          echo '' | base64 -d > /tmp/patch_runner.py
          python /tmp/patch_runner.py

      - name: Persist regime files
        run: |
          echo '' | base64 -d > /tmp/patch_storage.py
          python /tmp/patch_storage.py

      - name: Compile modules
        run: |
          python -m py_compile             market_regime_tagger.py             research_all_signals.py             paper_trading_runner.py             paper_trading_storage.py

      - name: Offline regime and research self-test
        run: |
          python - <<'PYTEST'
          from datetime import datetime, timezone
          from types import SimpleNamespace

          import pandas as pd

          import market_regime_tagger as tagger
          import research_all_signals as research

          tagger.LATEST_PATH = (
              tagger.REPORTS_DIR
              / "_test_market_regime_latest.json"
          )
          tagger.HISTORY_PATH = (
              tagger.REPORTS_DIR
              / "_test_market_regime_history.csv"
          )
          research.STATE_PATH = (
              research.REPORTS_DIR
              / "_test_research_state.json"
          )
          research.TRADES_PATH = (
              research.REPORTS_DIR
              / "_test_research_trades.csv"
          )
          research.REPORT_PATH = (
              research.REPORTS_DIR
              / "_test_research_report.md"
          )
          research.LATEST_PATH = (
              research.REPORTS_DIR
              / "_test_research_latest.json"
          )

          paths = [
              tagger.LATEST_PATH,
              tagger.HISTORY_PATH,
              research.STATE_PATH,
              research.TRADES_PATH,
              research.REPORT_PATH,
              research.LATEST_PATH,
          ]
          for path in paths:
              path.unlink(missing_ok=True)

          clock = {
              "value": datetime(
                  2026,
                  7,
                  12,
                  10,
                  5,
                  tzinfo=timezone.utc,
              )
          }
          research.now_utc = lambda: clock["value"]

          def records(
              start,
              periods,
              frequency,
              base,
              slope,
          ):
              index = pd.date_range(
                  start,
                  periods=periods,
                  freq=frequency,
                  tz="UTC",
              )
              rows = []
              for number, stamp in enumerate(index):
                  close = base + slope * number
                  rows.append(
                      {
                          "time": stamp.isoformat(),
                          "open": close * 0.998,
                          "high": close * 1.012,
                          "low": close * 0.992,
                          "close": close,
                          "volume": 1000.0 + number,
                      }
                  )
              return rows

          btc_60 = records(
              "2026-07-04",
              200,
              "1h",
              100.0,
              0.12,
          )
          eth_60 = records(
              "2026-07-04",
              200,
              "1h",
              50.0,
              0.10,
          )
          sol_60 = records(
              "2026-07-04",
              200,
              "1h",
              30.0,
              0.08,
          )
          btc_240 = records(
              "2026-06-10",
              200,
              "4h",
              80.0,
              0.20,
          )
          eth_240 = records(
              "2026-06-10",
              200,
              "4h",
              40.0,
              0.12,
          )
          sol_240 = records(
              "2026-06-10",
              200,
              "4h",
              20.0,
              0.10,
          )

          bundle = {
              "generated_utc": (
                  "2026-07-12T10:00:00+00:00"
              ),
              "assets": {
                  "BTC": {
                      "mark_price": 124.0,
                      "candles": {
                          "60": btc_60,
                          "240": btc_240,
                      },
                  },
                  "ETH": {
                      "mark_price": 70.0,
                      "candles": {
                          "60": eth_60,
                          "240": eth_240,
                      },
                  },
                  "SOL": {
                      "mark_price": 46.0,
                      "candles": {
                          "60": sol_60,
                          "240": sol_240,
                      },
                  },
              },
          }

          regime = tagger.classify_market_regime(
              bundle
          )
          print("Regime:", regime)
          assert regime["regime"] != "UNKNOWN"
          assert regime["confidence_pct"] > 0

          signal = SimpleNamespace(
              portfolio="SHADOW_1H_BALANCED",
              experiment_group_id="evt-regime-1",
              strategy="confluence_trend",
              asset="ETH",
              side="LONG",
              timeframe_minutes=60,
              candle_time=(
                  "2026-07-12T10:00:00+00:00"
              ),
              entry_reference_price=70.0,
              stop_pct=0.02,
              target_pct=0.04,
              max_holding_hours=24,
              score=7.0,
              confidence="ALTA",
          )

          first = research.run_research_cycle(
              [signal],
              bundle,
              {},
          )
          assert first["opened_this_cycle"] == 1
          assert first["open_positions"] == 1
          assert (
              first["current_regime"]["regime"]
              != "UNKNOWN"
          )

          state = research.load_state()
          assert (
              state["open_positions"][0][
                  "entry_regime"
              ]
              != ""
          )

          # Add a candle after the simulated opening
          # that reaches the 4% target.
          bundle["assets"]["ETH"]["candles"][
              "60"
          ].append(
              {
                  "time": (
                      "2026-07-12T11:00:00+00:00"
                  ),
                  "open": 70.0,
                  "high": 74.0,
                  "low": 69.5,
                  "close": 73.0,
                  "volume": 3000.0,
              }
          )
          bundle["assets"]["ETH"][
              "mark_price"
          ] = 73.0
          bundle["generated_utc"] = (
              "2026-07-12T12:00:00+00:00"
          )
          clock["value"] = datetime(
              2026,
              7,
              12,
              12,
              5,
              tzinfo=timezone.utc,
          )

          second = research.run_research_cycle(
              [],
              bundle,
              {},
          )
          assert second["closed_this_cycle"] == 1
          assert second["closed_trades"] == 1
          assert second["open_positions"] == 0
          assert second["regime_matrix"]
          assert (
              "Matrice strategia × regime"
              in second["report_markdown"]
          )

          trades = research.read_trades()
          assert trades[0]["entry_regime"]
          assert trades[0]["exit_regime"]

          print(
              "Market Regime Research self-test: OK"
          )
          PYTEST

      - name: Clean test files
        run: |
          rm -f reports/_test_market_regime_*
          rm -f reports/_test_research_*

      - name: Commit market regime research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             market_regime_tagger.py             research_all_signals.py             paper_trading_runner.py             paper_trading_storage.py

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m               "Add market regime research matrix"
            git push
          fi
