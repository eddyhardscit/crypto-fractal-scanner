name: Apply Paper Diagnostics and Candle Grace Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply persistence and candle grace fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          storage_path = Path("paper_trading_storage.py")
          diagnostics_path = Path("paper_trading_diagnostics.py")
          report_path = Path("paper_trading_report.py")
          config_path = Path("paper_trading_config.json")

          # 1. Persist the structured diagnostics JSON.
          storage = storage_path.read_text(encoding="utf-8")
          diagnostic_file = (
              '    "paper_trading_signal_diagnostics.json",\n'
          )
          storage_anchor = (
              '    "paper_trading_market_cache.json",\n'
          )
          if diagnostic_file not in storage:
              if storage_anchor not in storage:
                  raise SystemExit(
                      "Storage anchor paper_trading_market_cache.json "
                      "not found."
                  )
              storage = storage.replace(
                  storage_anchor,
                  storage_anchor + diagnostic_file,
                  1,
              )
              storage_path.write_text(storage, encoding="utf-8")

          # 2. Keep market-snapshot freshness at 25 minutes, but use
          # timeframe-specific grace after a candle has closed.
          config = json.loads(config_path.read_text(encoding="utf-8"))
          execution = config.setdefault("execution", {})
          execution["stale_data_minutes"] = 25
          execution["candle_grace_minutes_by_timeframe"] = {
              "15": 25,
              "60": 45,
              "240": 60,
          }
          config_path.write_text(
              json.dumps(
                  config,
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )

          diagnostics = diagnostics_path.read_text(encoding="utf-8")

          helper_marker = "CANDLE_GRACE_BY_TIMEFRAME_V1"
          if helper_marker not in diagnostics:
              helper_anchor = "def annotate_market_freshness(\n"
              helper = '''# CANDLE_GRACE_BY_TIMEFRAME_V1
def _candle_grace_minutes(
    config: dict[str, Any],
    timeframe: int,
) -> float:
    execution = dict(config.get("execution", {}))
    mapping = execution.get(
        "candle_grace_minutes_by_timeframe",
        {},
    )
    value = None
    if isinstance(mapping, dict):
        value = mapping.get(str(timeframe))
        if value is None:
            value = mapping.get(timeframe)
    if value is None:
        value = execution.get("stale_data_minutes", 25)
    try:
        return max(0.0, float(value))
    except Exception:
        return 25.0


def annotate_market_freshness(
'''
              if helper_anchor not in diagnostics:
                  raise SystemExit(
                      "annotate_market_freshness anchor not found."
                  )
              diagnostics = diagnostics.replace(
                  helper_anchor,
                  helper,
                  1,
              )

          old_grace_block = '''    grace = float(
        config.get("execution", {}).get(
            "stale_data_minutes",
            25,
        )
    )
'''
          if old_grace_block in diagnostics:
              diagnostics = diagnostics.replace(
                  old_grace_block,
                  "",
                  1,
              )

          loop_anchor = '''    for timeframe in requested:
        latest_values: list[datetime] = []
'''
          loop_replacement = '''    for timeframe in requested:
        grace = _candle_grace_minutes(
            config,
            timeframe,
        )
        latest_values: list[datetime] = []
'''
          if loop_replacement not in diagnostics:
              if loop_anchor not in diagnostics:
                  raise SystemExit(
                      "Timeframe loop anchor not found."
                  )
              diagnostics = diagnostics.replace(
                  loop_anchor,
                  loop_replacement,
                  1,
              )

          old_no_data = '''                "max_candle_age_minutes": None,
                "allowed_age_minutes": timeframe + grace,
                "status": "NO_DATA",
'''
          new_no_data = '''                "max_candle_age_minutes": None,
                "max_close_delay_minutes": None,
                "allowed_age_minutes": timeframe + grace,
                "grace_minutes": grace,
                "status": "NO_DATA",
'''
          if new_no_data not in diagnostics:
              if old_no_data not in diagnostics:
                  raise SystemExit(
                      "NO_DATA freshness block not found."
                  )
              diagnostics = diagnostics.replace(
                  old_no_data,
                  new_no_data,
                  1,
              )

          old_max_age = '''        allowed_age = timeframe + grace
        output[str(timeframe)] = {
'''
          new_max_age = '''        close_delay = max(
            0.0,
            max_age - timeframe,
        )
        allowed_age = timeframe + grace
        output[str(timeframe)] = {
'''
          if new_max_age not in diagnostics:
              if old_max_age not in diagnostics:
                  raise SystemExit(
                      "Timeframe allowed-age anchor not found."
                  )
              diagnostics = diagnostics.replace(
                  old_max_age,
                  new_max_age,
                  1,
              )

          old_output_fields = '''            "max_candle_age_minutes": max_age,
            "allowed_age_minutes": allowed_age,
            "status": (
'''
          new_output_fields = '''            "max_candle_age_minutes": max_age,
            "max_close_delay_minutes": close_delay,
            "allowed_age_minutes": allowed_age,
            "grace_minutes": grace,
            "status": (
'''
          if new_output_fields not in diagnostics:
              if old_output_fields not in diagnostics:
                  raise SystemExit(
                      "Timeframe output fields anchor not found."
                  )
              diagnostics = diagnostics.replace(
                  old_output_fields,
                  new_output_fields,
                  1,
              )

          old_allowed_candle = '''        allowed_candle_age = (
            timeframe
            + float(
                config.get("execution", {}).get(
                    "stale_data_minutes",
                    25,
                )
            )
        )
'''
          new_allowed_candle = '''        candle_grace = _candle_grace_minutes(
            config,
            timeframe,
        )
        allowed_candle_age = timeframe + candle_grace
        close_delay = (
            max(0.0, candle_age - timeframe)
            if candle_age is not None
            else None
        )
'''
          if new_allowed_candle not in diagnostics:
              if old_allowed_candle not in diagnostics:
                  raise SystemExit(
                      "Signal allowed-candle block not found."
                  )
              diagnostics = diagnostics.replace(
                  old_allowed_candle,
                  new_allowed_candle,
                  1,
              )

          old_reason = '''                age_text = (
                    f"{candle_age:.1f}"
                    if candle_age is not None
                    else "n/a"
                )
                reason = (
                    "Ultima candela chiusa troppo vecchia: "
                    f"{age_text} minuti; limite "
                    f"{allowed_candle_age:.0f}."
                )
'''
          new_reason = '''                delay_text = (
                    f"{close_delay:.1f}"
                    if close_delay is not None
                    else "n/a"
                )
                reason = (
                    "Segnale arrivato troppo tardi: candela "
                    f"chiusa da {delay_text} minuti; tolleranza "
                    f"{candle_grace:.0f} minuti."
                )
'''
          if new_reason not in diagnostics:
              if old_reason not in diagnostics:
                  raise SystemExit(
                      "Stale-candle reason block not found."
                  )
              diagnostics = diagnostics.replace(
                  old_reason,
                  new_reason,
                  1,
              )

          old_row_age = '''                "candle_age_minutes": (
                    round(candle_age, 2)
                    if candle_age is not None
                    else None
                ),
                "allowed_candle_age_minutes": (
'''
          new_row_age = '''                "candle_age_minutes": (
                    round(candle_age, 2)
                    if candle_age is not None
                    else None
                ),
                "close_delay_minutes": (
                    round(close_delay, 2)
                    if close_delay is not None
                    else None
                ),
                "candle_grace_minutes": candle_grace,
                "allowed_candle_age_minutes": (
'''
          if new_row_age not in diagnostics:
              if old_row_age not in diagnostics:
                  raise SystemExit(
                      "Signal row age fields anchor not found."
                  )
              diagnostics = diagnostics.replace(
                  old_row_age,
                  new_row_age,
                  1,
              )

          diagnostics_path.write_text(
              diagnostics,
              encoding="utf-8",
          )

          # 3. Make the Markdown report display delay since candle close,
          # not age since candle opening.
          report = report_path.read_text(encoding="utf-8")

          old_tf_age = '''                    item.get(
                        "max_candle_age_minutes"
                    )
'''
          new_tf_age = '''                    item.get(
                        "max_close_delay_minutes"
                    )
'''
          if old_tf_age in report:
              report = report.replace(
                  old_tf_age,
                  new_tf_age,
                  1,
              )

          old_tf_limit = '''                    item.get(
                        "allowed_age_minutes"
                    )
'''
          new_tf_limit = '''                    item.get(
                        "grace_minutes"
                    )
'''
          if old_tf_limit in report:
              report = report.replace(
                  old_tf_limit,
                  new_tf_limit,
                  1,
              )

          report = report.replace(
              '"Età massima",\n                    "Limite",',
              '"Ritardo dopo chiusura",\n'
              '                    "Tolleranza",',
              1,
          )

          old_row_display_age = '''                    row.get(
                        "candle_age_minutes"
                    )
'''
          new_row_display_age = '''                    row.get(
                        "close_delay_minutes"
                    )
'''
          if old_row_display_age in report:
              report = report.replace(
                  old_row_display_age,
                  new_row_display_age,
                  1,
              )

          report = report.replace(
              '"Età candela",',
              '"Ritardo chiusura",',
              1,
          )

          report_path.write_text(report, encoding="utf-8")
          PY

      - name: Validate fixes
        run: |
          set -euxo pipefail
          python -m py_compile \
            paper_trading_storage.py \
            paper_trading_diagnostics.py \
            paper_trading_report.py

          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(
              Path("paper_trading_config.json").read_text(
                  encoding="utf-8"
              )
          )
          execution = config["execution"]
          assert execution["stale_data_minutes"] == 25
          assert execution[
              "candle_grace_minutes_by_timeframe"
          ] == {
              "15": 25,
              "60": 45,
              "240": 60,
          }

          storage = Path(
              "paper_trading_storage.py"
          ).read_text(encoding="utf-8")
          diagnostics = Path(
              "paper_trading_diagnostics.py"
          ).read_text(encoding="utf-8")
          report = Path(
              "paper_trading_report.py"
          ).read_text(encoding="utf-8")

          assert (
              "paper_trading_signal_diagnostics.json"
              in storage
          )
          assert "CANDLE_GRACE_BY_TIMEFRAME_V1" in diagnostics
          assert "max_close_delay_minutes" in diagnostics
          assert "Ritardo dopo chiusura" in report
          assert "Ritardo chiusura" in report
          print("All paper diagnostics fixes validated.")
          PY

      - name: Commit fixes
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com

          git add \
            paper_trading_storage.py \
            paper_trading_diagnostics.py \
            paper_trading_report.py \
            paper_trading_config.json

          if git diff --cached --quiet; then
            echo "Fixes already installed."
          else
            git commit -m \
              "Persist diagnostics and extend candle grace"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
