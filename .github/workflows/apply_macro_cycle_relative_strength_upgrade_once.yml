name: Apply Macro Cycle Relative Strength Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-macro-cycle.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-macro-cycle.txt

      - name: Run offline self-test
        run: python macro_cycle_relative_strength_selftest.py

      - name: Apply source integration and prepare daily workflow
        run: python apply_macro_cycle_relative_strength_upgrade.py

      - name: Compile integrated modules
        run: |
          python -m py_compile \
            relative_strength_btc_report.py \
            btc_macro_cycle_report.py \
            macro_cycle_relative_strength_selftest.py \
            apply_macro_cycle_relative_strength_upgrade.py \
            compact_latest_report.py

      - name: Upload prepared daily workflow and status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-cycle-relative-strength-ready
          path: |
            prepared_macro_cycle_workflow/daily.yml
            reports/macro_cycle_relative_strength_installation_status.md
          if-no-files-found: error
          retention-days: 14

      - name: Commit source integration only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            relative_strength_btc_report.py \
            btc_macro_cycle_report.py \
            macro_cycle_relative_strength_selftest.py \
            apply_macro_cycle_relative_strength_upgrade.py \
            requirements-macro-cycle.txt \
            compact_latest_report.py \
            reports/macro_cycle_relative_strength_installation_status.md
          if git diff --cached --quiet; then
            echo "Nessuna modifica sorgente da committare."
          else
            git commit -m "Add BTC macro cycle and ALT/BTC relative strength"
            git push
          fi
