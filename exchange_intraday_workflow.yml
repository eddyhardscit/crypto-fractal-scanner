name: Collect Exchange Intraday Data

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exchange-persistent-storage
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      EXCHANGE_STORAGE_RELEASE_TAG: exchange-data-v2-1
      EXCHANGE_INTRADAY_RETENTION_DAYS: "180"
      EXCHANGE_COLLECTOR_MODE: github-hosted-kucoin-fallback
      # Binance e Bybit sono disabilitati sul runner GitHub perché l'IP attuale è geobloccato.
      # Il collector esterno opzionale raccoglie tutti e tre gli exchange.
      EXCHANGE_ENABLED_EXCHANGES: kucoin
      EXCHANGE_SKIP_WEBSOCKET: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-exchange-collector.txt

      - name: Install exchange dependencies
        run: python -m pip install -r requirements-exchange-collector.txt

      - name: Restore newest valid exchange state
        run: python exchange_persistent_storage.py restore

      - name: Check whether external collector state is fresh
        id: fallback
        env:
          EXTERNAL_COLLECTOR_FRESH_MINUTES: "90"
          EXTERNAL_MIN_AVAILABLE_PAIRS: "6"
        run: python exchange_fallback_guard.py

      - name: Collect KuCoin fallback snapshot
        if: steps.fallback.outputs.run_fallback == 'true'
        run: python exchange_market_data.py

      - name: Publish redundant rolling state
        if: steps.fallback.outputs.run_fallback == 'true'
        run: python exchange_persistent_storage.py publish-state

      - name: Keep fresh external state
        if: steps.fallback.outputs.run_fallback == 'false'
        run: echo "${{ steps.fallback.outputs.reason }}"

      - name: Audit persistent storage
        run: python exchange_persistent_storage.py audit

      - name: Emergency recovery artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exchange-emergency-state-${{ github.run_id }}
          path: |
            reports/exchange_market_data_intraday.csv
            reports/exchange_market_data_snapshot.json
            reports/exchange_market_data_health.json
            reports/exchange_storage_status.json
            .exchange_storage/
          if-no-files-found: ignore
          retention-days: 7
